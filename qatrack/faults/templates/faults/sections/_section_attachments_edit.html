{% load i18n %}
{% comment %}
  Removing a chip only marks it; the ids go to the server on Save. New files
  are kept on the file input and listed as pending chips until then.
{% endcomment %}
<input type="hidden" name="fault-attachments_delete_ids" value="" data-fl-attach-deletes>
<div class="tle-attach" data-fl-attach>
  {% for attach in attachments %}{% include "faults/sections/_attachment_chip.html" %}{% endfor %}
  <div class="tle-attach" data-fl-attach-pending></div>
  <label class="tle-attach-add">
    <i class="fa fa-paperclip"></i> {% trans "Browse" %}…
    <input type="file" name="fault-attachments" multiple class="fl-file-input" data-fl-attach-input>
  </label>
</div>
<template data-fl-pending-template>
  <span class="tle-attach-item fl-pending">
    <i class="fa fa-upload"></i>
    <span class="tle-attach-name"></span>
    <span class="tle-attach-size">{% trans "pending" %}</span>
    <button type="button" class="tle-attach-x" title="{% trans 'Remove' %}" data-fl-pending-remove>&times;</button>
  </span>
</template>
