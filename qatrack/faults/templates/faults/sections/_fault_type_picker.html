{% load i18n %}
<div class="fl-picker">
  <div class="tl-search">
    <i class="fa fa-search"></i>
    <input type="search" name="q" autocomplete="off" data-fl-picker
           placeholder="{% trans 'Search fault types (2+ characters)…' %}"
           hx-get="{% url 'fault_type_picker' pk=fault.pk %}"
           hx-trigger="input changed delay:250ms, focus"
           hx-include="closest form" hx-target="next .fl-results" hx-swap="innerHTML"
           hx-indicator="closest .fl-picker">
  </div>
  <div class="fl-results"></div>
</div>
