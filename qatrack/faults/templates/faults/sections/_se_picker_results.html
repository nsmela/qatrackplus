{% load i18n %}
{% for se in results %}
  <button type="button" class="tl-pick-item"
          hx-get="{% url 'fault_se_picker_row' pk=fault_pk %}?se={{ se.id }}"
          hx-target="#related-se-rows" hx-swap="beforeend">
    <span class="tl-pick-main">
      <span class="tl-pick-name">
        #{{ se.id }}
        <span class="label service-event-status-label" style="border-color: {{ se.service_status.colour }}">{{ se.service_status.name }}</span>
        <span class="fl-meta">{{ se.datetime_service|date }}</span>
      </span>
      <span class="tl-pick-sub">{{ se.problem_description }}</span>
    </span>
    <i class="fa fa-plus-circle"></i>
  </button>
{% empty %}
  <div class="tl-pick-hint">{% trans "No matches." %}</div>
{% endfor %}
