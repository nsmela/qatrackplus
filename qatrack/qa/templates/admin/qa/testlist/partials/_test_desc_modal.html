{% load i18n static %}
<div class="tl-modal-backdrop" id="tl-desc-modal-backdrop">
  <div class="tl-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="tl-desc-title">
    <div class="tl-modal-header">
      <h3 class="tl-modal-title" id="tl-desc-title"><i class="fa fa-align-left" aria-hidden="true"></i> {% blocktrans with name=test.name %}Description for {{ name }}{% endblocktrans %}</h3>
      <button type="button" class="tl-modal-close-btn" data-modal-close
              title="{% trans 'Close' %}" aria-label="{% trans 'Close' %}">&times;</button>
    </div>
    <form hx-post="{% url 'admin:qa_testlist_test_desc_modal' %}?test_id={{ test.id }}&index={{ index }}"
          hx-target="#tl-desc-wrap-{{ test.id }}-{{ index }}"
          hx-swap="innerHTML"
          data-modal-form>
      {% csrf_token %}
      <div class="tl-modal-body">
        <p class="tl-modal-note">{% trans "Saving updates this test straight away, in every test list that uses it. It doesn't wait for you to save this test list." %}</p>
        <div id="tl-desc-error-msg" class="tl-dup-error-banner" role="alert" hidden></div>
        <label for="tl-modal-desc-input">{% trans "Description (HTML allowed)" %}</label>
        <textarea name="description" id="tl-modal-desc-input" rows="5" class="tl-modal-textarea">{{ test.description|default:'' }}</textarea>
      </div>
      <div class="tl-modal-footer">
        <button type="button" class="tl-btn-modal-cancel" data-modal-close>{% trans "Cancel" %}</button>
        <button type="submit" class="tl-btn-modal-save">
          <i class="fa fa-check" aria-hidden="true"></i> {% trans "Save Description" %}
        </button>
      </div>
    </form>
  </div>
</div>
