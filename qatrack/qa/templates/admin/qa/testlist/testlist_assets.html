        var errMsg = (err instanceof TypeError || !err.message)
          ? gettext("Couldn't create the test. Nothing was saved. Try again.") : err.message;
        if (errorBox) {
          errorBox.textContent = errMsg;
          errorBox.style.display = "block";
        } else {
          alert(errMsg);
        }
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa fa-clone" aria-hidden="true"></i> ' + escapeHtml(gettext("Create & Add Test"));
        }
      });
      return;
    }

    if (e.target.matches("form")) {
      syncOrder();
    }
  });

  // ---- Builder dialog focus (search, Duplicate Test, Description) ----
  // Like the Save As, Assign and Unsaved dialogs: the first field gets focus on
  // open, Tab stays inside the dialog, Esc closes it, and focus goes back to the
  // control that opened it. The search dialog and #tl-modal-container sit after
  // the change form (see change_form.html), never inside it.
  var builderDialogFocus = { searchOpener: null, containerOpener: null, containerWrapId: null };

  function focusIfThere(el) {
    if (el && el.isConnected && typeof el.focus === "function") {
      el.focus();
      return document.activeElement === el;
    }
    return false;
  }

  function closeSearchModal() {
    var modal = document.getElementById("tl-search-modal");
    if (!modal || modal.hidden) { return; }
    modal.hidden = true;
    var opener = builderDialogFocus.searchOpener;
    builderDialogFocus.searchOpener = null;
    focusIfThere(opener);
  }

  // Closes the Duplicate Test or Description dialog; false if neither was open.
  function closeContainerDialog() {
    var container = document.getElementById("tl-modal-container");
    var backdrop = container && container.querySelector(".tl-modal-backdrop");
    if (!backdrop) { return false; }
    container.innerHTML = "";
    var opener = builderDialogFocus.containerOpener;
    var wrap = builderDialogFocus.containerWrapId ? document.getElementById(builderDialogFocus.containerWrapId) : null;
    builderDialogFocus.containerOpener = null;
    builderDialogFocus.containerWrapId = null;
    // A saved description replaces its cell, so fall back to the new button there.
    if (!focusIfThere(opener) && wrap) { focusIfThere(wrap.querySelector("button")); }
    return true;
  }

  // Description dialog (htmx): remember its opener, and don't open it in machine
  // mode (the cell can't be clicked there, but a keyboard press would still fire).
  document.addEventListener("htmx:beforeRequest", function (e) {
    var elt = e.detail && e.detail.elt;
    if (!elt || !elt.matches || !elt.matches(".tl-test-desc, .tl-add-desc-btn")) { return; }
    if (document.body.classList.contains("tl-mode-machine")) {
      e.preventDefault();
      return;
    }
    var wrap = elt.closest(".tl-test-desc-wrap");
    builderDialogFocus.containerOpener = elt;
    builderDialogFocus.containerWrapId = wrap ? wrap.id : null;
  });

  document.addEventListener("htmx:afterSwap", function (e) {
    if (!e.detail || !e.detail.target || e.detail.target.id !== "tl-modal-container") { return; }
    var textarea = document.getElementById("tl-modal-desc-input");
    if (textarea) { textarea.focus(); }
  });

  // Description saved: the cell was swapped in place; close the dialog. On an
  // error, say so in the dialog (htmx doesn't swap error responses).
  document.addEventListener("htmx:afterRequest", function (e) {
    var elt = e.detail && e.detail.elt;
    if (!elt || !elt.matches || !elt.matches("form[data-modal-form]")) { return; }
    if (e.detail.successful) {
      closeContainerDialog();
      return;
    }
    var errorBox = document.getElementById("tl-desc-error-msg");
    var xhr = e.detail.xhr;
    var text = xhr && xhr.status ? (xhr.responseText || "") : "";
    var msg = text && !/^\s*</.test(text) ? text : gettext("Couldn't save the description. Nothing was saved. Try again.");
    if (errorBox) {
      errorBox.textContent = msg;
      errorBox.hidden = false;
    }
  });

  // Enter in the search box only searches; it must never submit anything.
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.id === "tl-search-input") { e.preventDefault(); }
  });

  // Close on Esc
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      var sModalEsc = document.getElementById("tl-search-modal");
      if (sModalEsc && !sModalEsc.hidden) { closeSearchModal(); }
      closeContainerDialog();
    }
  });

  // Keep Tab inside the open builder dialog (the Unsaved dialog handles its own).
  var DIALOG_FOCUSABLE = "a[href], button:not([disabled]), input:not([disabled]):not([type='hidden'])," +
    " select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex='-1'])";
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Tab" || e.defaultPrevented) { return; }
    if (document.querySelector("#tl-unsaved-modal:not([hidden])")) { return; }
    var open = document.querySelectorAll(".tl-modal-backdrop:not([hidden])");
    var modal = open.length ? open[open.length - 1] : null;
    if (!modal) { return; }
    var items = Array.prototype.filter.call(modal.querySelectorAll(DIALOG_FOCUSABLE), function (el) {
      return el.getClientRects().length > 0;
    });
    if (!items.length) { e.preventDefault(); return; }
    var first = items[0];
    var last = items[items.length - 1];
    var active = document.activeElement;
    if (!modal.contains(active)) {
      e.preventDefault();
      (e.shiftKey ? last : first).focus();
    } else if (e.shiftKey && active === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && active === last) {
      e.preventDefault();
      first.focus();
    }
  });

  // ---- Assign to Machine dialog ----
  // Loads the dialog from TestListAdmin's assign-machine endpoint and appends it
  // to <body>, outside the change form, so its inputs are never posted with the
  // test list and the unsaved-changes check never sees them. Clicking Assign
  // saves the assignment (a UnitTestCollection) with its own request, straight away.
  var assignState = { busy: false, noteTimer: null };

  function assignOpener() { return document.getElementById("tl-btn-assign-machine"); }
  function assignModal() { return document.getElementById("tl-assign-modal"); }

  function hideAssignNote() {
    var note = document.getElementById("tl-assign-note");
    clearTimeout(assignState.noteTimer);
    if (note) {
      note.hidden = true;
      note.classList.remove("tl-assign-note-fading");
    }
  }

  // A short note beside the dropdown. Success notes fade after a few seconds;
  // errors stay until dismissed.
  function showAssignNote(msg, isError) {
    var note = document.getElementById("tl-assign-note");
    var text = document.getElementById("tl-assign-note-text");
    var icon = document.getElementById("tl-assign-note-icon");
    if (!note || !text) { return; }
    clearTimeout(assignState.noteTimer);
    text.textContent = msg;
    if (icon) { icon.className = "fa " + (isError ? "fa-exclamation-circle" : "fa-check"); }
    note.classList.toggle("tl-assign-note-error", !!isError);
    note.classList.remove("tl-assign-note-fading");
    note.hidden = false;
    if (!isError) {
      assignState.noteTimer = setTimeout(function () {
        note.classList.add("tl-assign-note-fading");
        assignState.noteTimer = setTimeout(hideAssignNote, 400);
      }, 6000);
    }
  }

  // Put (or re-put) the dialog's HTML in its container on <body> and focus the
  // first field, or the first field with an error.
  function mountAssignDialog(html) {
    var container = document.getElementById("tl-assign-container");
    if (!container) {
      container = document.createElement("div");
      container.id = "tl-assign-container";
      document.body.appendChild(container);
    }
    container.innerHTML = html;
    var modal = assignModal();
    if (!modal) { return; }
    var errField = modal.querySelector(".tl-assign-error");
    var target = (errField && errField.closest(".tl-modal-field").querySelector("select, input")) ||
      modal.querySelector(".tl-modal-input");
    if (target) { target.focus(); }
  }

  function openAssignDialog() {
    var opener = assignOpener();
    if (!opener || opener.disabled || assignModal()) { return; }
    hideAssignNote();
    fetch(opener.getAttribute("data-assign-url"), {
      credentials: "same-origin",
      headers: { "X-Requested-With": "XMLHttpRequest" }
    })
      .then(function (res) {
        if (!res.ok) { throw new Error(String(res.status)); }
        return res.text();
      })
      .then(mountAssignDialog)
      .catch(function () {
        showAssignNote(opener.getAttribute("data-msg-load-error") ||
          gettext("Couldn't open the Assign to Machine dialog. Nothing was saved. Try again."), true);
      });
  }

  function closeAssignDialog() {
    var container = document.getElementById("tl-assign-container");
    if (!container || !assignModal()) { return; }
    container.innerHTML = "";
    assignState.busy = false;
    var opener = assignOpener();
    if (opener) { opener.focus(); }
  }

  function setAssignSubmitting(on) {
    var btn = document.getElementById("tl-assign-submit");
    if (!btn) { return; }
    btn.disabled = on;
    btn.innerHTML = on
      ? '<i class="fa fa-spinner fa-spin" aria-hidden="true"></i> ' + escapeHtml(gettext("Assigning…"))
      : '<i class="fa fa-plus" aria-hidden="true"></i> ' + escapeHtml(gettext("Assign"));
  }

  // Add the newly assigned unit to the Editing dropdown's direct options, in
  // name order, moving it out of "Through other test lists" if it was there.
  // The current selection stays as it was.
  function addAssignedScopeOption(data) {
    var select = document.getElementById("tl-machine-scope-select");
    if (!select || !data.show_in_scope) { return; }
    var current = select.value;
    var id = String(data.unit_id);
    // Preview tab: it's now a direct assignment, so the real Perform QC page can be shown
    if (data.preview_url) { getPreviewUnits()[id] = { preview_url: data.preview_url }; }
    var opt = Array.prototype.filter.call(select.options, function (o) { return o.value === id; })[0];
    if (!opt) {
      opt = document.createElement("option");
      opt.value = id;
    }
    opt.setAttribute("data-unit-name", data.unit_name);
    opt.textContent = data.label;
    if (opt.parentNode !== select) {
      var group = opt.parentNode;
      if (group) {
        group.removeChild(opt);
        if (!group.children.length) { group.parentNode.removeChild(group); }
      }
      var before = Array.prototype.filter.call(select.children, function (el) {
        if (el.tagName === "OPTGROUP") { return true; }
        return el.value !== "base" && el.textContent.trim().localeCompare(data.label) > 0;
      })[0];
      select.insertBefore(opt, before || null);
    }
    select.value = current;
    // Shown right now (it was listed "through" another list): refresh its details.
    if (current === id && scopeState.unitId === id) { applyScope(select); }
  }

  function submitAssign(form) {
    if (assignState.busy) { return; }
    assignState.busy = true;
    setAssignSubmitting(true);
    var opener = assignOpener();
    fetch(form.action, {
      method: "POST",
      body: new FormData(form),
      credentials: "same-origin",
      headers: { "X-Requested-With": "XMLHttpRequest" }
    })
      .then(function (res) {
        if (res.status === 422) {
          return res.text().then(function (html) {
            assignState.busy = false;
            mountAssignDialog(html);
          });
        }
        if (!res.ok) { throw new Error(String(res.status)); }
        return res.json().then(function (data) {
          if (!data || !data.ok) { throw new Error("bad response"); }
          closeAssignDialog();
          addAssignedScopeOption(data);
          showAssignNote(data.message, false);
        });
      })
      .catch(function () {
        assignState.busy = false;
        setAssignSubmitting(false);
        var alert = document.getElementById("tl-assign-alert");
        var alertText = document.getElementById("tl-assign-alert-text");
        if (alert && alertText) {
          alertText.textContent = (opener && opener.getAttribute("data-msg-save-error")) ||
            gettext("Couldn't assign the machine. Nothing was saved. Try again.");
          alert.hidden = false;
        }
      });
  }

  document.addEventListener("click", function (e) {
    if (!e.target.closest) { return; }
    if (e.target.closest("#tl-btn-assign-machine")) {
      e.preventDefault();
      openAssignDialog();
    } else if (e.target.closest("#tl-assign-modal [data-assign-close]") || e.target.id === "tl-assign-modal") {
      e.preventDefault();
      closeAssignDialog();
    } else if (e.target.closest("#tl-assign-note-close")) {
      e.preventDefault();
      hideAssignNote();
    }
  });

  document.addEventListener("submit", function (e) {
    if (e.target && e.target.id === "tl-assign-form") {
      e.preventDefault();
      submitAssign(e.target);
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && assignModal()) {
      e.preventDefault();
      closeAssignDialog();
    }
  });

  // ---- Save As… dialog ----
  // Copies the dialog's name and slug into the main form, adds the hidden
  // _saveasnew/_saveas_source inputs and submits the change form, so Django
  // creates a new test list from everything on the page (unsaved edits included).
  var SAVEAS_SLUG_FORMAT = /^[a-z0-9_-]+$/;
  var saveAsCheckSeq = 0;
  var saveAsCheckTimer = null;
  var saveAsSlugOk = false;

  function saveAsEls() {
    var modal = document.getElementById("tl-saveas-modal");
    if (!modal) { return null; }
    return {
      modal: modal,
      name: document.getElementById("tl-saveas-name"),
      nameError: document.getElementById("tl-saveas-name-error"),
      slug: document.getElementById("tl-saveas-slug"),
      slugError: document.getElementById("tl-saveas-slug-error"),
      submit: document.getElementById("tl-saveas-submit"),
      url: modal.getAttribute("data-slug-available-url") || "",
      sourceId: modal.getAttribute("data-source-id") || ""
    };
  }

  function setSaveAsError(input, errorEl, msg) {
    if (!input || !errorEl) { return; }
    errorEl.textContent = msg || "";
    errorEl.hidden = !msg;
    input.classList.toggle("tl-input-invalid", !!msg);
    if (msg) {
      input.setAttribute("aria-invalid", "true");
    } else {
      input.removeAttribute("aria-invalid");
    }
  }

  function updateSaveAsSubmit(els) {
    els.submit.disabled = !saveAsSlugOk || !els.name.value.trim();
  }

  // Check the slug's format, then ask the server whether it's free. With
  // adoptSuggestion (used for the prefill), a taken slug is swapped for the
  // first free -2, -3… variant instead of showing an error.
  function checkSaveAsSlug(adoptSuggestion) {
    var els = saveAsEls();
    if (!els) { return Promise.resolve(false); }
    var seq = ++saveAsCheckSeq;
    var slug = els.slug.value.trim();
    saveAsSlugOk = false;
    if (!slug) {
      setSaveAsError(els.slug, els.slugError, gettext("Enter a slug for the new test list."));
      updateSaveAsSubmit(els);
      return Promise.resolve(false);
    }
    if (!SAVEAS_SLUG_FORMAT.test(slug)) {
      setSaveAsError(els.slug, els.slugError, gettext("Use only lowercase letters, numbers, hyphens and underscores."));
      updateSaveAsSubmit(els);
      return Promise.resolve(false);
    }
    setSaveAsError(els.slug, els.slugError, "");
    updateSaveAsSubmit(els);
    var sep = els.url.indexOf("?") === -1 ? "?" : "&";
    return fetch(els.url + sep + "slug=" + encodeURIComponent(slug), {
      credentials: "same-origin",
      headers: { "X-Requested-With": "XMLHttpRequest" }
    })
      .then(function (res) {
        if (!res.ok) { throw new Error(String(res.status)); }
        return res.json();
      })
      .then(function (data) {
        if (seq !== saveAsCheckSeq) { return false; }
        if (data.available) {
          saveAsSlugOk = true;
        } else if (adoptSuggestion && data.suggestion) {
          els.slug.value = data.suggestion;
          saveAsSlugOk = true;
        } else if (data.valid === false) {
          setSaveAsError(els.slug, els.slugError, gettext("Use only lowercase letters, numbers, hyphens and underscores."));
        } else {
          setSaveAsError(els.slug, els.slugError, gettext("Another test list already uses this slug. Choose a different one."));
        }
        updateSaveAsSubmit(els);
        return saveAsSlugOk;
      })
      .catch(function () {
        if (seq !== saveAsCheckSeq) { return false; }
        setSaveAsError(els.slug, els.slugError,
          gettext("Couldn't check whether this slug is free. Check your connection, then edit the slug to try again."));
        updateSaveAsSubmit(els);
        return false;
      });
  }

  function openSaveAsDialog() {
    var els = saveAsEls();
    if (!els) { return; }
    var mainName = document.getElementById("id_name");
    var mainSlug = document.getElementById("id_slug");
    var curName = mainName ? mainName.value.trim() : "";
    var curSlug = mainSlug ? mainSlug.value.trim().toLowerCase() : "";
    if (!curSlug) {
      curSlug = curName.toLowerCase().replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "");
    }
    els.name.value = curName ? interpolate(gettext("%(name)s (Copy)"), { name: curName }, true) : "";
    els.slug.value = curSlug ? curSlug + "-copy" : "copy";
    setSaveAsError(els.name, els.nameError, "");
    setSaveAsError(els.slug, els.slugError, "");
    els.submit.innerHTML = '<i class="fa fa-files-o" aria-hidden="true"></i> ' + escapeHtml(gettext("Save As New Test List"));
    els.modal.hidden = false;
    els.name.focus();
    els.name.select();
    checkSaveAsSlug(true);
  }

  function closeSaveAsDialog() {
    var els = saveAsEls();
    if (!els || els.modal.hidden) { return; }
    saveAsCheckSeq++;
    els.modal.hidden = true;
    var opener = document.getElementById("tl-saveas-open-btn");
    if (opener) { opener.focus(); }
  }

  function submitSaveAs() {
    var els = saveAsEls();
    if (!els || els.submit.disabled) { return; }
    var name = els.name.value.trim();
    if (!name) {
      setSaveAsError(els.name, els.nameError, gettext("Enter a name for the new test list."));
      els.name.focus();
      return;
    }
    els.submit.disabled = true;
    checkSaveAsSlug(false).then(function (ok) {
      if (!ok) { els.slug.focus(); return; }
      var form = els.modal.closest("form");
      var mainName = document.getElementById("id_name");
      var mainSlug = document.getElementById("id_slug");
      if (!form || !mainName || !mainSlug) { return; }
      // Remember what the original's fields held, so a page restored from the
      // back/forward cache doesn't keep the copy's name and slug (see pageshow).
      if (!form.hasAttribute("data-tl-saveas-orig-name")) {
        form.setAttribute("data-tl-saveas-orig-name", mainName.value);
        form.setAttribute("data-tl-saveas-orig-slug", mainSlug.value);
      }
      mainName.value = name;
      mainSlug.value = els.slug.value.trim();
      form.querySelectorAll("input[data-tl-saveas]").forEach(function (el) { el.remove(); });
      [["_saveasnew", "1"], ["_saveas_source", els.sourceId]].forEach(function (pair) {
        var input = document.createElement("input");
        input.type = "hidden";
        input.name = pair[0];
        input.value = pair[1];
        input.setAttribute("data-tl-saveas", "");
        form.appendChild(input);
      });
      els.submit.disabled = true;
      els.submit.innerHTML = '<i class="fa fa-spinner fa-spin" aria-hidden="true"></i> ' + escapeHtml(gettext("Saving…"));
      if (form.requestSubmit) {
        form.requestSubmit();  // fires the submit listeners (e.g. syncOrder)
      } else {
        syncOrder();
        form.submit();
      }
    });
  }

  document.addEventListener("click", function (e) {
    if (!e.target.closest) { return; }
    if (e.target.closest("#tl-saveas-open-btn")) {
      e.preventDefault();
      openSaveAsDialog();
    } else if (e.target.closest("[data-saveas-close]")) {
      e.preventDefault();
      closeSaveAsDialog();
    } else if (e.target.closest("#tl-saveas-submit")) {
      e.preventDefault();
      submitSaveAs();
    }
  });

  document.addEventListener("input", function (e) {
    var els = saveAsEls();
    if (!els) { return; }
    if (e.target === els.name) {
      if (els.name.value.trim()) { setSaveAsError(els.name, els.nameError, ""); }
      updateSaveAsSubmit(els);
    } else if (e.target === els.slug) {
      saveAsSlugOk = false;
      updateSaveAsSubmit(els);
      clearTimeout(saveAsCheckTimer);
      saveAsCheckTimer = setTimeout(function () { checkSaveAsSlug(false); }, 300);
    }
  });

  document.addEventListener("keydown", function (e) {
    var els = saveAsEls();
    if (!els || els.modal.hidden) { return; }
    if (e.key === "Escape") {
      closeSaveAsDialog();
    } else if (e.key === "Enter" && (e.target === els.name || e.target === els.slug)) {
      // the dialog sits inside the main form: stop Enter submitting it as a plain save
      e.preventDefault();
      submitSaveAs();
    }
  });

  // Back/forward cache: undo a Save As that was already submitted from this page.
  window.addEventListener("pageshow", function (e) {
    if (!e.persisted) { return; }
    var els = saveAsEls();
    var form = els ? els.modal.closest("form") : null;
    if (!form) { return; }
    form.querySelectorAll("input[data-tl-saveas]").forEach(function (el) { el.remove(); });
    if (form.hasAttribute("data-tl-saveas-orig-name")) {
      document.getElementById("id_name").value = form.getAttribute("data-tl-saveas-orig-name");
      document.getElementById("id_slug").value = form.getAttribute("data-tl-saveas-orig-slug");
      form.removeAttribute("data-tl-saveas-orig-name");
      form.removeAttribute("data-tl-saveas-orig-slug");
    }
    els.modal.hidden = true;
  });

  function escapeHtml(text) {
    if (!text) { return ""; }
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function initAttachmentsSection() {
    var fileInput = document.getElementById("id_tl-new-attachments");
    var container = document.getElementById("attachments-editor-container");
    if (!container || !fileInput) { return; }

    var prefix = container.getAttribute("data-prefix") || "attachments_attachment_set";
    var parentId = container.getAttribute("data-parent-id") || "";
    var totalFormsInput = document.getElementById("id_" + prefix + "-TOTAL_FORMS");
    var pendingList = document.getElementById("pending-attachments-list");
    var formsetInputsContainer = document.getElementById("new-attachments-formset-inputs");

    // Browse… is a real button (keyboard access); it opens the hidden file input.
    var browseBtn = document.getElementById("tl-browse-btn");
    if (browseBtn && !browseBtn.hasAttribute("data-tl-init")) {
      browseBtn.setAttribute("data-tl-init", "");
      browseBtn.addEventListener("click", function (e) {
        e.preventDefault();
        fileInput.click();
      });
    }

    function updateAttachmentCounts() {
      var existingVisible = document.querySelectorAll("#existing-attachments-list .attachment-card:not([style*='display: none'])").length;
      var pendingCount = document.querySelectorAll("#pending-attachments-list .attachment-card").length;
      var total = existingVisible + pendingCount;
      var badge = document.getElementById("tl-attachments-count");
      if (badge) { badge.textContent = total; }
      var emptyMsg = document.getElementById("tl-empty-attachments-msg");
      if (emptyMsg) {
        emptyMsg.style.display = total === 0 ? "block" : "none";
      }
    }

    // Existing attachments deletion
    document.addEventListener("click", function(e) {
      var delBtn = e.target.closest(".btn-delete-existing");
      if (delBtn) {
        e.preventDefault();
        var attachId = delBtn.getAttribute("data-id");
        var card = document.getElementById("existing-attach-" + attachId);
        if (card) {
          card.style.display = "none";
          var delCheckbox = card.querySelector(".attach-delete");
          if (delCheckbox) { delCheckbox.checked = true; }
          updateAttachmentCounts();
        }
      }
    });

    // File input change: add pending attachment cards and Django formset file inputs
    fileInput.addEventListener("change", function () {
      if (!this.files || !this.files.length) { return; }

      var currentTotal = totalFormsInput ? (parseInt(totalFormsInput.value, 10) || 0) : 0;

      Array.from(this.files).forEach(function (file) {
        var newIndex = currentTotal;
        var url = URL.createObjectURL(file);
        var sizeKB = (file.size / 1024).toFixed(1);

        // 1. Create pending visual card matching Fault Logs
        var card = document.createElement("div");
        card.className = "attachment-card pending";
        card.id = "pending-attach-" + newIndex;
        var previewLabel = interpolate(gettext("Preview %(name)s"), { name: file.name }, true);
        var removeLabel = interpolate(gettext("Remove %(name)s"), { name: file.name }, true);
        var commentPlaceholder = gettext("Add an optional comment…");
        card.innerHTML =
          '<div class="attachment-name">' +
            '<i class="fa fa-upload fa-fw tl-attach-icon" aria-hidden="true"></i> ' +
            '<strong>' + escapeHtml(file.name) + '</strong> ' +
            '<span class="tl-attach-size">(' + escapeHtml(interpolate(gettext("%(size)s KB"), { size: sizeKB }, true)) + ')</span>' +
            '<input type="text" name="' + prefix + '-' + newIndex + '-comment" placeholder="' + escapeHtml(commentPlaceholder) + '"' +
              ' aria-label="' + escapeHtml(commentPlaceholder) + '" class="tl-pending-comment-input">' +
          '</div>' +
          '<div class="attachment-actions">' +
            '<a href="' + url + '" target="_blank" class="tl-attach-btn"' +
              ' title="' + escapeHtml(gettext("Preview")) + '" aria-label="' + escapeHtml(previewLabel) + '">' +
              '<i class="fa fa-eye" aria-hidden="true"></i></a>' +
            '<button type="button" class="tl-attach-btn tl-attach-btn-remove btn-remove-pending" data-index="' + newIndex + '"' +
              ' title="' + escapeHtml(gettext("Remove")) + '" aria-label="' + escapeHtml(removeLabel) + '">' +
              '<i class="fa fa-trash-o" aria-hidden="true"></i></button>' +
          '</div>';
        pendingList.appendChild(card);

        // 2. Create actual Django formset input with DataTransfer
        var dt = new DataTransfer();
        dt.items.add(file);

        var rowDiv = document.createElement("div");
        rowDiv.id = "formset-row-" + newIndex;

        var input = document.createElement("input");
        input.type = "file";
        input.name = prefix + "-" + newIndex + "-attachment";
        input.files = dt.files;
        rowDiv.appendChild(input);

        if (parentId) {
          var fkInput = document.createElement("input");
          fkInput.type = "hidden";
          fkInput.name = prefix + "-" + newIndex + "-testlist";
          fkInput.value = parentId;
          rowDiv.appendChild(fkInput);
        }

        formsetInputsContainer.appendChild(rowDiv);

        currentTotal++;
      });

      if (totalFormsInput) {
        totalFormsInput.value = currentTotal;
      }
      this.value = "";
      updateAttachmentCounts();
    });

    // Remove pending attachment
    document.addEventListener("click", function(e) {
      var removeBtn = e.target.closest(".btn-remove-pending");
      if (removeBtn) {
        e.preventDefault();
        var index = removeBtn.getAttribute("data-index");
        var card = document.getElementById("pending-attach-" + index);
        if (card) { card.remove(); }
        var row = document.getElementById("formset-row-" + index);
        if (row) { row.remove(); }
        updateAttachmentCounts();
      }
    });

    updateAttachmentCounts();
  }

  // ---- Editing scope: base list vs. one machine ----
  // Machine mode shows one unit's references and tolerances (its UnitTestInfo
  // for each test, read-only, with a pencil to its admin page) and locks the
  // shared settings. The body class .tl-mode-machine drives the CSS.
  // limits: test id -> machine_limit_usage() for the shown unit's tests
  var scopeState = { unitId: null, unitName: "", request: 0, limits: {} };

  function scopeMsg(key) {
    var card = document.getElementById("tl-control-card");
    return card ? (card.getAttribute("data-msg-" + key) || "") : "";
  }

  function scopeTestIds(root) {
    var ids = [];
    (root || document).querySelectorAll("tr.tl-test-row[data-test-id], tr.tl-sublist-test-row[data-test-id]")
      .forEach(function (r) {
        var id = r.getAttribute("data-test-id");
        if (id && ids.indexOf(id) === -1) { ids.push(id); }
      });
    if (root && root.matches && root.matches("tr.tl-test-row[data-test-id]")) {
      var own = root.getAttribute("data-test-id");
      if (own && ids.indexOf(own) === -1) { ids.push(own); }
    }
    return ids;
  }

  function fetchMachineValues(unitId, ids) {
    var card = document.getElementById("tl-control-card");
    var url = card.getAttribute("data-machine-values-url") +
      "?unit=" + encodeURIComponent(unitId) +
      "&tests=" + encodeURIComponent(ids.join(",")) +
      "&test_list=" + encodeURIComponent(card.getAttribute("data-test-list-id") || "");
    return fetch(url, { credentials: "same-origin", headers: { "Accept": "application/json" } })
      .then(function (res) {
        if (!res.ok) { throw new Error("HTTP " + res.status); }
        return res.json();
      });
  }

  // One Reference or Tolerance cell. `use` is how this test's type uses the value
  // (machine_limit_usage): "required" values that are missing are highlighted,
  // since results on this unit will show No Tol Set; "unused" ones say Not used.
  function machineValueHtml(value, use, unusedTitle) {
    if (value !== null && value !== undefined && value !== "") {
      return '<span class="tl-machine-value">' + escapeHtml(value) + '</span>';
    }
    if (use === "unused") {
      return '<span class="tl-machine-unused" title="' +
        escapeHtml(unusedTitle || gettext("Limits don't apply to this test type: its results never pass or fail.")) + '">' +
        escapeHtml(gettext("Not used")) + '</span>';
    }
    if (use === "required") {
      var title = interpolate(gettext("No limits set: results on %(unit)s will show No Tol Set"),
        { unit: scopeState.unitName }, true);
      return '<span class="tl-machine-missing" title="' + escapeHtml(title) + '">' +
        '<i class="fa fa-exclamation-circle" aria-hidden="true"></i>' +
        escapeHtml(scopeMsg("not-set")) + '<span class="tl-visually-hidden">: ' + escapeHtml(title) + '</span></span>';
    }
    return '<span class="tl-machine-none">' + escapeHtml(scopeMsg("not-set")) + '</span>';
  }

  // Reference and Tolerance dialog URL for one UnitTestInfo, or "" when this
  // user can only view the values (the template leaves the attribute out).
  function refTolUrl(utiId) {
    var card = document.getElementById("tl-control-card");
    var base = card ? card.getAttribute("data-ref-tol-url") : "";
    if (!base || !utiId) { return ""; }
    return base.replace(/\/0\/$/, "/" + encodeURIComponent(utiId) + "/");
  }

  function rowTestName(row) {
    var name = null;
    Array.prototype.forEach.call(row.children, function (td) {
      if (!name && td.classList.contains("tl-cell-test")) { name = td.querySelector(".tl-test-name"); }
    });
    return name ? name.textContent.trim() : "";
  }

  // Fill one row's own Reference / Tolerance cells (not those of a nested table).
  function fillMachineRow(r, info, limits) {
    var refCell = null, tolCell = null;
    Array.prototype.forEach.call(r.children, function (td) {
      if (td.classList.contains("tl-col-ref")) { refCell = td; }
      if (td.classList.contains("tl-col-tol")) { tolCell = td; }
    });
    if (!refCell || !tolCell) { return; }
    limits = limits || { uses_limits: true, reference: "required", tolerance: "required" };
    if (!info) {
      // No UnitTestInfo yet: QATrack+ creates it when the test list is saved.
      refCell.innerHTML = machineValueHtml(null, limits.uses_limits ? "optional" : "unused");
      tolCell.innerHTML = machineValueHtml(null, limits.uses_limits ? "optional" : "unused");
      if (limits.uses_limits) {
        tolCell.innerHTML += '<span class="tl-machine-hint" title="' +
          escapeHtml(interpolate(gettext("Save the test list first: QATrack+ adds this test to %(unit)s when it's saved."),
            { unit: scopeState.unitName }, true)) + '">' +
          escapeHtml(gettext("Save the test list first")) + '</span>';
      }
      return;
    }
    refCell.innerHTML = machineValueHtml(info.reference, limits.reference,
      limits.uses_limits ? gettext("This test type has no reference: only its tolerance is used.") : "");
    var tolHtml = machineValueHtml(info.tolerance, limits.tolerance);
    var dialogUrl = refTolUrl(info.uti_id);
    if (limits.uses_limits && dialogUrl) {
      var setLabel = interpolate(gettext("Set reference and tolerance for %(test)s on %(unit)s"),
        { test: rowTestName(r), unit: scopeState.unitName }, true);
      tolHtml += '<button type="button" class="tl-machine-edit tl-machine-reftol-btn" aria-haspopup="dialog"' +
        ' data-reftol-url="' + escapeHtml(dialogUrl) + '"' +
        ' title="' + escapeHtml(setLabel) + '" aria-label="' + escapeHtml(setLabel) + '">' +
        '<i class="fa fa-pencil" aria-hidden="true"></i></button>';
    } else if (limits.uses_limits && info.uti_url) {
      var label = interpolate(scopeMsg("edit-uti"), { unit: scopeState.unitName }, true);
      tolHtml += '<a href="' + escapeHtml(info.uti_url) + '" target="_blank" rel="noopener" class="tl-machine-edit"' +
        ' title="' + escapeHtml(label) + '" aria-label="' + escapeHtml(label) + '">' +
        '<i class="fa fa-pencil" aria-hidden="true"></i></a>';
    }
    tolCell.innerHTML = tolHtml;
  }

  // data: testlist_machine_values' JSON ({tests, limits}).
  function fillMachineCells(data, root) {
    var tests = data.tests || {};
    var limits = data.limits || {};
    var rows = (root || document).querySelectorAll("tr.tl-test-row[data-test-id], tr.tl-sublist-test-row[data-test-id]");
    var list = Array.prototype.slice.call(rows);
    if (root && root.matches && root.matches("tr.tl-test-row[data-test-id]")) { list.push(root); }
    list.forEach(function (r) {
      var id = r.getAttribute("data-test-id");
      if (!Object.prototype.hasOwnProperty.call(tests, id)) { return; }
      // remembered so a save in the dialog can redraw every row for this test
      if (limits[id]) { scopeState.limits[id] = limits[id]; }
      fillMachineRow(r, tests[id], limits[id]);
    });
  }

  function clearMachineCells() {
    document.querySelectorAll("#tl-tests-card td.tl-col-ref, #tl-tests-card td.tl-col-tol").forEach(function (td) {
      td.innerHTML = "";
    });
  }

  function setScopeInfo(unit) {
    var text = document.getElementById("tl-scope-info-text");
    var icon = document.getElementById("tl-scope-icon");
    if (!text) { return; }
    if (icon) { icon.className = (unit ? "fa fa-cube" : "fa fa-globe") + " tl-scope-globe-icon"; }
    if (!unit) {
      text.textContent = scopeMsg("base");
      return;
    }
    if (unit === "loading") {
      text.textContent = scopeMsg("loading");
      return;
    }
    var parts = [];
    if (!unit.utc_url) {
      parts.push(escapeHtml(scopeMsg("not-assigned")));
    } else {
      if (unit.frequency) { parts.push(escapeHtml(unit.frequency)); }
      if (unit.via) {
        parts.push(escapeHtml(interpolate(scopeMsg("assigned-through"), { name: unit.via }, true)));
      } else if (unit.assigned_to) {
        parts.push(escapeHtml(interpolate(scopeMsg("assigned-to"), { group: unit.assigned_to }, true)));
      }
      parts.push('<span class="tl-scope-status">' +
        escapeHtml(scopeMsg(unit.active ? "active" : "inactive")) + '</span>');
      parts.push('<a href="' + escapeHtml(unit.utc_url) + '" target="_blank" rel="noopener">' +
        escapeHtml(scopeMsg("edit-assignment")) + '</a>');
    }
    text.innerHTML = parts.join(' <span class="tl-scope-sep" aria-hidden="true">&middot;</span> ');
  }

  // Details inputs are made readonly (not disabled: disabled inputs aren't
  // submitted, which would break Save).
  function lockSharedSettings(lock) {
    document.querySelectorAll("#tl-details-card input, #tl-details-card textarea").forEach(function (el) {
      if (el.type === "hidden" || el.type === "checkbox" || el.type === "file") { return; }
      if (lock) {
        if (!el.readOnly) { el.readOnly = true; el.setAttribute("data-tl-machine-readonly", "1"); }
      } else if (el.getAttribute("data-tl-machine-readonly")) {
        el.readOnly = false;
        el.removeAttribute("data-tl-machine-readonly");
      }
    });
  }

  function setScopeUrl(unitId) {
    if (!window.history || !window.history.replaceState) { return; }
    try {
      var url = new URL(window.location.href);
      if (unitId) { url.searchParams.set("unit", unitId); } else { url.searchParams.delete("unit"); }
      window.history.replaceState(window.history.state, "", url.toString());
    } catch (err) {}
  }

  function setBaseMode() {
    scopeState.unitId = null;
    scopeState.unitName = "";
    document.body.classList.remove("tl-mode-machine");
    var banner = document.getElementById("tl-machine-banner");
    if (banner) { banner.hidden = true; }
    clearMachineCells();
    lockSharedSettings(false);
    setScopeInfo(null);
    setScopeUrl(null);
    refreshPreviewIfOpen();
  }

  function applyScope(select) {
    var errorBox = document.getElementById("tl-machine-error");
    var banner = document.getElementById("tl-machine-banner");
    if (errorBox) { errorBox.hidden = true; }
    var unitId = select.value;
    var reqId = ++scopeState.request;
    if (!unitId || unitId === "base") {
      setBaseMode();
      return;
    }
    var opt = select.options[select.selectedIndex];
    var unitName = (opt && opt.getAttribute("data-unit-name")) || (opt ? opt.textContent.trim() : "");
    setScopeInfo("loading");
    fetchMachineValues(unitId, scopeTestIds())
      .then(function (data) {
        if (reqId !== scopeState.request) { return; }
        scopeState.unitId = unitId;
        scopeState.unitName = (data.unit && data.unit.name) || unitName;
        scopeState.limits = {};
        fillMachineCells(data);
        document.querySelectorAll(".tl-machine-banner .tl-machine-unit-name").forEach(function (el) {
          el.textContent = scopeState.unitName;
        });
        if (banner) { banner.hidden = false; }
        document.body.classList.add("tl-mode-machine");
        lockSharedSettings(true);
        setScopeInfo(data.unit || {});
        setScopeUrl(unitId);
        refreshPreviewIfOpen();
      })
      .catch(function () {
        if (reqId !== scopeState.request) { return; }
        select.value = "base";
        setBaseMode();
        if (errorBox) {
          errorBox.querySelectorAll(".tl-machine-unit-name").forEach(function (el) { el.textContent = unitName; });
          errorBox.hidden = false;
        }
      });
  }

  // Rows or sublists added while a machine is shown get that machine's values too.
  function observeScopeRows() {
    var tbody = document.getElementById("tl-tests-tbody");
    if (!tbody || !window.MutationObserver) { return; }
    new MutationObserver(function (mutations) {
      if (!scopeState.unitId) { return; }
      var unitId = scopeState.unitId;
      mutations.forEach(function (m) {
        Array.prototype.forEach.call(m.addedNodes, function (node) {
          if (node.nodeType !== 1) { return; }
          var ids = scopeTestIds(node);
          if (!ids.length) { return; }
          fetchMachineValues(unitId, ids)
            .then(function (data) {
              if (scopeState.unitId === unitId) { fillMachineCells(data, node); }
            })
            .catch(function () {});
        });
      });
    }).observe(tbody, { childList: true });
  }

  // ---- Machine Reference and Tolerance dialog ----
  // The pencil on a machine-mode row loads testlist_machine_ref_tol's dialog
  // into #tl-reftol-container (after the change form, so its inputs are never
  // posted with the test list and the unsaved-changes check never sees them).
  // Save stores the unit's reference and tolerance straight away, then redraws
  // every row showing that test.
  var refTolState = { busy: false, opener: null, noteTimer: null };

  function refTolModal() { return document.getElementById("tl-reftol-modal"); }

  function hideRefTolNote() {
    var note = document.getElementById("tl-reftol-note");
    clearTimeout(refTolState.noteTimer);
    if (note) {
      note.hidden = true;
      note.classList.remove("tl-reftol-note-fading");
    }
  }

  // Success notes fade after a few seconds; errors stay until dismissed.
  function showRefTolNote(msg, isError) {
    var note = document.getElementById("tl-reftol-note");
    var text = document.getElementById("tl-reftol-note-text");
    var icon = document.getElementById("tl-reftol-note-icon");
    if (!note || !text) { return; }
    clearTimeout(refTolState.noteTimer);
    text.textContent = msg;
    if (icon) { icon.className = "fa " + (isError ? "fa-exclamation-circle" : "fa-check"); }
    note.classList.toggle("tl-reftol-note-error", !!isError);
    note.classList.remove("tl-reftol-note-fading");
    note.hidden = false;
    if (!isError) {
      refTolState.noteTimer = setTimeout(function () {
        note.classList.add("tl-reftol-note-fading");
        refTolState.noteTimer = setTimeout(hideRefTolNote, 400);
      }, 6000);
    }
  }

  function mountRefTolDialog(html) {
    var container = document.getElementById("tl-reftol-container");
    if (!container) {
      container = document.createElement("div");
      container.id = "tl-reftol-container";
      document.body.appendChild(container);
    }
    container.innerHTML = html;
    var modal = refTolModal();
    if (!modal) { return; }
    var errField = modal.querySelector(".tl-modal-field .tl-assign-error");
    var target = (errField && errField.closest(".tl-modal-field").querySelector("select, input, textarea")) ||
      modal.querySelector(".tl-modal-body select, .tl-modal-body input:not([type='hidden']), .tl-modal-body textarea");
    if (target) { target.focus(); }
  }

  function openRefTolDialog(btn) {
    if (refTolModal()) { return; }
    hideRefTolNote();
    var row = btn.closest("tr[data-test-id]");
    refTolState.opener = { row: row, testId: row ? row.getAttribute("data-test-id") : null };
    fetch(btn.getAttribute("data-reftol-url"), {
      credentials: "same-origin",
      headers: { "X-Requested-With": "XMLHttpRequest" }
    })
      .then(function (res) {
        if (!res.ok) { throw new Error(String(res.status)); }
        return res.text();
      })
      .then(mountRefTolDialog)
      .catch(function () {
        showRefTolNote(gettext("Couldn't open the Reference and Tolerance dialog. Nothing was changed. Try again."), true);
      });
  }

  // The opener's button is redrawn on a save, so find the row's current one.
  function focusRefTolOpener() {
    var opener = refTolState.opener;
    refTolState.opener = null;
    if (!opener || !opener.row || !document.contains(opener.row)) { return; }
    var btn = null;
    Array.prototype.forEach.call(opener.row.children, function (td) {
      if (!btn && td.classList.contains("tl-col-tol")) { btn = td.querySelector(".tl-machine-reftol-btn"); }
    });
    if (btn) { btn.focus(); }
  }

  function closeRefTolDialog() {
    var container = document.getElementById("tl-reftol-container");
    if (!container || !refTolModal()) { return; }
    container.innerHTML = "";
    refTolState.busy = false;
    focusRefTolOpener();
  }

  function setRefTolSubmitting(on) {
    var btn = document.getElementById("tl-reftol-submit");
    if (!btn) { return; }
    btn.disabled = on;
    btn.innerHTML = on
      ? '<i class="fa fa-spinner fa-spin" aria-hidden="true"></i> ' + escapeHtml(gettext("Saving…"))
      : '<i class="fa fa-floppy-o" aria-hidden="true"></i> ' + escapeHtml(gettext("Save"));
  }

  // Redraw every row showing this test (directly and in sublists) for the shown unit.
  function applyRefTolSaved(data) {
    if (!scopeState.unitId || String(data.unit_id) !== String(scopeState.unitId)) { return; }
    var id = String(data.test_id);
    var info = { reference: data.reference, tolerance: data.tolerance, uti_id: data.uti_id, uti_url: data.uti_url };
    document.querySelectorAll("tr.tl-test-row[data-test-id], tr.tl-sublist-test-row[data-test-id]").forEach(function (r) {
      if (r.getAttribute("data-test-id") === id) { fillMachineRow(r, info, scopeState.limits[id]); }
    });
  }

  function submitRefTol(form) {
    if (refTolState.busy) { return; }
    refTolState.busy = true;
    setRefTolSubmitting(true);
    fetch(form.action, {
      method: "POST",
      body: new FormData(form),
      credentials: "same-origin",
      headers: { "X-Requested-With": "XMLHttpRequest" }
    })
      .then(function (res) {
        if (res.status === 422) {
          return res.text().then(function (html) {
            refTolState.busy = false;
            mountRefTolDialog(html);
          });
        }
        if (!res.ok) { throw new Error(String(res.status)); }
        return res.json().then(function (data) {
          if (!data || !data.ok) { throw new Error("bad response"); }
          applyRefTolSaved(data);
          closeRefTolDialog();
          showRefTolNote(data.message, false);
        });
      })
      .catch(function () {
        refTolState.busy = false;
        setRefTolSubmitting(false);
        var alert = document.getElementById("tl-reftol-alert");
        var alertText = document.getElementById("tl-reftol-alert-text");
        if (alert && alertText) {
          alertText.textContent = gettext("Couldn't save the reference and tolerance. Nothing was changed. Try again.");
          alert.hidden = false;
        }
      });
  }

  // ---- New Tolerance dialog (stacked on the Reference and Tolerance dialog) ----
  // Create saves the Tolerance straight away; it's only added to and selected in
  // the first dialog's Tolerance select, which applies it when that's saved.
  var newTolState = { busy: false };

  function newTolModal() { return document.getElementById("tl-newtol-modal"); }

  function syncNewTolUnits() {
    var type = document.getElementById("tl-newtol-type");
    var percent = !!type && type.value === "percent";
    document.querySelectorAll("#tl-newtol-modal [data-newtol-percent]").forEach(function (el) {
      el.hidden = !percent;
    });
  }

  function mountNewTolDialog(html) {
    var container = document.getElementById("tl-newtol-container");
    if (!container) {
      container = document.createElement("div");
      container.id = "tl-newtol-container";
      document.body.appendChild(container);
    }
    container.innerHTML = html;
    var modal = newTolModal();
    if (!modal) { return; }
    syncNewTolUnits();
    var errField = modal.querySelector(".tl-modal-field .tl-assign-error");
    var target = (errField && errField.closest(".tl-modal-field").querySelector("select, input:not([type='hidden'])")) ||
      modal.querySelector("#tl-newtol-use") ||
      modal.querySelector(".tl-modal-body select, .tl-modal-body input:not([type='hidden'])");
    if (target) { target.focus(); }
  }

  function showRefTolAlert(msg) {
    var alert = document.getElementById("tl-reftol-alert");
    var alertText = document.getElementById("tl-reftol-alert-text");
    if (alert && alertText) {
      alertText.textContent = msg;
      alert.hidden = false;
    }
  }

  function openNewTolDialog(btn) {
    if (newTolModal()) { return; }
    fetch(btn.getAttribute("data-newtol-url"), {
      credentials: "same-origin",
      headers: { "X-Requested-With": "XMLHttpRequest" }
    })
      .then(function (res) {
        if (!res.ok) { throw new Error(String(res.status)); }
        return res.text();
      })
      .then(mountNewTolDialog)
      .catch(function () {
        showRefTolAlert(gettext("Couldn't open the New Tolerance dialog. Nothing was saved. Try again."));
      });
  }

  // Close it and go back to the Reference and Tolerance dialog, whose entries
  // are untouched. `focusEl` defaults to the New Tolerance… button.
  function closeNewTolDialog(focusEl) {
    var container = document.getElementById("tl-newtol-container");
    if (!container || !newTolModal()) { return; }
    container.innerHTML = "";
    newTolState.busy = false;
    var target = focusEl || document.getElementById("tl-reftol-new-tolerance");
    if (target) { target.focus(); }
  }

  // Put a tolerance in the first dialog's select (adding it if it's new) and select it.
  function pickToleranceInRefTol(id, label) {
    var select = document.getElementById("tl-reftol-tolerance");
    if (!select) { return null; }
    id = String(id);
    var opt = Array.prototype.filter.call(select.options, function (o) { return o.value === id; })[0];
    if (!opt) {
      opt = document.createElement("option");
      opt.value = id;
      opt.textContent = label;
      select.appendChild(opt);
    }
    select.value = id;
    return select;
  }

  function setNewTolSubmitting(on) {
    var btn = document.getElementById("tl-newtol-submit");
    if (!btn) { return; }
    btn.disabled = on;
    btn.innerHTML = on
      ? '<i class="fa fa-spinner fa-spin" aria-hidden="true"></i> ' + escapeHtml(gettext("Creating…"))
      : '<i class="fa fa-plus" aria-hidden="true"></i> ' + escapeHtml(gettext("Create"));
  }

  function submitNewTol(form) {
    if (newTolState.busy) { return; }
    newTolState.busy = true;
    setNewTolSubmitting(true);
    fetch(form.action, {
      method: "POST",
      body: new FormData(form),
      credentials: "same-origin",
      headers: { "X-Requested-With": "XMLHttpRequest" }
    })
      .then(function (res) {
        if (res.status === 422) {
          return res.text().then(function (html) {
            newTolState.busy = false;
            mountNewTolDialog(html);
          });
        }
        if (!res.ok) { throw new Error(String(res.status)); }
        return res.json().then(function (data) {
          if (!data || !data.ok) { throw new Error("bad response"); }
          closeNewTolDialog(pickToleranceInRefTol(data.id, data.label));
        });
      })
      .catch(function () {
        newTolState.busy = false;
        setNewTolSubmitting(false);
        var alert = document.getElementById("tl-newtol-alert");
        var alertText = document.getElementById("tl-newtol-alert-text");
        if (alert && alertText) {
          alertText.textContent = gettext("Couldn't create the tolerance. Nothing was saved. Try again.");
          alert.hidden = false;
        }
      });
  }

  document.addEventListener("click", function (e) {
    if (!e.target.closest) { return; }
    var useBtn = e.target.closest("#tl-newtol-use");
    if (e.target.closest("#tl-reftol-new-tolerance")) {
      e.preventDefault();
      openNewTolDialog(e.target.closest("#tl-reftol-new-tolerance"));
    } else if (useBtn) {
      e.preventDefault();
      closeNewTolDialog(pickToleranceInRefTol(useBtn.getAttribute("data-tolerance-id"),
        useBtn.getAttribute("data-tolerance-label")));
    } else if (e.target.closest("#tl-newtol-modal [data-newtol-close]") || e.target.id === "tl-newtol-modal") {
      e.preventDefault();
      closeNewTolDialog();
    }
  });

  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "tl-newtol-type") { syncNewTolUnits(); }
  });

  document.addEventListener("submit", function (e) {
    if (e.target && e.target.id === "tl-newtol-form") {
      e.preventDefault();
      submitNewTol(e.target);
    }
  });

  document.addEventListener("click", function (e) {
    if (!e.target.closest) { return; }
    var btn = e.target.closest(".tl-machine-reftol-btn");
    if (btn) {
      e.preventDefault();
      openRefTolDialog(btn);
    } else if (e.target.closest("#tl-reftol-modal [data-reftol-close]") || e.target.id === "tl-reftol-modal") {
      e.preventDefault();
      closeRefTolDialog();
    } else if (e.target.closest("#tl-reftol-note-close")) {
      e.preventDefault();
      hideRefTolNote();
    }
  });

  document.addEventListener("submit", function (e) {
    if (e.target && e.target.id === "tl-reftol-form") {
      e.preventDefault();
      submitRefTol(e.target);
    }
  });

  // Esc closes the top dialog only: New Tolerance first, then Reference and Tolerance.
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") { return; }
    if (newTolModal()) {
      e.preventDefault();
      closeNewTolDialog();
    } else if (refTolModal()) {
      e.preventDefault();
      closeRefTolDialog();
    }
  });

  function initScopeSelect() {
    var select = document.getElementById("tl-machine-scope-select");
    if (!select || select.hasAttribute("data-tl-init")) { return; }
    select.setAttribute("data-tl-init", "1");

    select.addEventListener("change", function () {
      // Unsaved changes: switching machines with unsaved edits asks first (see beforeScopeChange).
      var opt = select.options[select.selectedIndex];
      var label = opt ? opt.textContent.trim() : "";
      if (!beforeScopeChange(select.value, label, function () {
        select.value = scopeState.unitId || "base";
        select.focus();
      })) { return; }
      applyScope(select);
    });
    observeScopeRows();

    // Reopen on the machine in the URL (?unit=<id>), e.g. after a reload or
    // "Save and continue editing".
    var unitParam = null;
    try { unitParam = new URLSearchParams(window.location.search).get("unit"); } catch (err) {}
    var match = unitParam && Array.prototype.filter.call(select.options, function (o) {
      return o.value === unitParam && o.value !== "base";
    })[0];
    if (match) {
      select.value = unitParam;
      applyScope(select);
    } else {
      select.value = "base";
      if (unitParam) { setScopeUrl(null); }
    }
  }

  // Build a preview "Type Value" <td> from a builder row's server-rendered cell
  // (data attributes on .tl-cell-type-value), so the display logic stays in Python.
  function previewTypeValueCellHtml(row) {
    var cell = row.querySelector(".tl-cell-type-value");
    var value = cell ? (cell.getAttribute("data-type-value") || "") : "";
    if (!value) {
      return '<td class="tl-cell-type-value tl-col-type-value"><span class="tl-type-value-none">' +
        escapeHtml(gettext("None")) + '</span></td>';
    }
    var mono = cell.getAttribute("data-type-value-mono") === "1";
    var title = cell.getAttribute("data-type-value-title") || "";
    return '<td class="tl-cell-type-value tl-col-type-value"><span class="tl-type-value' + (mono ? ' tl-mono' : '') + '"' +
      (title ? ' title="' + escapeHtml(title) + '"' : '') + '>' + escapeHtml(value) + '</span></td>';
  }

  // Layout-only preview built from the builder rows; noteHtml goes above it and
  // bannerText (plain text) is the message in its banner.
  function renderLivePreview(noteHtml, bannerText) {
    var container = document.getElementById("tl-preview-container");
    if (!container) { return; }

    var nameInput = document.getElementById("id_name");
    var nameVal = nameInput ? nameInput.value.trim() : "";
    if (!nameVal) { nameVal = gettext("Untitled Test List"); }

    var slugInput = document.getElementById("id_slug");
    var slugVal = slugInput ? slugInput.value.trim() : "";

    var descInput = document.getElementById("id_description");
    var descVal = descInput ? descInput.value.trim() : "";

    var warnInput = document.getElementById("id_warning_message");
    var warnVal = warnInput ? warnInput.value.trim() : "";

    var jsInput = document.getElementById("id_javascript");
    var jsVal = jsInput ? jsInput.value.trim() : "";

    var html = '<div class="tl-preview-banner">' +
      '<i class="fa fa-eye" aria-hidden="true"></i> ' +
      '<span>' + escapeHtml(bannerText || previewMsg("layout")) + '</span>' +
      '</div>';

    html += '<div class="tl-preview-card">';
    html += '<h2 class="tl-preview-title">' + escapeHtml(nameVal) + (slugVal ? ' <span class="tl-preview-slug">(' + escapeHtml(slugVal) + ')</span>' : '') + '</h2>';

    if (descVal) {
      html += '<div class="tl-preview-desc">' + descVal + '</div>';
    }

    if (warnVal) {
      html += '<div class="tl-preview-warning"><i class="fa fa-exclamation-triangle" aria-hidden="true"></i> ' + escapeHtml(warnVal) + '</div>';
    }

    if (jsVal) {
      html += '<div class="tl-preview-js-note">' +
        '<i class="fa fa-code" aria-hidden="true"></i> ' +
        escapeHtml(gettext("This test list runs custom JavaScript on the Perform QC page.")) +
        '</div>';
    }

    var previewHeadHtml = '<thead><tr>' +
      '<th class="tl-th-test">' + escapeHtml(gettext("Test")) + '</th>' +
      '<th class="tl-th-category">' + escapeHtml(gettext("Category")) + '</th>' +
      '<th class="tl-th-type">' + escapeHtml(gettext("Type")) + '</th>' +
      '<th class="tl-th-type-value tl-col-type-value">' + escapeHtml(gettext("Type Value")) + '</th>' +
      '<th class="tl-th-input">' + escapeHtml(gettext("Input")) + '</th>' +
      '</tr></thead>';
    var mockInputHtml = '<td class="tl-cell-input"><input type="text" placeholder="' + escapeHtml(gettext("Value…")) + '"' +
      ' class="tl-preview-mock-input" disabled aria-label="' + escapeHtml(gettext("Input")) + '"></td>';

    // Interleaved items in visual top-to-bottom order
    var rows = document.querySelectorAll("#tl-tests-tbody tr.tl-member-item");
    var inDirectTable = false;

    rows.forEach(function (r) {
      var del = r.querySelector("input[name$='-DELETE']");
      var isDel = del && (del.checked || del.value === "true");
      var isHidden = r.style.display === "none";
      if (isDel || isHidden) { return; }

      if (r.classList.contains("tl-test-row")) {
        if (!inDirectTable) {
          html += '<div class="tl-preview-table-wrap">' +
            '<table class="tlb-table tl-tests-table tl-preview-tests-table">' +
            previewHeadHtml + '<tbody>';
          inDirectTable = true;
        }

        var nameElem = r.querySelector(".tl-test-name");
        var name = nameElem ? nameElem.textContent.trim() : "";
        var catElem = r.querySelector(".tl-cat-pill");
        var cat = catElem ? catElem.textContent.trim() : "";
        var catClass = catElem ? catElem.className : "tl-cat-pill";
        var typeBadge = r.querySelector(".tl-type-badge");
        var typeBadgeText = typeBadge ? typeBadge.textContent.trim() : "";
        var typeBadgeClass = typeBadge ? typeBadge.className : "tl-type-badge";
        var typeLabel = r.querySelector(".tl-type-label");
        var typeLabelText = typeLabel ? typeLabel.textContent.trim() : "";

        html += '<tr>' +
          '<td class="tl-cell-test"><div class="tl-test-name">' + escapeHtml(name) + '</div></td>' +
          '<td class="tl-cell-category"><span class="' + escapeHtml(catClass) + '">' + escapeHtml(cat) + '</span></td>' +
          '<td class="tl-cell-type"><div class="tl-type-pill-wrap"><span class="' + escapeHtml(typeBadgeClass) + '">' + escapeHtml(typeBadgeText) + '</span> <span class="tl-type-label">' + escapeHtml(typeLabelText) + '</span></div></td>' +
          previewTypeValueCellHtml(r) +
          mockInputHtml +
          '</tr>';
      } else if (r.classList.contains("tl-sublist-row")) {
        if (inDirectTable) {
          html += '</tbody></table></div>';
          inDirectTable = false;
        }

        var subNameElem = r.querySelector(".tl-sublist-name");
        var subName = subNameElem ? subNameElem.textContent.trim() : gettext("Sublist");
        var subCountElem = r.querySelector(".tl-sublist-count");
        var subCount = subCountElem ? subCountElem.textContent.trim() : "0";

        // Outlined sublists get their own box headed by name + description,
        // like the Perform QC page draws them
        var subOutlineBox = r.querySelector("input[name$='-outline']");
        var subOutlined = !!(subOutlineBox && subOutlineBox.checked);
        if (subOutlined) {
          html += '<div class="tl-preview-sublist-outlined">';
        }

        html += '<div class="tl-preview-sublist-header"><i class="fa fa-folder-o" aria-hidden="true"></i> <span>' + escapeHtml(subName) + '</span> <span class="tl-sublist-count">' + escapeHtml(subCount) + '</span></div>';

        if (subOutlined) {
          var subHeaderElem = r.querySelector(".tl-sublist-header");
          var subDesc = subHeaderElem ? (subHeaderElem.getAttribute("data-sublist-description") || "").trim() : "";
          if (subDesc) {
            // description is admin-authored HTML; the Perform QC page renders it as HTML too
            html += '<div class="tl-preview-sublist-desc">' + subDesc + '</div>';
          }
        }

        var subRows = r.querySelectorAll("tbody tr.tl-sublist-test-row");
        html += '<table class="tlb-table tl-sublist-table tl-preview-sublist-table">';
        html += previewHeadHtml + '<tbody>';

        subRows.forEach(function (sr) {
          var tname = sr.querySelector(".tl-test-name") ? sr.querySelector(".tl-test-name").textContent.trim() : "";
          var tcat = sr.querySelector(".tl-cat-pill") ? sr.querySelector(".tl-cat-pill").textContent.trim() : "";
          var tcatClass = sr.querySelector(".tl-cat-pill") ? sr.querySelector(".tl-cat-pill").className : "tl-cat-pill";
          var tb = sr.querySelector(".tl-type-badge") ? sr.querySelector(".tl-type-badge").textContent.trim() : "";
          var tbClass = sr.querySelector(".tl-type-badge") ? sr.querySelector(".tl-type-badge").className : "tl-type-badge";
          var tl = sr.querySelector(".tl-type-label") ? sr.querySelector(".tl-type-label").textContent.trim() : "";

          html += '<tr>' +
            '<td class="tl-cell-test"><div class="tl-test-name">' + escapeHtml(tname) + '</div></td>' +
            '<td class="tl-cell-category"><span class="' + escapeHtml(tcatClass) + '">' + escapeHtml(tcat) + '</span></td>' +
            '<td class="tl-cell-type"><div class="tl-type-pill-wrap"><span class="' + escapeHtml(tbClass) + '">' + escapeHtml(tb) + '</span> <span class="tl-type-label">' + escapeHtml(tl) + '</span></div></td>' +
            previewTypeValueCellHtml(sr) +
            mockInputHtml +
            '</tr>';
        });

        html += '</tbody></table>';
        if (subOutlined) {
          html += '</div>'; // close tl-preview-sublist-outlined
        }
      }
    });

    if (inDirectTable) {
      html += '</tbody></table></div>';
      inDirectTable = false;
    }

    html += '</div>'; // close tl-preview-card

    container.innerHTML = (noteHtml || "") + html;
  }

  // ---- Preview of the real Perform QC page ----
  // With a machine picked that this list is assigned to directly, the Preview tab
  // shows that assignment's Perform QC page, read-only (PerformQAPreview), in an
  // iframe. It shows the last saved version of the list. Otherwise it falls back
  // to the layout-only preview above, with a note saying how to get the real one.
  var previewUnits = null;

  function getPreviewUnits() {
    if (previewUnits === null) {
      previewUnits = {};
      var el = document.getElementById("tl-preview-units");
      if (el) {
        try { previewUnits = JSON.parse(el.textContent) || {}; } catch (err) { previewUnits = {}; }
      }
    }
    return previewUnits;
  }

  function previewMsg(key) {
    var container = document.getElementById("tl-preview-container");
    return container ? (container.getAttribute("data-msg-" + key) || "") : "";
  }

  function previewNoteHtml(icon, innerHtml) {
    return '<div class="tl-preview-note" role="status"><i class="fa ' + icon + '" aria-hidden="true"></i>' +
      '<span>' + innerHtml + '</span></div>';
  }

  function renderPreview() {
    var container = document.getElementById("tl-preview-container");
    if (!container) { return; }
    var canPreview = container.getAttribute("data-can-preview-perform") === "1";
    var unitId = document.body.classList.contains("tl-mode-machine") ? scopeState.unitId : null;
    var info = unitId ? getPreviewUnits()[unitId] : null;

    if (canPreview && info && info.preview_url) {
      var html = "";
      if (hasUnsavedChanges()) {
        html += previewNoteHtml("fa-exclamation-circle", escapeHtml(previewMsg("unsaved")));
      }
      // a new iframe each time, so opening the tab always reloads the page
      html += '<iframe class="tl-preview-frame" src="' + escapeHtml(info.preview_url) + '"' +
        ' title="' + escapeHtml(previewMsg("frame-title")) + '"></iframe>';
      container.innerHTML = html;
      return;
    }

    var note = "";
    if (info && info.via) {
      var unitName = scopeState.unitName || "";
      note = escapeHtml(interpolate(previewMsg("through"), { unit: unitName, parent: info.via }, true));
      var linkText = info.via_cycle ? previewMsg("through-cycle")
        : interpolate(previewMsg("through-link"), { parent: info.via }, true);
      note += ' <a href="' + escapeHtml(info.via_url) + '">' + escapeHtml(linkText) + '</a>';
    }
    // No machine picked: the layout banner itself says how to see the real page
    // (one message, not a note repeating it).
    var banner = (canPreview && !note) ? previewMsg("pick-machine") : previewMsg("layout");
    renderLivePreview(note ? previewNoteHtml("fa-info-circle", note) : "", banner);
  }

  // Called when the Editing scope changes, so an open Preview tab follows it.
  function refreshPreviewIfOpen() {
    var container = document.getElementById("tl-preview-container");
    if (container && container.style.display === "block") { renderPreview(); }
  }

  function initViewTabs() {
    var editorBtn = document.getElementById("tl-view-editor-btn");
    var previewBtn = document.getElementById("tl-view-preview-btn");
    var previewContainer = document.getElementById("tl-preview-container");

    var editContainers = [
      document.getElementById("tl-details-card"),
      document.getElementById("tl-tests-card"),
      document.getElementById("tl-attachments-card"),
      document.getElementById("tl-parents-card")
    ];

    if (!editorBtn || !previewBtn) { return; }

    function setView(view) {
      if (view === "preview") {
        editorBtn.classList.remove("active");
        previewBtn.classList.add("active");
        editContainers.forEach(function (el) {
          if (el) { el.style.display = "none"; }
        });
        if (previewContainer) {
          previewContainer.style.display = "block";
          renderPreview();
        }
      } else {
        previewBtn.classList.remove("active");
        editorBtn.classList.add("active");
        if (previewContainer) {
          previewContainer.style.display = "none";
          previewContainer.innerHTML = ""; // unloads the Perform QC preview iframe
        }
        editContainers.forEach(function (el) {
          if (el) { el.style.display = ""; }
        });
      }
    }

    editorBtn.addEventListener("click", function (e) {
      e.preventDefault();
      setView("editor");
    });

    previewBtn.addEventListener("click", function (e) {
      e.preventDefault();
      setView("preview");
    });
  }

  // ---- Unsaved changes ----
  // Warns before leaving the edit page with changes that haven't been saved.
  // "Changed" means the main form's values differ from a snapshot taken once the
  // builder has set the page up (row sorting, syncOrder). The builder keeps every
  // edit in form inputs (hidden order and DELETE inputs, the inputs of added rows,
  // attachment file inputs and DELETE boxes), so comparing the serialised form
  // covers field edits, added/removed/reordered tests and sublists, outline
  // checkboxes and attachments. Switching Editor/Preview and links that open in a
  // new tab don't leave the page, so they never ask.
  var unsaved = {
    form: null, snapshot: null, forceChanged: false, allowLeave: false,
    submitEvent: null, open: false, onLeave: null, onStay: null
  };
  // The scope dropdown only changes what's shown, and TOTAL_FORMS only counts
  // rows (an added-then-removed attachment shouldn't count as a change).
  var UNSAVED_SKIP_NAMES = { csrfmiddlewaretoken: true, tl_scope_unit: true };

  function unsavedMainForm() {
    var card = document.getElementById("tl-tests-card") || document.getElementById("tl-details-card");
    return card ? card.closest("form") : null;
  }

  // Sorted name=value pairs, like FormData, but leaving out the inputs of the
  // builder's dialogs that sit inside the main form without being part of the
  // test list (Save As). The Duplicate Test, Description and search dialogs are
  // rendered after the form, so they're never in form.elements at all.
  function serialiseUnsavedForm(form) {
    var pairs = [];
    Array.prototype.forEach.call(form.elements, function (el) {
      var name = el.name;
      if (!name || el.disabled || UNSAVED_SKIP_NAMES[name] || /-TOTAL_FORMS$/.test(name)) { return; }
      if (el.closest(".tl-modal-backdrop, #tl-modal-container")) { return; }
      var type = (el.type || "").toLowerCase();
      if (type === "submit" || type === "button" || type === "reset" || type === "image") { return; }
      if ((type === "checkbox" || type === "radio") && !el.checked) { return; }
      if (type === "file") {
        Array.prototype.forEach.call(el.files || [], function (f) {
          pairs.push(name + "=" + f.name + ":" + f.size);
        });
        return;
      }
      if (el.tagName === "SELECT") {
        Array.prototype.forEach.call(el.options, function (o) {
          if (o.selected) { pairs.push(name + "=" + o.value); }
        });
        return;
      }
      pairs.push(name + "=" + el.value);
    });
    pairs.sort();
    return pairs.join("\n");
  }

  function hasUnsavedChanges() {
    if (!unsaved.form || unsaved.snapshot === null) { return false; }
    return unsaved.forceChanged || serialiseUnsavedForm(unsaved.form) !== unsaved.snapshot;
  }

  function unsavedEls() {
    var modal = document.getElementById("tl-unsaved-modal");
    if (!modal) { return null; }
    return {
      modal: modal,
      message: document.getElementById("tl-unsaved-message"),
      stay: document.getElementById("tl-unsaved-stay"),
      leave: document.getElementById("tl-unsaved-leave")
    };
  }

  function unsavedMsg(key, fallback) {
    var els = unsavedEls();
    return (els && els.modal.getAttribute("data-" + key)) || gettext(fallback);
  }

  function leaveWithoutPrompt(url) {
    unsaved.allowLeave = true;
    window.location.href = url;
  }

  // opts: message, leaveLabel, onLeave, onStay
  function openUnsavedDialog(opts) {
    var els = unsavedEls();
    if (!els) {
      if (window.confirm(opts.message)) { opts.onLeave(); } else if (opts.onStay) { opts.onStay(); }
      return;
    }
    els.message.textContent = opts.message;
    els.leave.textContent = opts.leaveLabel;
    unsaved.onLeave = opts.onLeave;
    unsaved.onStay = opts.onStay || null;
    unsaved.open = true;
    els.modal.hidden = false;
    els.stay.focus();
  }

  function closeUnsavedDialog(leave) {
    if (!unsaved.open) { return; }
    var els = unsavedEls();
    var callback = leave ? unsaved.onLeave : unsaved.onStay;
    unsaved.open = false;
    unsaved.onLeave = null;
    unsaved.onStay = null;
    if (els) { els.modal.hidden = true; }
    if (callback) { callback(); }
  }

  // Called by initScopeSelect before switching machines. Machine mode shows saved
  // values and locks shared settings, so with unsaved changes it's treated like
  // leaving: ask, then reload at the chosen scope (dropping the changes), or put
  // the dropdown back. Returns false when the switch must wait for the answer.
  function beforeScopeChange(newValue, label, revert) {
    if (!hasUnsavedChanges()) { return true; }
    openUnsavedDialog({
      message: interpolate(
        unsavedMsg("msg-switch", "You have changes that haven't been saved. Switch to %(label)s and lose them?"),
        { label: label }, true),
      leaveLabel: unsavedMsg("label-switch", "Switch Without Saving"),
      onStay: revert,
      onLeave: function () {
        var url = new URL(window.location.href);
        if (newValue && newValue !== "base") {
          url.searchParams.set("unit", newValue);
        } else {
          url.searchParams.delete("unit");
        }
        leaveWithoutPrompt(url.toString());
      }
    });
    return false;
  }

  function initUnsavedChanges() {
    var form = unsavedMainForm();
    if (!form || unsaved.form) { return; }
    unsaved.form = form;
    unsaved.snapshot = serialiseUnsavedForm(form);
    // Re-rendered after a failed save: the user's edits still aren't saved.
    unsaved.forceChanged = !!document.querySelector(".errornote, .errorlist");
  }

  // Closing the tab, reloading, typing a URL, browser back: the browser's own prompt.
  window.addEventListener("beforeunload", function (e) {
    if (unsaved.allowLeave) { return; }
    // A real save of the main form (one nothing cancelled) never asks.
    if (unsaved.submitEvent && !unsaved.submitEvent.defaultPrevented) { return; }
    if (!hasUnsavedChanges()) { return; }
    e.preventDefault();
    e.returnValue = "";
    return "";
  });

  // Capture phase, so this sees every submit of the main form (Save, Save and
  // Continue Editing, Save As…); beforeunload checks defaultPrevented later, so a
  // submit some handler cancels re-arms the warning.
  document.addEventListener("submit", function (e) {
    if (unsaved.form && e.target === unsaved.form) { unsaved.submitEvent = e; }
  }, true);

  // Same-tab links that leave the page (Cancel, breadcrumbs, History, Delete,
  // header and sidebar links): ask in our own dialog.
  document.addEventListener("click", function (e) {
    if (e.defaultPrevented || !unsaved.form || !e.target.closest) { return; }
    if (e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) { return; }
    var link = e.target.closest("a[href]");
    if (!link) { return; }
    var target = (link.getAttribute("target") || "").toLowerCase();
    if (target && target !== "_self") { return; }
    if (link.hasAttribute("download")) { return; }
    var href = (link.getAttribute("href") || "").trim();
    if (!href || href.charAt(0) === "#" || /^javascript:/i.test(href)) { return; }
    if (link.closest(".tl-modal-backdrop, #tl-modal-container")) { return; }
    if (!hasUnsavedChanges()) { return; }
    e.preventDefault();
    openUnsavedDialog({
      message: unsavedMsg("msg-leave", "You have changes that haven't been saved. Leave this page and lose them?"),
      leaveLabel: unsavedMsg("label-leave", "Leave Without Saving"),
      onStay: function () { link.focus(); },
      onLeave: function () { leaveWithoutPrompt(link.href); }
    });
  });

  document.addEventListener("click", function (e) {
    if (!unsaved.open || !e.target.closest) { return; }
    var els = unsavedEls();
    if (!els) { return; }
    if (e.target === els.modal || e.target.closest("#tl-unsaved-stay")) {
      e.preventDefault();
      closeUnsavedDialog(false);
    } else if (e.target.closest("#tl-unsaved-leave")) {
      e.preventDefault();
      closeUnsavedDialog(true);
    }
  });

  // Esc = Stay; Tab stays on the dialog's two buttons. Enter activates the
  // focused button natively.
  document.addEventListener("keydown", function (e) {
    if (!unsaved.open) { return; }
    var els = unsavedEls();
    if (!els) { return; }
    if (e.key === "Escape") {
      e.preventDefault();
      closeUnsavedDialog(false);
    } else if (e.key === "Tab") {
      e.preventDefault();
      var buttons = [els.stay, els.leave];
      var i = buttons.indexOf(document.activeElement);
      var next = e.shiftKey ? (i <= 0 ? buttons.length - 1 : i - 1) : (i === buttons.length - 1 ? 0 : i + 1);
      buttons[next].focus();
    }
  });

  // Back/forward cache: the page is live again, so arm the warning again.
  window.addEventListener("pageshow", function (e) {
    if (!e.persisted) { return; }
    unsaved.allowLeave = false;
    unsaved.submitEvent = null;
    closeUnsavedDialog(false);
  });

  // HTMX afterSwap re-init
  document.addEventListener("htmx:afterSwap", function () {
    initSortables();
    updateCounts();
  });
  document.addEventListener("htmx:load", function () {
    initSortables();
    updateCounts();
  });

  document.addEventListener("DOMContentLoaded", function () {
    initPreviewToggle();
    initRowClick();
    initResultsScroll();
    sortBuilderItemsByOrder();
    initSortables();
    updateCounts();
    syncOrder();
    initSublistToggles();
    initAttachmentsSection();
    initScopeSelect();
    initViewTabs();
    initUnsavedChanges();  // last: snapshot the form once the builder has set it up
  });

  if (document.readyState === "complete" || document.readyState === "interactive") {
    setTimeout(function () {
      initPreviewToggle();
      initRowClick();
      initResultsScroll();
      sortBuilderItemsByOrder();
      initSortables();
      updateCounts();
      syncOrder();
      initSublistToggles();
      initAttachmentsSection();
      initScopeSelect();
      initViewTabs();
      initUnsavedChanges();
    }, 20);
  }
})();
</script>
