{% comment %}
Test List Builder — inlined CSS + glue JS for the admin change form & changelist.

Inlined (not a static file) so it loads under DEBUG=False without a collectstatic
step. The live description preview and test list builder are driven by htmx.
{% endcomment %}{% load i18n %}
<style>
/* Colours, sizes and shapes follow the QATrack+ design spec and are written as
   literal values (no custom properties of our own). The only variables used here
   are Django admin's (re-asserted below for its dark theme) and --qa-admin-top-h,
   which base_site.html sets to the pinned admin header's height. */
/* Same meaning as base.css's .tl-mono (monospace); size comes from context here. */
.tl-mono { font-family: Menlo, Consolas, monospace; }

/* Keep this deliberately-light UI legible under Django 4.2's dark admin theme:
   re-assert light theme variables on our always-white components so inherited /
   variable-driven text stays dark-on-white.
   Text colours here pass 4.5:1 on white AND on the #f5f7fa hovered row: link #317399
   (4.84 on the hover, 5.19 on white; AdminLTE's #3c8dbc is 3.67 on white), link hover
   #285f80, quiet #6b6b6b (4.97 on the hover; #767676 dips to 4.23 there).
   #3c8dbc stays only for focus outlines/borders (UI parts need 3:1; it is 3.20+ on
   every light background used here). */
.tl-details-card, .tl-members-card, .tl-control-card, .tl-preview-card, #changelist {
  --body-fg: #333; --body-bg: #fff; --body-quiet-color: #6b6b6b; --body-loud-color: #111;
  --link-fg: #317399; --link-hover-color: #285f80; --hairline-color: #f4f4f4;
  --border-color: #d2d6de; --darkened-bg: #f8f9fa; --selected-bg: #f5f7fa; --selected-row: #f5f7fa;
}
/* The builder dialogs are always white too (same values as above): .tl-modal-dialog
   covers every one of them wherever it is mounted (#tl-dialogs-outside-form after the
   change form, Save As and Unsaved Changes inside it, #tl-assign-container appended to
   <body>), so their inputs, selects and textareas stay light with dark text. */
#tl-dialogs-outside-form, #tl-assign-container, .tl-modal-dialog {
  --body-fg: #333; --body-bg: #fff; --body-quiet-color: #6b6b6b; --body-loud-color: #111;
  --link-fg: #317399; --link-hover-color: #285f80; --hairline-color: #f4f4f4;
  --border-color: #d2d6de; --darkened-bg: #f8f9fa; --selected-bg: #f5f7fa; --selected-row: #f5f7fa;
}

/* ---- Top Header Bar ---- */
.tl-header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin: 0 0 12px;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}
/* The title row stays pinned just below the admin header (base_site.html measures
   its height into --qa-admin-top-h); the scope bar below it scrolls away.
   Solid page-coloured background so rows don't show through; z-index below the
   admin header (1000) and the builder dialogs (9999). */
.tl-header-bar {
  position: sticky;
  top: var(--qa-admin-top-h, 90px);
  z-index: 900;
  padding: 10px 0;
  background: var(--body-bg);
  box-shadow: 0 1px 0 var(--hairline-color);
}
/* Keep anchor jumps / focused fields clear of the pinned title row too. */
html:has(.tl-header-bar) { scroll-padding-top: calc(var(--qa-admin-top-h, 90px) + 72px); }
/* At 1024px and below the admin header is taller and the buttons wrap, so the
   two pinned rows would cover over a quarter of the window: let this one scroll. */
@media (max-width: 1024px), (max-height: 700px) {
  .tl-header-bar { position: static; padding: 0; box-shadow: none; }
  html:has(.tl-header-bar) { scroll-padding-top: calc(var(--qa-admin-top-h, 90px) + 12px); }
}
.tl-header-left {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
/* Title and counts sit on the page background (not a white card), so they use
   Django's variables to stay readable in the dark admin theme too. */
.tl-header-title {
  font-size: 22px;
  font-weight: 400;
  color: var(--body-fg, #444);
  margin: 0;
  line-height: 1.1;
  letter-spacing: normal;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}
/* "· ID 123" after "Edit Test List": same line, quieter colour, never split. */
.tl-header-id {
  color: var(--body-quiet-color, #666);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.tl-header-id-sep { margin-right: 2px; }
.tl-header-counts {
  font-size: 12px;
  font-weight: 400;
  color: var(--body-quiet-color, #666);
}
/* The page's one save button group (Django's bottom submit row is removed).
   Left to right: History, Delete, Cancel, Save As…, Save and Continue Editing, Save. */
.tl-header-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
/* a.tl-top-btn / button.tl-top-btn outrank the admin's link and button colours */
a.tl-top-btn,
button.tl-top-btn,
.tl-top-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 400;
  line-height: 1.4;
  padding: 4px 12px;
  margin: 0;
  border-radius: 3px;
  cursor: pointer;
  text-decoration: none;
  text-transform: none;
  letter-spacing: normal;
  white-space: nowrap;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  height: 30px;
  box-sizing: border-box;
  box-shadow: 2px 2px 2px #ddd;
  transition: background-color 0.15s ease;
}
a.tl-top-btn:focus-visible,
button.tl-top-btn:focus-visible {
  outline: 2px solid #3c8dbc;
  outline-offset: 1px;
}
a.tl-top-btn-secondary,
button.tl-top-btn-secondary {
  background: #f4f4f4;
  border: 1px solid #d2d6de;
  color: #444;
}
a.tl-top-btn-secondary:hover,
a.tl-top-btn-secondary:focus,
button.tl-top-btn-secondary:hover {
  background: #e7e7e7;
  border-color: #d2d6de;
  color: #444;
  text-decoration: none;
}
/* Delete: ghost style, so it doesn't compete with Save */
a.tl-top-btn-delete {
  background: #fff;
  border: 1px solid #e8c4be;
  color: #c0392b;
}
a.tl-top-btn-delete:hover,
a.tl-top-btn-delete:focus {
  background: #fbe9e7;
  border-color: #e8c4be;
  color: #c0392b;
  text-decoration: none;
}
button.tl-top-btn-save {
  background: #424f57;
  border: 1px solid #424f57;
  color: #fff;
  font-weight: 600;
}
button.tl-top-btn-save:hover {
  background: #323e46;
  border-color: #323e46;
  color: #fff;
}

/* ---- Top Control Card / Toolbar ---- */
.tl-control-card {
  background: #fff;
  border: 1px solid #d2d6de;
  border-radius: 0;
  padding: 8px 12px;
  margin-bottom: 18px;
  box-shadow: 0 1px 1px rgba(0,0,0,.1);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}
/* The left group takes the free space and wraps inside itself (scope text, Assign
   button, success note), so the Editor/Preview toggle stays on the first line. */
.tl-control-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  flex: 1 1 0;
  min-width: 0;
}
.tl-control-label {
  font-size: 11px;
  font-weight: 700;
  color: #6e7785;
  letter-spacing: .03em;
  text-transform: uppercase;
  margin-right: 2px;
}
.tl-scope-select-wrap {
  position: relative;
}
.tl-scope-select {
  background: #fff;
  border: 1px solid #d2d6de;
  border-radius: 3px;
  padding: 4px 28px 4px 10px;
  font-size: 13px;
  font-weight: 600;
  color: #333;
  cursor: pointer;
  appearance: auto;
  -webkit-appearance: auto;
  min-width: 210px;
  height: 30px;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  box-sizing: border-box;
}
.tl-scope-select:focus {
  border-color: #3c8dbc;
  outline: none;
}
.tl-scope-info {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: #6e7785;
  flex: 0 1 auto;
  min-width: 0;
}
.tl-scope-globe-icon {
  color: #6e7785;
  font-size: 13px;
  flex-shrink: 0;
}
/* Secondary button */
.tl-btn-assign-machine {
  background: #f4f4f4;
  border: 1px solid #d2d6de;
  border-radius: 3px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 600;
  color: #444;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  height: 28px;
  box-sizing: border-box;
  box-shadow: 2px 2px 2px #ddd;
  white-space: nowrap;
  transition: background-color 0.15s ease;
}
.tl-btn-assign-machine:hover {
  background: #e7e7e7;
  color: #444;
  text-decoration: none;
}
.tl-btn-assign-machine:focus-visible {
  border-color: #3c8dbc;
  outline: 2px solid #3c8dbc;
  outline-offset: 1px;
}

/* ---- Assign to Machine dialog ---- */
button.tl-btn-assign-machine {
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}
.tl-btn-assign-machine:disabled,
.tl-btn-assign-machine:disabled:hover {
  opacity: 0.55;
  cursor: not-allowed;
  border-color: #d2d6de;
  color: #444;
  background: #f4f4f4;
}
.tl-assign-note {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: 0 1 auto;
  min-width: 0;
  font-size: 12px;
  color: #333;
  background: #fff;
  border: 1px solid #d2d6de;
  border-left: 3px solid #00a65a;
  border-radius: 2px;
  padding: 2px 4px 2px 8px;
  transition: opacity 0.4s ease;
}
.tl-assign-note[hidden] {
  display: none;
}
.tl-assign-note .fa {
  color: #00a65a;
}
.tl-assign-note.tl-assign-note-error {
  border-left-color: #dd4b39;
}
.tl-assign-note.tl-assign-note-error .fa {
  color: #c0392b;
}
.tl-assign-note.tl-assign-note-fading {
  opacity: 0;
}
.tl-assign-note-close {
  background: transparent;
  border: 0;
  padding: 0 4px;
  font-size: 16px;
  line-height: 1;
  color: #6e7785;
  cursor: pointer;
}
.tl-assign-note-close:hover {
  color: #333;
}
.tl-assign-dialog {
  max-width: 480px;
}
.tl-assign-dialog form {
  display: flex;
  flex-direction: column;
  min-height: 0;
  margin: 0;
}
.tl-assign-dialog select.tl-modal-input {
  height: auto;
  min-height: 32px;
  background: #fff;
  color: #333;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}
.tl-assign-dialog select.tl-modal-input:focus {
  border-color: #3c8dbc;
  outline: none;
}
.tl-assign-check label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.tl-assign-error {
  font-size: 12px;
  color: #c0392b;
}
.tl-assign-alert {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 0 0 12px;
  padding: 8px 10px;
  font-size: 13px;
  color: #333;
  background: #fbe9e7;
  border: 1px solid #e8c4be;
  border-left: 3px solid #dd4b39;
}
.tl-assign-alert[hidden] {
  display: none;
}
.tl-assign-alert .fa {
  color: #c0392b;
  margin-top: 2px;
}
.tl-assign-dialog .tl-btn-modal-save:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.tl-control-right {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  margin-left: auto;
  align-self: flex-start;
}
.tl-view-toggle {
  display: inline-flex;
  border: 1px solid #d2d6de;
  border-radius: 3px;
  box-shadow: 2px 2px 2px #ddd;
  overflow: hidden;
  background: #fff;
  height: 30px;
  box-sizing: border-box;
}
.tl-view-tab {
  border: 0;
  background: #fff;
  color: #444;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 400;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  transition: background-color 0.15s ease;
}
.tl-view-tab:hover:not(.active) {
  background: #f4f4f4;
  color: #333;
}
.tl-view-tab.active {
  background: #424f57;
  color: #fff;
  font-weight: 600;
}
.tl-view-tab:focus-visible {
  outline: 2px solid #3c8dbc;
  outline-offset: -2px;
}
.tl-view-tab:last-child {
  border-left: 1px solid #d2d6de;
}

/* Editing scope: the base list, or one machine's references & tolerances.
   initScopeSelect() puts .tl-mode-machine on <body> while a machine is shown. */
.tl-scope-info,
.tl-scope-globe-icon {
  color: #6e7785;
}
.tl-scope-info-text a {
  color: #357da7; /* white control card: 4.52:1 */
}
.tl-scope-sep {
  color: #6e7785;
}
.tl-scope-status {
  font-weight: 600;
  color: #555;
}
.tl-machine-banner,
.tl-machine-error {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: -10px 0 18px;
  padding: 8px 12px;
  background: #fff;
  border: 1px solid #d2d6de;
  border-left: 3px solid #424f57;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  font-size: 13px;
  color: #333;
}
.tl-machine-banner .fa {
  color: #424f57;
  margin-top: 2px;
}
.tl-machine-error {
  border-left-color: #c0392b;
}
.tl-machine-error .fa {
  color: #c0392b;
  margin-top: 2px;
}
.tl-machine-banner[hidden],
.tl-machine-error[hidden] {
  display: none;
}

/* The Reference & Tolerance column replaces Type Value in machine mode */
.tl-col-reftol {
  display: none;
}
body.tl-mode-machine .tl-col-reftol {
  display: table-cell;
}
body.tl-mode-machine .tl-col-type-value {
  display: none;
}
.tl-th-reftol { width: 320px; }
/* Machine mode has no actions column: the base list's buttons don't apply there,
   and the Reference & Tolerance pencil sits in its own cell */
body.tl-mode-machine .tl-col-actions {
  display: none;
}
/* The pencil leads the cell, beside the first line of values. Its slot keeps
   its width on rows with no pencil (No limits needed, Save the test list
   first, view only), so the values start at the same place on every row. */
.tl-reftol-wrap {
  display: flex;
  align-items: flex-start;
  gap: 4px;
}
.tl-reftol-edit {
  flex: 0 0 24px; /* room for the pencil's 24px tap target on narrow cards */
  display: flex;
  align-items: center;
  justify-content: center;
  /* the first value line's height: the pencil is centred on that line, even
     when its tap target is taller */
  height: 18px;
}
.tl-reftol-values {
  flex: 1 1 auto;
  min-width: 0;
}
.tl-reftol-edit .tl-machine-edit {
  margin-left: 0;
}
/* One line each for the reference and the tolerance, when the type uses both */
.tl-reftol-line {
  display: block;
}
.tl-reftol-line + .tl-reftol-line {
  margin-top: 2px;
}
.tl-reftol-label {
  font-size: 12px;
  color: #5f6773; /* 5.33:1 on the #f5f7fa row hover, like .tl-machine-unused */
}
.tl-machine-value {
  font-size: 13px;
  color: #333;
  overflow-wrap: anywhere;
}
.tl-machine-none {
  font-size: 13px;
  color: #555;
}
.tl-machine-edit {
  margin-left: 6px;
  padding: 2px 4px;
  color: #317399; /* sits in a test row that turns #f5f7fa on hover: 4.84:1 there */
  font-size: 13px;
  text-decoration: none;
}
.tl-machine-edit:hover,
.tl-machine-edit:focus {
  color: #323e46;
  text-decoration: none;
}

/* ---- Machine Reference and Tolerance dialog ---- */
/* "Not set" where it matters: results on this unit will show No Tol Set */
.tl-machine-missing {
  font-size: 13px;
  color: #555;
  white-space: nowrap;
}
.tl-machine-missing .fa {
  color: #8a6420;
  margin-right: 3px;
}
/* #5f6773, not the #6e7785 meta grey: test rows turn #f5f7fa on hover (5.33:1 there; the meta grey is 4.22) */
.tl-machine-unused,
.tl-machine-hint {
  font-size: 12px;
  color: #5f6773;
}
.tl-machine-hint {
  display: block;
  margin-top: 2px;
}
button.tl-machine-edit {
  background: transparent;
  border: 0;
  border-radius: 3px;
  cursor: pointer;
  font-family: inherit;
  line-height: 1;
}
button.tl-machine-edit:focus-visible {
  outline: 2px solid #3c8dbc;
  outline-offset: 1px;
}
.tl-reftol-dialog {
  max-width: 480px;
}
.tl-reftol-dialog form {
  display: flex;
  flex-direction: column;
  min-height: 0;
  margin: 0;
}
.tl-reftol-heading {
  min-width: 0;
}
.tl-reftol-subtitle {
  margin: 2px 0 0;
  font-size: 13px;
  color: #6e7785;
  overflow-wrap: anywhere;
}
.tl-reftol-current {
  margin: 0 0 12px;
  padding: 8px 10px;
  border: 1px solid #d2d6de;
  border-left: 3px solid #424f57;
  font-size: 13px;
  color: #333;
  overflow-wrap: anywhere;
}
.tl-reftol-meta {
  margin-top: 2px;
  font-size: 12px;
  color: #6e7785;
}
.tl-reftol-dialog select.tl-modal-input {
  height: auto;
  min-height: 32px;
  background: #fff;
  color: #333;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}
.tl-reftol-dialog select.tl-modal-input:focus {
  border-color: #3c8dbc;
  outline: none;
}
.tl-reftol-dialog .tl-modal-textarea {
  margin-top: 0;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}
.tl-reftol-dialog .tl-modal-hint a,
.tl-reftol-history-link a {
  color: #357da7; /* dialog is plain white: 4.52:1 */
}
.tl-reftol-history-link {
  margin: 0;
  font-size: 12px;
}
.tl-reftol-dialog .tl-btn-modal-save:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.tl-reftol-tol-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.tl-reftol-tol-row select {
  flex: 1;
  min-width: 0;
}
/* secondary action inside a dialog: "New Tolerance…", "Use This One" */
.tl-btn-newtol {
  flex: 0 0 auto;
  background: #f4f4f4;
  border: 1px solid #d2d6de;
  border-radius: 3px;
  padding: 5px 10px;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: #444;
  box-shadow: 2px 2px 2px #ddd;
  cursor: pointer;
  white-space: nowrap;
}
.tl-btn-newtol:hover {
  background: #e7e7e7;
}
.tl-btn-newtol:focus-visible {
  border-color: #3c8dbc;
  outline: 2px solid #3c8dbc;
  outline-offset: 1px;
}
.tl-newtol-use {
  margin-top: 6px;
  display: block;
}
.tl-assign-alert .tl-newtol-use .fa {
  color: #444;
  margin-top: 0;
}
/* New Tolerance sits on top of the Reference and Tolerance dialog */
.tl-modal-backdrop.tl-newtol-backdrop {
  z-index: 10000;
  background: rgba(0,0,0,0.25);
}
.tl-newtol-limits {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 12px;
}
.tl-newtol-type-label {
  font-size: 13px;
  font-weight: 600;
  color: #555;
}
.tl-newtol-type-value {
  font-size: 14px;
  color: #333;
}
.tl-newtol-unit[hidden] {
  display: none;
}
.tl-reftol-note {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: -10px 0 18px;
  padding: 4px 6px 4px 12px;
  background: #fff;
  border: 1px solid #d2d6de;
  border-left: 3px solid #424f57;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  font-size: 13px;
  color: #333;
  transition: opacity 0.4s ease;
}
.tl-reftol-note[hidden] {
  display: none;
}
.tl-reftol-note .fa {
  color: #424f57;
}
.tl-reftol-note-text {
  flex: 1;
}
.tl-reftol-note.tl-reftol-note-error {
  border-left-color: #c0392b;
}
.tl-reftol-note.tl-reftol-note-error .fa {
  color: #c0392b;
}
.tl-reftol-note.tl-reftol-note-fading {
  opacity: 0;
}

/* Shared settings are locked in machine mode: only that machine's values are shown */
body.tl-mode-machine #tl-tests-card .tl-drag-handle,
body.tl-mode-machine #tl-header-add-test-btn,
body.tl-mode-machine #tl-header-add-sublist-btn,
body.tl-mode-machine #tl-tests-card .tl-btn-change-sublist,
body.tl-mode-machine #tl-tests-card .tl-btn-remove-sublist,
body.tl-mode-machine #tl-tests-card .tl-remove-locked,
body.tl-mode-machine #tl-tests-card .tl-sublist-outline,
body.tl-mode-machine #tl-tests-card .tl-add-desc-link,
body.tl-mode-machine #tl-attachments-card .tl-browse-wrap,
body.tl-mode-machine #tl-attachments-card .btn-delete-existing,
body.tl-mode-machine #tl-attachments-card .btn-remove-pending {
  display: none !important;
}
body.tl-mode-machine #tl-details-card input[readonly],
body.tl-mode-machine #tl-details-card textarea[readonly] {
  background: #f4f4f4;
  color: #555;
  cursor: default;
}

/* ---- Live Preview Container ---- */
.tl-preview-container {
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  color: #333;
  margin-bottom: 24px;
}
/* Notes above the preview: which preview this is, unsaved changes */
.tl-preview-note {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 12px;
  padding: 8px 12px;
  background: #f4f4f4;
  border-left: 3px solid #424f57;
  font-size: 13px;
  color: #333;
}
.tl-preview-note .fa {
  color: #424f57;
  margin-top: 2px;
}
.tl-preview-note a {
  color: #317399; /* on the note's #f4f4f4: 4.72:1 (#357da7 would be 4.11) */
}
/* The real Perform QC page (read-only), with its own scroll */
.tl-preview-frame {
  display: block;
  width: 100%;
  height: calc(100vh - 160px);
  min-height: 600px;
  border: 1px solid #d2d6de;
  background: #fff;
  box-shadow: 0 1px 1px rgba(0,0,0,.1);
}
.tl-preview-banner {
  background: #f4f4f4;
  border-left: 3px solid #424f57;
  border-radius: 0;
  padding: 8px 12px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #333;
  font-weight: 400;
}
.tl-preview-banner .fa {
  color: #424f57;
}
.tl-preview-card {
  background: #fff;
  border-top: 3px solid #424f57;
  box-shadow: 0 1px 1px rgba(0,0,0,.1);
  margin-bottom: 20px;
  padding: 16px 20px;
}
.tl-preview-title {
  font-size: 18px;
  font-weight: 400;
  line-height: 1.2;
  color: #444;
  margin: 0 0 6px;
}
.tl-preview-slug {
  font-size: 14px;
  font-weight: 400;
  color: #6e7785;
}
.tl-preview-desc {
  font-size: 14px;
  line-height: 1.5;
  color: #555;
  margin-bottom: 14px;
}
/* The test list's warning message (shown on the Perform QC page when a test fails) */
.tl-preview-warning {
  background: #fff;
  border: 1px solid #d2d6de;
  border-left: 3px solid #f39c12;
  padding: 8px 12px;
  font-size: 13px;
  color: #333;
  margin-bottom: 16px;
  border-radius: 0;
}
.tl-preview-warning .fa {
  color: #8a6420;
}
.tl-preview-js-note {
  margin-bottom: 14px;
  font-size: 12px;
  color: #555;
  background: #f4f4f4;
  border: 1px solid #d2d6de;
  padding: 6px 10px;
  border-radius: 0;
}
.tl-preview-table-wrap {
  margin-top: 16px;
}
.tlb-table.tl-preview-tests-table {
  border: 1px solid #d2d6de;
  margin-bottom: 16px;
}
.tlb-table.tl-preview-sublist-table {
  border: 1px solid #d2d6de;
  border-top: 0;
  margin-bottom: 16px;
}
.tlb-table .tl-th-input {
  width: 140px;
  text-align: right;
}
.tl-cell-input {
  text-align: right;
}
.tl-preview-sublist-header {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fbfcfd;
  border: 1px solid #d2d6de;
  border-bottom: 0;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 600;
  color: #444;
  margin-top: 16px;
}
.tl-preview-sublist-header .fa {
  color: #555;
}
/* Outlined sublist: mirrors the Perform QC page, which draws a 3px grey
   rule above and below the sublist with its name (italic) as the heading */
.tl-preview-sublist-outlined {
  border-top: 3px solid #ccc;
  border-bottom: 3px solid #ccc;
  margin-top: 16px;
  margin-bottom: 16px;
  padding: 6px 0 0;
}
.tl-preview-sublist-outlined .tl-preview-sublist-header {
  margin-top: 0;
  font-style: italic;
}
.tl-preview-sublist-outlined .tl-sublist-table {
  margin-bottom: 0 !important;
}
.tl-preview-sublist-desc {
  font-size: 13px;
  color: #333;
  padding: 6px 14px;
  border: 1px solid #d2d6de;
  border-bottom: 0;
}
.tl-preview-mock-input {
  background: #fff;
  border: 1px solid #d2d6de;
  border-radius: 0;
  padding: 4px 8px;
  font-size: 13px;
  color: #555;
  width: 100px;
  box-shadow: none;
}
.tl-preview-mock-input::placeholder {
  color: #6d7787;
  opacity: 1;
}

/* ---- Details card (change form) ---- */
.tl-details-card { background:#fff; border-top:3px solid #424f57; box-shadow:0 1px 1px rgba(0,0,0,.1); border-radius:0; margin-bottom:20px; font-family:'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif; color:#333; }
.tl-card-header { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid #f4f4f4; background:#fff; }
.tl-card-header > .fa { font-size:16px; color:#555; }
.tl-card-title { font-size:18px; font-weight:400; color:#444 !important; background:transparent !important; margin:0; line-height:1; padding:0; text-transform:none; letter-spacing:normal; }
.tl-card-body { padding:14px; }
/* tlb- (builder) prefix: base.css already defines shared tl- form, field and table blocks. */
.tlb-form { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }
.tlb-field { display:flex; flex-direction:column; gap:4px; min-width:0; }
.tl-col-1 { grid-column:1; } .tl-col-2 { grid-column:2; } .tl-col-full { grid-column:1 / -1; }
.tlb-field > label, .tl-label-row > label { font-size:13px; font-weight:600; color:#555; margin:0; }
.tl-req { color:#c0392b; font-style:normal; }
.tl-label-row { display:flex; align-items:center; }
.tl-hint { font-size:11px; font-weight:600; margin-left:6px; display:inline-flex; align-items:center; gap:4px; }
.tl-hint-neutral { color:#6e7785; } .tl-hint-warn { color:#8a6420; }
.tl-preview-toggle { margin-left:auto; border:1px solid #d2d6de; background:#f4f4f4; color:#444; border-radius:3px; padding:3px 10px; font-size:11px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:5px; box-shadow:2px 2px 2px #ddd; }
.tl-preview-toggle:hover { background:#e7e7e7; color:#444; }
.tl-preview-toggle.on { background:#e7e7e7; color:#333; box-shadow:inset 0 1px 2px rgba(0,0,0,.1); }
.tl-preview-toggle:focus-visible { border-color:#3c8dbc; outline:2px solid #3c8dbc; outline-offset:1px; }
.tlb-field input[type="text"], .tlb-field textarea, .tlb-field select {
  width:100%; box-sizing:border-box; font-size:14px; color:#555; background:#fff;
  border:1px solid #d2d6de; border-radius:0; box-shadow:2px 2px 2px #ddd;
  padding:6px 10px; min-height:34px; margin:0;
}
.tlb-field textarea { resize:vertical; line-height:1.5; }
.tl-desc-input { min-height:52px; }
.tlb-field #id_javascript { font-family:Menlo, Consolas, monospace; font-size:13px; height:76px; }
.tlb-field #id_slug { font-family:Menlo, Consolas, monospace; font-size:13px; }
.tlb-field input[type="text"]:focus, .tlb-field textarea:focus { border-color:#3c8dbc; outline:none; }
.tl-html-preview { min-height:60px; border:1px solid #d2d6de; box-shadow:2px 2px 2px #ddd; padding:8px 10px; background:#fff; font-size:14px; line-height:1.5; color:#333; }
.tl-html-preview p { margin:0 0 8px; } .tl-html-preview p:last-child { margin-bottom:0; }
.tl-html-preview ul, .tl-html-preview ol { margin:0 0 8px; padding-left:22px; }
.tl-html-preview a { color:#357da7; }
.tl-htmlpreview-empty { color:#6d7787; font-style:italic; }
.tlb-field .errorlist { list-style:none; margin:0 0 4px; padding:0; color:#c0392b; font-size:12px; font-weight:600; }
.tlb-field .errorlist li { margin:0; }

/* ---- Tests Card & Table ---- */
.tl-members-card {
  background: #fff;
  border-top: 3px solid #424f57;
  box-shadow: 0 1px 1px rgba(0,0,0,.1);
  border-radius: 0;
  margin-bottom: 20px;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  color: #333;
}

/* Card header buttons (Expand All, Add Sublist, Add Test): secondary style.
   .tl-card-header-actions already pushes them to the right. */
.tl-header-add-btn {
  border: 1px solid #d2d6de;
  background: #f4f4f4;
  color: #444;
  border-radius: 3px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 28px;
  box-sizing: border-box;
  box-shadow: 2px 2px 2px #ddd;
  transition: background-color 0.15s ease;
}
.tl-header-add-btn:hover {
  background: #e7e7e7;
  color: #444;
}
.tl-header-add-btn:focus-visible,
.tl-header-text-btn:focus-visible,
.tl-btn-sublist:focus-visible {
  border-color: #3c8dbc;
  outline: 2px solid #3c8dbc;
  outline-offset: 1px;
}

/* A size container, so the narrow-screen rules (see "Narrow Screens: Builder
   Table") follow the card's own width, whether or not the admin nav sidebar is open. */
.tl-table-wrap {
  width: 100%;
  overflow-x: auto;
  background: #fff;
  container: tlb-table / inline-size;
  /* Holds the screen-reader-only (position: absolute) header labels, which would
     otherwise widen the whole page whenever the table scrolls sideways. */
  position: relative;
}

.tlb-table {
  width: 100%;
  border-collapse: collapse;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}

.tlb-table thead th {
  text-align: left;
  padding: 7px 10px;
  border-bottom: 2px solid #d2d6de;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .03em;
  color: #6e7785;
  background: #fff;
  white-space: nowrap;
}

.tl-th-drag, .tl-th-lock { width: 36px; padding-right: 0 !important; }
.tl-th-test { min-width: 260px; }
.tl-th-category { width: 140px; text-align: center !important; }
.tl-th-type { width: 150px; }
.tl-th-type-value { width: 220px; }
.tl-th-actions { width: 90px; text-align: right !important; }

.tlb-table tbody tr {
  background: #fff;
  border-bottom: 1px solid #f4f4f4;
  transition: background-color 0.1s ease;
}

.tlb-table tbody tr:hover {
  background-color: #f5f7fa;
}

/* Top-aligned: a long name, description or value makes a row taller, and the
   other cells (handle, chips, icons) stay level with the test name's first line
   instead of drifting to the middle of the row. */
.tlb-table tbody td {
  padding: 8px 10px;
  vertical-align: top;
  font-size: 14px;
  color: #333;
  border: 0;
}

.tl-cell-drag {
  width: 36px;
  text-align: center;
  padding-right: 0 !important;
}

tr.tl-dragging {
  opacity: 0.45;
  background: #f4f4f4 !important;
}

.ui-sortable-helper {
  display: table;
  background: #fff !important;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  border-top: 1px solid #f4f4f4;
  border-bottom: 1px solid #f4f4f4;
}

.tl-drag-handle {
  color: #6d7787;
  font-size: 14px;
  cursor: grab;
  padding: 4px;
}
.tl-drag-handle:active {
  cursor: grabbing;
}

.tl-cell-test {
  display: flex;
  flex-direction: column;
  gap: 3px;
  justify-content: center;
  min-width: 240px;
}

.tl-test-name {
  font-size: 14px;
  font-weight: 600;
  color: #333;
  line-height: 1.3;
}

.tl-test-desc-wrap {
  min-height: 18px;
}

.tl-test-desc {
  display: inline-flex;
  /* icon beside the first line of a long description, not halfway down it */
  align-items: flex-start;
  gap: 6px;
  color: #555;
  font-size: 13px;
  line-height: 1.35;
  cursor: pointer;
}
.tl-test-desc > i {
  color: #6d7787;
  font-size: 11px;
  flex-shrink: 0;
  margin-top: 2px;
}
/* Hover: darker + underline (link blue on the hovered row would be under 4.5:1) */
.tl-test-desc:hover {
  color: #333;
  text-decoration: underline;
}
/* The description links to the Test's own page (new tab): keep the row's grey
   text rather than the admin link colour, darker + underlined on hover. */
a.tl-test-desc:link,
a.tl-test-desc:visited {
  color: #555;
}
a.tl-test-desc:hover {
  color: #333;
  text-decoration: underline;
}
a.tl-test-desc:focus-visible,
a.tl-add-desc-link:focus-visible,
.tl-browse-btn:focus-visible {
  outline: 2px solid #3c8dbc;
  outline-offset: 2px;
}
.tl-test-desc.tl-test-desc-readonly,
.tl-test-desc.tl-test-desc-readonly:hover {
  cursor: default;
  color: #555;
  text-decoration: none;
}

/* Tests without a description: a small link to add one on the Test's own page (new tab) */
a.tl-add-desc-link {
  font-size: 12px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: color 0.15s ease;
}
a.tl-add-desc-link:link,
a.tl-add-desc-link:visited {
  color: #555;
}
a.tl-add-desc-link:hover {
  color: #333;
  text-decoration: underline;
}

.tl-cell-category {
  text-align: center;
}

/* One neutral chip for every category and every test type (full type name):
   colour is kept for QC status meaning (red = Action), so it isn't used to
   tell categories or types apart. */
.tl-cat-pill,
.tl-type-chip {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 3px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.4;
  white-space: nowrap;
  background: #fff;
  border: 1px solid #d2d6de;
  color: #555;
}

/* Base list "Type Value" column: one line, ellipsis, full text in the title tooltip */
.tl-cell-type-value {
  max-width: 220px;
}

.tl-type-value {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  color: #333;
}

.tl-type-value.tl-mono {
  font-size: 12px;
}

/* #555, not the #6e7785 meta grey: rows turn #f5f7fa on hover, where the meta grey is under 4.5:1 */
.tl-type-value-none {
  font-size: 13px;
  color: #555;
}

.tl-cell-actions {
  text-align: right;
  white-space: nowrap;
}
.tl-cell-actions .tl-action-icon {
  background: transparent;
  border: 0;
  padding: 4px 6px;
  color: #6d7787;
  font-size: 14px;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
  transition: color 0.15s ease;
}
.tl-cell-actions .tl-action-icon:hover {
  color: #555;
  background: #eceff3;
}
.tl-cell-actions .tl-delete-test-btn:hover {
  color: #c0392b;
  background: #fbe9e7;
}
.tl-cell-actions .tl-action-icon:focus-visible {
  outline: 2px solid #3c8dbc;
  outline-offset: 0;
}

.tl-empty-tests-placeholder {
  padding: 32px 16px;
  text-align: center;
  color: #6d7787;
  font-size: 13px;
}

/* ---- Sublist Row in Builder Table ---- */
.tl-sublist-row {
  background: transparent !important;
}
.tl-sublist-row:hover {
  background: transparent !important;
}
.tl-sublist-cell {
  padding: 4px 6px !important;
  border-top: 0 !important;
  border-bottom: 0 !important;
  background: transparent !important;
}

/* Sublist cards are neutral: amber means Tolerance in QATrack+. */
.tl-sublist-card {
  border: 1px solid #d2d6de;
  border-radius: 0;
  background: #fff;
  margin: 2px 0;
  box-shadow: 0 1px 1px rgba(0,0,0,.1);
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  overflow: hidden;
  transition: box-shadow 0.15s ease;
}
.tl-sublist-row:hover .tl-sublist-card {
  box-shadow: 0 1px 3px rgba(0,0,0,.15);
}
/* Sublist drawn in its own box on the Perform QC page (Sublist.outline) */
.tl-sublist-card.tl-sublist-outlined {
  border: 2px solid #424f57;
}

.tl-sublist-outline {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin: 0 6px 0 0;
  font-size: 12px;
  font-weight: 600;
  color: #555;
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
}
.tl-sublist-outline input[type="checkbox"] {
  margin: 0;
  cursor: pointer;
}

.tl-sublist-header {
  background: #fbfcfd;
  padding: 6px 10px;
  display: flex;
  /* Top, like the test rows: when a long name wraps (narrow screens), the drag
     handle and toggle stay beside its first line. Each part's first line is 28px
     tall (handle, toggle, folder icon, actions), so a one-line header still
     lines up across the middle. */
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  min-height: 38px;
  box-sizing: border-box;
}
.tl-sublist-header .tl-sublist-drag-handle,
.tl-sublist-header .tl-sublist-toggle-btn,
.tl-sublist-header .tl-sublist-actions {
  min-height: 28px;
  box-sizing: border-box;
}
.tl-sublist-header .tl-sublist-folder-icon {
  line-height: 28px;
}

.tl-sublist-drag-handle {
  cursor: grab;
  color: #6d7787;
  font-size: 13px;
  padding: 4px 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s ease;
}
.tl-sublist-drag-handle:hover {
  color: #444;
}

.tl-sublist-toggle-btn {
  background: transparent;
  border: 0;
  padding: 4px 6px;
  color: #555;
  cursor: pointer;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
  transition: all 0.15s ease;
}
.tl-sublist-toggle-btn:hover {
  background: #e7e7e7;
  color: #333;
}
.tl-sublist-toggle-btn:focus-visible {
  outline: 2px solid #3c8dbc;
  outline-offset: 0;
}
.tl-toggle-icon {
  transition: transform 0.2s ease;
}

.tl-sublist-row.collapsed .tl-sublist-body {
  display: none !important;
}
.tl-sublist-row.collapsed .tl-toggle-icon {
  transform: rotate(0deg);
}

.tl-sublist-row.expanded .tl-sublist-body {
  display: block !important;
}
.tl-sublist-row.expanded .tl-toggle-icon {
  transform: rotate(90deg);
}
.tl-sublist-row.expanded .tl-sublist-header {
  border-bottom: 1px solid #f4f4f4;
  background: #fbfcfd;
}

.tl-sublist-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  flex: 1;
  cursor: pointer;
}

.tl-sublist-folder-icon {
  color: #555;
  font-size: 15px;
}

/* "Sublist" badge and test count: label-default */
.tl-sublist-badge {
  background: #d2d6de;
  color: #444;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 2px;
  letter-spacing: .03em;
  text-transform: uppercase;
}

.tl-sublist-name {
  font-size: 14px;
  font-weight: 600;
  color: #333;
}

.tl-sublist-count {
  background: #d2d6de;
  color: #444;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 2px;
  margin-left: 2px;
}

.tl-sublist-actions {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.tl-card-header-actions {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.tl-header-text-btn {
  background: #f4f4f4;
  border: 1px solid #d2d6de;
  border-radius: 3px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 600;
  color: #444;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  box-shadow: 2px 2px 2px #ddd;
  transition: background-color 0.15s ease;
  height: 28px;
  box-sizing: border-box;
}
.tl-header-text-btn:hover {
  background: #e7e7e7;
  color: #444;
}

/* Sublist header buttons (Edit, Change, Remove): secondary; Remove is the ghost danger style */
.tl-btn-sublist {
  background: #f4f4f4;
  border: 1px solid #d2d6de;
  border-radius: 3px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 600;

/* ---- Narrow Screens: Builder Table ---- */
/* Measured on .tl-table-wrap (the tests card's width), not the window: the admin
   nav sidebar takes about 300px when it's open. Wide cards keep the layout above.
   Narrower cards trade fixed column widths for flexible ones, so every column
   (including Reference and Tolerance in machine mode) fits without scrolling
   sideways: long names wrap, the type name goes under its badge, the row's
   action icons wrap onto two lines. Two tighter steps follow (560px and 420px
   cards, e.g. an 800px window with the nav sidebar open) so the last column,
   with the row's action icons or the Reference & Tolerance pencil, stays in view.
   Only very narrow cards (under about 370px, e.g. a phone) still scroll sideways inside the card. */
@container tlb-table (max-width: 900px) {
  .tlb-table thead th {
    white-space: normal;
    padding: 7px 6px;
  }
  .tlb-table tbody td {
    padding: 8px 6px;
  }
  .tl-th-test { min-width: 120px; }
  .tl-cell-test { min-width: 110px; }
  .tl-th-category,
  .tl-th-type,
  .tl-th-type-value,
  .tl-th-reftol { width: auto; }
  .tl-th-actions { width: 1%; }
  .tl-test-name,
  .tl-test-desc { overflow-wrap: break-word; }
  .tl-cat-pill,
  .tl-type-chip { white-space: normal; }
  .tl-cell-type-value { max-width: 150px; }
  .tl-cell-reftol { min-width: 120px; }
  .tl-th-lock, .tl-cell-lock { padding-left: 4px; }
  /* Two icons per line instead of three in a row */
  .tl-cell-actions {
    white-space: normal;
    min-width: 56px;
    max-width: 72px;
  }
  .tl-cell-actions .tl-action-icon { padding: 4px 5px; }
  .tl-sublist-cell { padding: 4px 2px !important; }
  /* Sublist header: name and buttons wrap onto more lines instead of widening the row */
  .tl-sublist-header { flex-wrap: wrap; }
  .tl-sublist-title-wrap { flex: 1 1 220px; min-width: 0; }
  .tl-sublist-name { overflow-wrap: break-word; }
  .tl-sublist-actions {
    flex-wrap: wrap;
    margin-left: auto;
  }
  .tl-sublist-outline { white-space: normal; }
}
/* Tighter step: smaller paddings and minimum widths, values wrap (up to three
   lines, full text in the tooltip) instead of holding the column open, and
   the row's icons keep a 24px tap target. Nothing is hidden. */
@container tlb-table (max-width: 560px) {
  .tlb-table thead th { padding: 7px 4px; }
  .tlb-table tbody td { padding: 8px 4px; }
  .tl-th-drag, .tl-th-lock,
  .tl-cell-drag, .tl-cell-lock { width: 24px; }
  .tl-th-test { min-width: 88px; }
  .tl-cell-test { min-width: 80px; }
  .tl-cat-pill,
  .tl-type-chip { padding: 1px 5px; }
  .tl-cell-type-value { max-width: 120px; }
  .tl-type-value {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    white-space: normal;
    overflow-wrap: anywhere;
  }
  .tl-cell-reftol { min-width: 0; }
  /* Two icons on the first line, the third under them */
  .tl-cell-actions {
    min-width: 56px;
    max-width: 64px;
  }
  .tl-cell-actions .tl-action-icon {
    box-sizing: border-box; /* the Edit link is an <a>: same 24px box as the buttons */
    min-width: 24px;
    min-height: 24px;
    padding: 4px;
  }
  /* Machine mode: the Reference & Tolerance pencil (or link) keeps a 24px tap target */
  .tlb-table .tl-machine-edit {
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    min-height: 24px;
    padding: 4px;
  }
}
/* Narrowest step: the base list's action icons stack in one column */
@container tlb-table (max-width: 420px) {
  .tlb-table thead th { padding: 7px 3px; }
  .tlb-table tbody td { padding: 8px 3px; }
  .tl-th-test { min-width: 76px; }
  .tl-cell-test { min-width: 70px; }
  .tl-cat-pill,
  .tl-type-chip { padding: 1px 3px; }
  .tl-cell-actions {
    min-width: 24px;
    max-width: 28px;
  }
}
/* The tests card header (Expand All, Add Sublist, Add Test) wraps on narrow windows. */
@media (max-width: 767px) {
  #tl-tests-card .tl-card-header { flex-wrap: wrap; }
  #tl-tests-card .tl-card-header-actions { flex-wrap: wrap; }

  // Plural strings whose singular and plural English text are the same, so
  // TL_STRINGS can't tell the two forms apart. Each entry is keyed by the
  // English msgid and holds the translated forms in the active language's
  // plural order ([one, other] for en, fr and es). blocktranslate renders them
  // from one proper plural msgid; counter=1 and counter=2 pick the two forms,
  // and the with-values keep the %(…)s placeholders for interpolate().
  var TL_PLURALS = {
    "Repeats: %(tests)s and %(count)s more": [
      "{% blocktranslate count counter=1 with tests='%(tests)s' count='%(count)s' asvar s %}Repeats: {{ tests }} and {{ count }} more{% plural %}Repeats: {{ tests }} and {{ count }} more{% endblocktranslate %}{{ s|escapejs }}",
      "{% blocktranslate count counter=2 with tests='%(tests)s' count='%(count)s' asvar s %}Repeats: {{ tests }} and {{ count }} more{% plural %}Repeats: {{ tests }} and {{ count }} more{% endblocktranslate %}{{ s|escapejs }}"
    ]
  };
  var hasOwn = Object.prototype.hasOwnProperty;
  var jsGettext = window.gettext || function (s) { return s; };
  var jsNgettext = window.ngettext || function (s, p, n) { return n === 1 ? s : p; };
  // Django's JS catalogue exposes the active language's plural rule; it can
  // return a number or a boolean, so callers wrap it in Number().
  var jsPluralidx = window.pluralidx || function (n) { return n === 1 ? 0 : 1; };
  var gettext = function (s) {
    return hasOwn.call(TL_STRINGS, s) ? TL_STRINGS[s] : jsGettext(s);
  };
  var ngettext = function (s, p, n) {
    var fromCatalogue = jsNgettext(s, p, n);
    if (fromCatalogue !== s && fromCatalogue !== p) { return fromCatalogue; }  // the JS catalogue has it
    if (hasOwn.call(TL_PLURALS, s)) {
      var forms = TL_PLURALS[s];
      return forms[Math.min(Number(jsPluralidx(n)) || 0, forms.length - 1)];
    }
    return gettext(n === 1 ? s : p);
  };
  var interpolate = window.interpolate || function (fmt, obj) {
    return fmt.replace(/%\(\w+\)s/g, function (m) { return String(obj[m.slice(2, -2)]); });
  };

  // Builder endpoint URLs are reversed by Django's url tag and rendered as data-*
  // attributes on the Tests & Sublists card, so nothing here depends on
  // where the admin is mounted.
  function builderUrl(name) {
    var card = document.getElementById("tl-tests-card");
    return card ? (card.getAttribute("data-" + name + "-url") || "") : "";
  }

  // Change form: toggle the live (htmx-driven) description preview pane.
  function initPreviewToggle() {
    var btn = document.querySelector("[data-desc-toggle]");
    var pane = document.getElementById("tl-desc-preview");
    var ta = document.getElementById("id_description");
    if (!btn || !pane || !ta) { return; }
    function fire() { ta.dispatchEvent(new Event("previewrequested")); }
    btn.addEventListener("click", function (e) {
      e.preventDefault();
      var enable = pane.hidden;
      pane.hidden = !enable;
      btn.classList.toggle("on", enable);
      btn.setAttribute("aria-pressed", enable ? "true" : "false");
      btn.innerHTML = enable
        ? '<i class="fa fa-eye-slash" aria-hidden="true"></i> ' + escapeHtml(gettext("Hide Preview"))
        : '<i class="fa fa-eye" aria-hidden="true"></i> ' + escapeHtml(gettext("Preview"));
      if (enable) { ta.addEventListener("input", fire); fire(); }
      else { ta.removeEventListener("input", fire); }
    });
  }

  // Changelist: whole-row click navigates; keep inner links/inputs working.
  function initRowClick() {
    var table = document.getElementById("result_list");
    if (!table) { return; }
    var search = document.getElementById("searchbar");
    if (search && !search.getAttribute("placeholder")) {
      // TestListAdmin.search_fields: name, description, slug and sublist names
      search.setAttribute("placeholder", gettext("Search name, slug, description or sublist…"));
    }
    table.querySelectorAll("tbody tr").forEach(function (tr) {
      tr.addEventListener("click", function (e) {
        if (e.target.closest("a") || e.target.closest("input") ||
            e.target.closest("label") || window.getSelection().toString()) { return; }
        var link = tr.querySelector("a.tl-editlink") || tr.querySelector("a.tl-cell-name");
        if (link) { window.location = link.href; }
      });
    });
  }

  // Changelist: cap the results pane (and, on wide screens, the filter card) at the
  // space left in the window so only the rows scroll, not the whole page, and the
  // results card's top never ends up under the pinned admin header (.qa-admin-top).
  function initResultsScroll() {
    var results = document.querySelector("#changelist-form .results");
    if (!results || results.dataset.tlFit) { return; }
    results.dataset.tlFit = "1";
    var form = document.getElementById("changelist-form");
    var head = document.querySelector(".tl-results-head") || form;
    var filter = document.getElementById("changelist-filter");
    var pinned = document.getElementById("qa-admin-top");
    var narrow = window.matchMedia ? window.matchMedia("(max-width: 1024px)") : null;
    var GAP = 16;  // breathing room below the cards
    function headerHeight() {
      // Same rule as base_site.html's --qa-admin-top-h: 0 when the header scrolls away.
      if (!pinned || window.getComputedStyle(pinned).position !== "sticky") { return 0; }
      return pinned.getBoundingClientRect().height;
    }
    function fit() {
      var view = window.innerHeight;
      var resBox = results.getBoundingClientRect();
      var above = resBox.top - head.getBoundingClientRect().top;  // title bar + actions bar
      var below = form.getBoundingClientRect().bottom - resBox.bottom;  // paginator
      var avail;
      if (narrow && narrow.matches) {
        // Filter card on top: the page scrolls, so size the whole results card to
        // fit between the pinned header and the bottom of the window, counting the
        // page padding below it (scrolled to the end, that's what sits under it).
        if (filter) { filter.style.maxHeight = ""; }
        var tail = document.documentElement.scrollHeight -
          (form.getBoundingClientRect().bottom + window.scrollY);
        avail = view - headerHeight() - above - below - Math.max(0, tail) - 12;
        results.style.maxHeight = Math.max(240, Math.floor(avail)) + "px";
        return;
      }
      // Filter beside the results: fill the window from where the cards start
      // (measured in page coordinates, so the current scroll doesn't matter).
      var cardTop = head.getBoundingClientRect().top + window.scrollY;
      avail = view - cardTop - above - below - GAP;
      var filterAvail = view - cardTop - GAP;
      results.style.maxHeight = Math.max(240, Math.floor(avail)) + "px";
      if (filter) { filter.style.maxHeight = Math.max(200, Math.floor(filterAvail)) + "px"; }
      // Anything else below the cards (page padding, footer) still makes the page
      // scroll: take that off too.
      var extra = document.documentElement.scrollHeight - view;
      if (extra > 0) {
        results.style.maxHeight = Math.max(240, Math.floor(avail - extra)) + "px";
        if (filter) { filter.style.maxHeight = Math.max(200, Math.floor(filterAvail - extra)) + "px"; }
      }
    }
    var queued = false;
    function queueFit() {
      if (queued) { return; }
      queued = true;
      window.requestAnimationFrame(function () { queued = false; fit(); });
    }
    fit();
    window.addEventListener("resize", queueFit);
    window.addEventListener("load", queueFit);  // web fonts can change the bar heights
    if (filter) {
      // <details> "toggle" doesn't bubble, so listen in the capture phase.
      filter.addEventListener("toggle", queueFit, true);
    }
    if (pinned && window.ResizeObserver) {
      // The pinned header (and so --qa-admin-top-h) changes height as it wraps.
      new ResizeObserver(queueFit).observe(pinned);
    }
  }

  // Changelist, narrow screens (the filter card stacks above the results at the
  // same max-width: 1024px as the CSS): start the filter groups collapsed so the
  // first rows show near the top of the page. A group stays open when a choice
  // other than "All" is picked in it, or when the person opened it themselves
  // (Django's admin/js/filters.js remembers that in sessionStorage). Only the
  // person's own clicks reach that memory: Chrome also fires "toggle" for every
  // group that's parsed open, which filters.js would otherwise store as "opened",
  // and our own collapsing must not be stored either. The groups we closed open
  // again if the window becomes wide. Runs before initResultsScroll() so it
  // measures the collapsed card.
  function initFilterCollapse() {
    var filter = document.getElementById("changelist-filter");
    if (!filter || filter.dataset.tlCollapse || !window.matchMedia) { return; }
    filter.dataset.tlCollapse = "1";
    var narrow = window.matchMedia("(max-width: 1024px)");
    var autoClosed = [];
    function remembered() {
      try {
        return JSON.parse(window.sessionStorage.getItem("django.admin.filtersState")) || {};
      } catch (e) {
        return {};
      }
    }
    function hasActiveChoice(details) {
      // Every filter on this page lists "All" first; it's the selected one when
      // the filter isn't in use.
      var first = details.querySelector("li");
      var selected = details.querySelector("li.selected");
      return !!selected && selected !== first;
    }
    // A click on a summary (Enter and Space on a focused summary click it too)
    // marks its group as toggled by the person.
    filter.addEventListener("click", function (e) {
      var summary = e.target.closest ? e.target.closest("summary") : null;
      if (summary && summary.parentNode.tagName === "DETAILS") {
        summary.parentNode.tlUserToggle = true;
      }
    }, true);
    // "toggle" doesn't bubble: a capture listener on window runs before
    // filters.js's listener on the <details>, so other toggles never reach it.
    window.addEventListener("toggle", function (e) {
      var details = e.target;
      if (!details || !filter.contains(details)) { return; }
      if (!details.tlUserToggle) {
        e.stopImmediatePropagation();
        return;
      }
      details.tlUserToggle = false;
      // The person toggled it: from now on it's theirs, not ours to reopen.
      var i = autoClosed.indexOf(details);
      if (i !== -1) { autoClosed.splice(i, 1); }
    }, true);
    function apply() {
      if (narrow.matches) {
        var state = remembered();
        filter.querySelectorAll("details").forEach(function (details) {
          if (!details.open || hasActiveChoice(details) ||
              state[details.dataset.filterTitle] === true) { return; }
          details.open = false;
          autoClosed.push(details);
        });
      } else {
        autoClosed.forEach(function (details) { details.open = true; });
        autoClosed = [];
      }
    }
    apply();
    if (narrow.addEventListener) { narrow.addEventListener("change", apply); }
    else if (narrow.addListener) { narrow.addListener(apply); }
  }

  function sortBuilderItemsByOrder() {
    var tbody = document.getElementById("tl-tests-tbody");
    if (!tbody) { return; }
    var rows = Array.from(tbody.querySelectorAll("tr.tl-member-item"));
    if (rows.length <= 1) { return; }

    rows.sort(function (a, b) {
      var orderA = parseInt(a.getAttribute("data-order"), 10);
      if (isNaN(orderA)) {
        var inputA = a.querySelector(".tl-order-input, .tl-sublist-order-input");
        orderA = inputA && inputA.value !== "" ? parseInt(inputA.value, 10) : 9999;
      }
      var orderB = parseInt(b.getAttribute("data-order"), 10);
      if (isNaN(orderB)) {
        var inputB = b.querySelector(".tl-order-input, .tl-sublist-order-input");
        orderB = inputB && inputB.value !== "" ? parseInt(inputB.value, 10) : 9999;
      }
      return orderA - orderB;
    });

    rows.forEach(function (r) {
      tbody.appendChild(r);
    });
  }

  function updateCounts() {
    var rows = document.querySelectorAll("#tl-tests-tbody tr.tl-member-item");
    var visibleDirectCount = 0;
    var visibleSublistsCount = 0;
    var sublistTestsCount = 0;

    rows.forEach(function (r) {
      var del = r.querySelector("input[name$='-DELETE']");
      var isDel = del && (del.checked || del.value === "true");
      var isHidden = r.style.display === "none";
      if (!isDel && !isHidden) {
        if (r.classList.contains("tl-test-row")) {
          visibleDirectCount++;
        } else if (r.classList.contains("tl-sublist-row")) {
          visibleSublistsCount++;
          var subRows = r.querySelectorAll("tbody tr.tl-sublist-test-row");
          sublistTestsCount += subRows.length;
        }
      }
    });

    // Both the card badge and the page header show the total number of tests,
    // including the tests inside sublists, so the two numbers always agree.
    var totalTests = visibleDirectCount + sublistTestsCount;

    var badge = document.getElementById("tl-tests-count");
    if (badge) { badge.textContent = totalTests; }
    var emptyMsg = document.getElementById("tl-empty-tests-msg");
    if (emptyMsg) {
      emptyMsg.style.display = (visibleDirectCount + visibleSublistsCount) === 0 ? "block" : "none";
    }

    var headerCounts = document.getElementById("tl-header-counts");
    if (headerCounts) {
      var tStr = interpolate(ngettext("%(count)s test", "%(count)s tests", totalTests), {count: totalTests}, true);
      var sStr = interpolate(ngettext("%(count)s sublist", "%(count)s sublists", visibleSublistsCount), {count: visibleSublistsCount}, true);
      headerCounts.innerHTML = '<span>' + escapeHtml(tStr) + '</span> &middot; <span>' + escapeHtml(sStr) + '</span>';
    }
  }

  function syncOrder() {
    var order = 0;
    var rows = document.querySelectorAll("#tl-tests-tbody tr.tl-member-item");
    rows.forEach(function (r) {
      var del = r.querySelector("input[name$='-DELETE']");
      var isDel = del && (del.checked || del.value === "true");
      var isHidden = r.style.display === "none";

      var orderInput = r.querySelector(".tl-order-input, .tl-sublist-order-input");
      if (orderInput) {
        if (!isDel && !isHidden) {
          orderInput.value = order;
          r.setAttribute("data-order", order);
          order++;
        } else {
          orderInput.value = "";
        }
      }
    });

    updateCounts();
  }

  // ---- Duplicate guard for the Add Test / Add Sublist dialogs ----
  // A test may appear only once in a test list, counting its own tests and the
  // tests in every sublist (TestListAdminForm.clean refuses the save otherwise).
  // The search dialogs mark results that would break that rule, using what the
  // builder holds right now: unsaved additions count, removed rows don't.

  // Removed in the builder: same test as updateCounts and syncOrder.
  function isBuilderRowRemoved(r) {
    var del = r.querySelector("input[name$='-DELETE']");
    var isDel = del && (del.checked || del.value === "true");
    return !!isDel || r.style.display === "none";
  }

  // Rows the builder is still fetching (Add clicked, row not in the table yet).
  var pendingBuilderAdds = { tests: {}, sublists: {} };

  // {tests: {testId: sublistName or null}, sublists: {childId: true}}. The
  // sublist being swapped by Change still counts as present (choosing it again
  // is no change), but its tests don't count against its replacement.
  function builderContents() {
    var tests = {};
    var sublists = {};
    var rows = document.querySelectorAll("#tl-tests-tbody > tr.tl-member-item");
    rows.forEach(function (r) {
      if (r.classList.contains("empty-form") || isBuilderRowRemoved(r)) { return; }
      if (r.classList.contains("tl-test-row")) {
        var testInput = r.querySelector("input[name$='-test']");
        var testId = r.getAttribute("data-test-id") || (testInput && testInput.value);
        if (testId) { tests[testId] = null; }
      } else if (r.classList.contains("tl-sublist-row")) {
        // the -child input is what gets saved, so trust it over data-child-id
        var childInput = r.querySelector("input[name$='-child']");
        var childId = childInput ? childInput.value : r.getAttribute("data-child-id");
        if (childId) { sublists[childId] = true; }
        if (activeSwapCard && r.contains(activeSwapCard)) { return; }
        var nameEl = r.querySelector(".tl-sublist-name");
        var name = nameEl ? nameEl.textContent.trim() : "";
        r.querySelectorAll("tr.tl-sublist-test-row[data-test-id]").forEach(function (tr) {
          var tid = tr.getAttribute("data-test-id");
          if (tid && !hasOwn.call(tests, tid)) { tests[tid] = name; }
        });
      }
    });
    Object.keys(pendingBuilderAdds.tests).forEach(function (tid) {
      if (!hasOwn.call(tests, tid)) { tests[tid] = pendingBuilderAdds.tests[tid]; }
    });
    Object.keys(pendingBuilderAdds.sublists).forEach(function (cid) { sublists[cid] = true; });
    return { tests: tests, sublists: sublists };
  }

  function sublistResultTests(item) {
    var ids = (item.getAttribute("data-child-test-ids") || "").split(",").filter(Boolean);
    var names = [];
    try { names = JSON.parse(item.getAttribute("data-child-test-names") || "[]") || []; } catch (err) { names = []; }
    return ids.map(function (tid, i) { return { id: tid, name: names[i] || tid }; });
  }

  // null when the test can be added, else {note, title}.
  function testBlockReason(testId, have) {
    if (!testId || !hasOwn.call(have.tests, testId)) { return null; }
    var sublistName = have.tests[testId];
    if (sublistName === null) {
      return {
        note: gettext("Already in this test list"),
        title: gettext("Can't add: this test is already in this test list.")
      };
    }
    return {
      note: interpolate(gettext("Already in sublist %(name)s"), { name: sublistName }, true),
      title: interpolate(gettext("Can't add: this test is already in sublist %(name)s."), { name: sublistName }, true)
    };
  }

  function sublistBlockReason(item, have) {
    var childId = item.getAttribute("data-child-id");
    if (childId && have.sublists[childId]) {
      return {
        note: gettext("Already a sublist here"),
        title: gettext("Can't add: this test list is already a sublist here.")
      };
    }
    var repeats = sublistResultTests(item).filter(function (t) {
      return hasOwn.call(have.tests, t.id);
    }).map(function (t) { return t.name; });
    if (!repeats.length) { return null; }
    var shown = repeats.slice(0, 3).join(", ");
    var note = repeats.length > 3 ?
      interpolate(ngettext("Repeats: %(tests)s and %(count)s more", "Repeats: %(tests)s and %(count)s more",
        repeats.length - 3), { tests: shown, count: repeats.length - 3 }, true) :
      interpolate(gettext("Repeats: %(tests)s"), { tests: shown }, true);
    return {
      note: note,
      title: interpolate(gettext("Can't add: these tests are already in this test list: %(tests)s."),
        { tests: repeats.join(", ") }, true)
    };
  }

  function applySearchBlock(item, btn, reason) {
    var left = item.querySelector(".tl-search-item-left");
    var note = item.querySelector(".tl-search-blocked-note");
    item.classList.toggle("tl-search-item-blocked", !!reason);
    if (reason) {
      if (!note && left) {
        note = document.createElement("div");
        note.className = "tl-search-blocked-note";
        note.innerHTML = '<i class="fa fa-exclamation-triangle" aria-hidden="true"></i> <span class="tl-search-blocked-text"></span>';
        left.appendChild(note);
      }
      if (note) { note.querySelector(".tl-search-blocked-text").textContent = reason.note; }
      if (btn) {
        if (btn === document.activeElement) {
          var input = document.getElementById("tl-search-input");
          if (input) { input.focus(); }
        }
        btn.disabled = true;
        btn.setAttribute("aria-disabled", "true");
        btn.title = reason.title;
      }
    } else {
      if (note) { note.parentNode.removeChild(note); }
      if (btn) {
        btn.disabled = false;
        btn.removeAttribute("aria-disabled");
        btn.removeAttribute("title");
      }
    }
  }

  // Marks every result in the search dialog; runs whenever results arrive.
  function markSearchResults() {
    var box = document.getElementById("tl-search-results-box");
    if (!box) { return; }
    var have = builderContents();
    box.querySelectorAll(".tl-search-test-item").forEach(function (item) {
      applySearchBlock(item, item.querySelector(".tl-btn-select-test"),
        testBlockReason(item.getAttribute("data-test-id"), have));
    });
    box.querySelectorAll(".tl-search-sublist-item").forEach(function (item) {

  // childTests/childName (optional, from the search result) let the sublist's
  // tests count as present while its card is still loading.
  function addSublistCard(childId, childTests, childName) {
    // backstop for a stale result or a fast second click: never add a sublist twice
    // (the click handler has already checked its tests against the builder)
    if (builderContents().sublists[String(childId)]) { return; }
    var pendingTestIds = (childTests || []).map(function (t) { return t.id; }).filter(function (tid) {
      return !hasOwn.call(pendingBuilderAdds.tests, tid);
    });
    pendingBuilderAdds.sublists[childId] = true;
    pendingTestIds.forEach(function (tid) { pendingBuilderAdds.tests[tid] = childName || ""; });
    var clearPending = function () {
      delete pendingBuilderAdds.sublists[childId];
      pendingTestIds.forEach(function (tid) { delete pendingBuilderAdds.tests[tid]; });
    };
    if (activeSwapCard) {
      // Change: the same Sublist row now points at a different list. Keep its
      // formset index, saved id, order and outline so saving updates that row.
      var oldRow = activeSwapCard;
      activeSwapCard = null;
      var rowInput = function (suffix) { return oldRow.querySelector("input[name$='-" + suffix + "']"); };
      var idInput = rowInput("id");
      var outlineInput = rowInput("outline");
      var orderInput = rowInput("order");
      var swapTestsCard = document.getElementById("tl-tests-card");
      var swapParentId = swapTestsCard ? (swapTestsCard.getAttribute("data-original-id") || "") : "";
      var swapUrl = builderUrl("add-sublist-card") + "?swap=1&child_id=" + encodeURIComponent(childId) +
                "&index=" + encodeURIComponent(oldRow.getAttribute("data-index") || "0") +
                "&sublist_id=" + encodeURIComponent(idInput ? idInput.value : "") +
                "&order=" + encodeURIComponent(orderInput ? orderInput.value : "") +
                "&outline=" + (outlineInput && outlineInput.checked ? "1" : "0") +
                "&parent_id=" + encodeURIComponent(swapParentId);
      fetch(swapUrl)
        .then(function (res) {
          if (!res.ok) { throw new Error(res.status); }
          return res.text();
        })
        .then(function (html) {
          clearPending();
          var temp = document.createElement("tbody");
          temp.innerHTML = html.trim();
          var newRow = temp.firstElementChild;
          if (!newRow || !oldRow.parentNode) { return; }
          // the search dialog has closed by now and handed focus back to the old Change button
          var active = document.activeElement;
          var hadFocus = !active || active === document.body || oldRow.contains(active);
          oldRow.parentNode.replaceChild(newRow, oldRow);
          if (window.htmx) { htmx.process(newRow); }
          syncOrder();
          initSortables();
          if (hadFocus) { focusIfThere(newRow.querySelector(".tl-btn-change-sublist")); }
        })
        .catch(clearPending);
      return;
    }

    var totalFormsInput = document.getElementById("id_children-TOTAL_FORMS");
    var currentIndex = totalFormsInput ? (parseInt(totalFormsInput.value, 10) || 0) : 0;
    var testsCard = document.getElementById("tl-tests-card");
    var originalId = testsCard ? (testsCard.getAttribute("data-original-id") || "") : "";

    var url = builderUrl("add-sublist-card") + "?child_id=" + encodeURIComponent(childId) +
              "&index=" + currentIndex +
              "&parent_id=" + encodeURIComponent(originalId);

    fetch(url)
      .then(function (res) { return res.text(); })
      .then(function (html) {
        clearPending();
        var tbody = document.getElementById("tl-tests-tbody");
        if (!tbody) { return; }
        var temp = document.createElement("tbody");
        temp.innerHTML = html.trim();
        var newCard = temp.firstElementChild;
        if (newCard) {

          if (totalFormsInput) { totalFormsInput.value = currentIndex + 1; }
          if (window.htmx) { htmx.process(newCard); }
          syncOrder();
          initSortables();
        }
      }, clearPending);

  // Drag-and-drop sortable support (HTML5 native + jQuery UI if available)
  function initSortables() {
    var $ = window.django && window.django.jQuery ? window.django.jQuery : (window.jQuery || window.$);
    if ($ && $.fn && $.fn.sortable) {
      try {
        $("#tl-tests-tbody").sortable({
          handle: ".tl-drag-handle",
          items: "> tr.tl-member-item",
          axis: "y",
          helper: function (e, tr) {
            var $originals = tr.children();
            var $helper = tr.clone();
            $helper.children().each(function (index) {
              $(this).width($originals.eq(index).width());
            });
            return $helper;
          },
          start: function (e, ui) {
            ui.placeholder.height(ui.item.height());
          },
          update: function () {
            syncOrder();
          }
        });
      } catch (err) {}
    }

    // HTML5 drag-and-drop fallback
    var tbody = document.getElementById("tl-tests-tbody");
    if (tbody) {
      tbody.querySelectorAll("tr.tl-member-item").forEach(function (row) {
        var handle = row.querySelector(".tl-drag-handle");
        if (handle && !row.hasAttribute("data-dnd-init")) {
          row.setAttribute("data-dnd-init", "true");
          handle.setAttribute("draggable", "true");
          handle.addEventListener("dragstart", function (e) {
            e.dataTransfer.setData("text/plain", "");
            row.classList.add("tl-dragging");
            window._tlDraggedRow = row;
          });
          handle.addEventListener("dragend", function () {
            row.classList.remove("tl-dragging");
            window._tlDraggedRow = null;
            syncOrder();
          });
          row.addEventListener("dragover", function (e) {
            e.preventDefault();
            var dragged = window._tlDraggedRow;
            if (dragged && dragged !== row && row.parentNode === tbody) {
              var rect = row.getBoundingClientRect();
              var mid = rect.top + rect.height / 2;
              if (e.clientY < mid) {
                tbody.insertBefore(dragged, row);
              } else {
                tbody.insertBefore(dragged, row.nextSibling);
              }
            }
          });
        }
      });
    }
  }

  function initSublistToggles() {

        e.preventDefault();
        var sublistRows = document.querySelectorAll("#tl-tests-tbody tr.tl-sublist-row");
        if (sublistRows.length === 0) { return; }

        var anyCollapsed = Array.from(sublistRows).some(function (r) {
          return r.classList.contains("collapsed") && r.style.display !== "none";
        });

        sublistRows.forEach(function (r) {
          var body = r.querySelector(".tl-sublist-body");

          if (anyCollapsed) {

            if (btn) { btn.setAttribute("aria-expanded", "true"); }
          } else {
            r.classList.remove("expanded");
            r.classList.add("collapsed");
            if (body) { body.style.display = "none"; }
            if (btn) { btn.setAttribute("aria-expanded", "false"); }

        if (toggleAllText) {
          toggleAllText.textContent = anyCollapsed ? gettext("Collapse All") : gettext("Expand All");

        sCard.style.opacity = "0";

    // Duplicate Test button
    var dupBtn = e.target.closest(".tl-duplicate-test-btn");

      if (!dTestId && dRow) {

          fetch(builderUrl("duplicate-test") + "?test_id=" + encodeURIComponent(dTestId) + "&index=" + currentIndex, {
