{% comment %}
Test List Builder — inlined CSS + glue JS for the admin change form & changelist.

Inlined (not a static file) so it loads under DEBUG=False without a collectstatic
step. The live description preview and test list builder are driven by htmx.
{% endcomment %}
<style>
:root {
  --tl-primary: #424f57; --tl-primary-2: #323e46; --tl-blue: #3c8dbc; --tl-red: #dd4b39;
  --tl-gray: #d2d6de; --tl-text: #333; --tl-muted: #777; --tl-line: #d2d6de;
  --tl-line-soft: #f4f4f4; --tl-label: #555; --tl-group-label: #8a929e; --tl-warn: #b6893b;
  --tl-card-shadow: 0 1px 1px rgba(0,0,0,.1); --tl-input-shadow: 2px 2px 2px #ddd;
  --tl-font: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  --tl-mono: ui-monospace, Menlo, Consolas, monospace;
}
.tl-mono { font-family: var(--tl-mono); }

/* Keep this deliberately-light UI legible under Django 4.2's dark admin theme:
   re-assert light theme variables on our always-white components so inherited /
   variable-driven text stays dark-on-white. */
.tl-details-card, .tl-members-card, #changelist {
  --body-fg: #333; --body-bg: #fff; --body-quiet-color: #777; --body-loud-color: #111;
  --link-fg: #3c8dbc; --link-hover-color: #3c8dbc; --hairline-color: #f4f4f4;
  --border-color: #d2d6de; --darkened-bg: #f8f9fa; --selected-bg: #f5f7fa; --selected-row: #f5f7fa;
}

/* ---- Details card (change form) ---- */
.tl-details-card { background:#fff; border-top:3px solid var(--tl-primary); box-shadow:var(--tl-card-shadow); border-radius:0; margin-bottom:20px; font-family:var(--tl-font); color:var(--tl-text); }
.tl-card-header { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--tl-line-soft); background:#fff; }
.tl-card-header > .fa { font-size:16px; color:#555; }
.tl-card-title { font-size:17px; font-weight:600; color:#444 !important; background:transparent !important; margin:0; line-height:1; padding:0; }
.tl-card-id { margin-left:auto; font-size:12px; font-weight:600; color:var(--tl-group-label); }
.tl-card-body { padding:14px; }
.tl-form { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }
.tl-field { display:flex; flex-direction:column; gap:4px; min-width:0; }
.tl-col-1 { grid-column:1; } .tl-col-2 { grid-column:2; } .tl-col-full { grid-column:1 / -1; }
.tl-field > label, .tl-label-row > label { font-size:13px; font-weight:600; color:var(--tl-label); margin:0; }
.tl-req { color:var(--tl-red); font-style:normal; }
.tl-label-row { display:flex; align-items:center; }
.tl-hint { font-size:11px; font-weight:600; margin-left:6px; display:inline-flex; align-items:center; gap:4px; }
.tl-hint-neutral { color:var(--tl-group-label); } .tl-hint-warn { color:var(--tl-warn); }
.tl-preview-toggle { margin-left:auto; border:1px solid #cfd5df; background:#fff; color:#6b7280; border-radius:3px; padding:3px 10px; font-size:11px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
.tl-preview-toggle:hover { border-color:var(--tl-blue); color:var(--tl-blue); }
.tl-preview-toggle.on { border-color:var(--tl-blue); color:var(--tl-blue); background:#f2f8fc; }
.tl-field input[type="text"], .tl-field textarea, .tl-field select {
  width:100%; box-sizing:border-box; font-size:14px; color:#555; background:#fff;
  border:1px solid var(--tl-line); border-radius:0; box-shadow:var(--tl-input-shadow);
  padding:6px 10px; min-height:34px; margin:0;
}
.tl-field textarea { resize:vertical; line-height:1.5; }
.tl-desc-input { min-height:52px; }
.tl-field #id_javascript { font-family:var(--tl-mono); font-size:13px; height:76px; }
.tl-field #id_slug { font-family:var(--tl-mono); font-size:13px; }
.tl-field input[type="text"]:focus, .tl-field textarea:focus { border-color:var(--tl-blue); outline:none; }
.tl-html-preview { min-height:60px; border:1px solid var(--tl-line); box-shadow:var(--tl-input-shadow); padding:8px 10px; background:#fcfcfd; font-size:14px; line-height:1.55; color:var(--tl-text); }
.tl-html-preview p { margin:0 0 8px; } .tl-html-preview p:last-child { margin-bottom:0; }
.tl-html-preview ul, .tl-html-preview ol { margin:0 0 8px; padding-left:22px; }
.tl-html-preview a { color:var(--tl-blue); }
.tl-htmlpreview-empty { color:#9aa2ae; font-style:italic; }
.tl-field .errorlist { list-style:none; margin:0 0 4px; padding:0; color:var(--tl-red); font-size:12px; font-weight:600; }
.tl-field .errorlist li { margin:0; }

/* ---- Tests Card & Table ---- */
.tl-members-card {
  background: #fff;
  border-top: 3px solid var(--tl-primary);
  box-shadow: var(--tl-card-shadow);
  border-radius: 0;
  margin-bottom: 20px;
  font-family: var(--tl-font);
  color: var(--tl-text);
}

.tl-header-add-btn {
  margin-left: auto;
  border: 1px solid #cfd5df;
  background: #fff;
  color: #4b5563;
  border-radius: 3px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s ease;
}
.tl-header-add-btn:hover {
  border-color: var(--tl-blue);
  color: var(--tl-blue);
  background: #f2f8fc;
}

.tl-table-wrap {
  width: 100%;
  overflow-x: auto;
  background: #fff;
}

.tl-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--tl-font);
}

.tl-table thead th {
  text-align: left;
  padding: 10px 14px;
  border-bottom: 2px solid var(--tl-line-soft);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #8a929e;
  background: #fff;
  white-space: nowrap;
}

.tl-th-drag, .tl-th-lock { width: 36px; padding-right: 0 !important; }
.tl-th-test { min-width: 260px; }
.tl-th-category { width: 140px; text-align: center !important; }
.tl-th-type { width: 150px; }
.tl-th-ref { width: 120px; }
.tl-th-tol { width: 120px; }
.tl-th-actions { width: 90px; text-align: right !important; }

.tl-table tbody tr {
  background: #fff;
  border-bottom: 1px solid var(--tl-line-soft);
  transition: background-color 0.1s ease;
}

.tl-table tbody tr:hover {
  background-color: #f8fafc;
}

.tl-table tbody td {
  padding: 11px 14px;
  vertical-align: middle;
  font-size: 13.5px;
  color: var(--tl-text);
  border: 0;
}

.tl-cell-drag {
  width: 36px;
  text-align: center;
  padding-right: 0 !important;
}

tr.tl-dragging {
  opacity: 0.45;
  background: #f1f5f9 !important;
}

.ui-sortable-helper {
  display: table;
  background: #fff !important;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  border-top: 1px solid var(--tl-line-soft);
  border-bottom: 1px solid var(--tl-line-soft);
}

.tl-drag-handle {
  color: #94a3b8;
  font-size: 14px;
  cursor: grab;
  padding: 4px;
}
.tl-drag-handle:active {
  cursor: grabbing;
}

.tl-cell-test {
  display: flex;
  flex-direction: column;
  gap: 3px;
  justify-content: center;
  min-width: 240px;
}

.tl-test-name {
  font-size: 14px;
  font-weight: 600;
  color: #1e293b;
  line-height: 1.3;
}

.tl-test-desc-wrap {
  min-height: 18px;
}

.tl-test-desc {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #64748b;
  font-size: 12.5px;
  line-height: 1.35;
  cursor: pointer;
}
.tl-test-desc > i {
  color: #94a3b8;
  font-size: 11px;
  flex-shrink: 0;
}
.tl-test-desc:hover {
  color: var(--tl-blue);
}

.tl-add-desc-btn {
  background: transparent;
  border: 0;
  padding: 0;
  color: #94a3b8;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: color 0.15s ease;
}
.tl-add-desc-btn:hover {
  color: var(--tl-blue);
}

.tl-cell-category {
  text-align: center;
}

.tl-cat-pill {
  display: inline-block;
  padding: 2px 14px;
  border-radius: 9999px;
  font-size: 11.5px;
  font-weight: 500;
  line-height: 1.4;
  white-space: nowrap;
  background: #fff;
  border: 1px solid #94a3b8;
  color: #475569;
}
.tl-cat-general {
  border-color: #94a3b8;
  color: #475569;
}
.tl-cat-safety {
  border-color: #ef4444;
  color: #dc2626;
}
.tl-cat-dosimetry {
  border-color: #3b82f6;
  color: #2563eb;
}
.tl-cat-mechanical {
  border-color: #8b5cf6;
  color: #7c3aed;
}
.tl-cat-imaging {
  border-color: #0d9488;
  color: #0f766e;
}

.tl-type-pill-wrap {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
}

.tl-type-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10.5px;
  font-weight: 700;
  color: #fff;
  border-radius: 3px;
  padding: 2px 6px;
  min-width: 26px;
  text-align: center;
  line-height: 1.2;
}

.tl-type-num { background: #2b78a9; }
.tl-type-yn { background: #008744; }
.tl-type-mc { background: #7c3aed; }
.tl-type-comp { background: #d97706; }
.tl-type-const { background: #0d9488; }
.tl-type-str { background: #64748b; }
.tl-type-scomp { background: #4f46e5; }
.tl-type-upload { background: #6366f1; }
.tl-type-date { background: #0891b2; }
.tl-type-default { background: #64748b; }

.tl-type-label {
  font-size: 13px;
  color: #334155;
  font-weight: 500;
}

.tl-val-text {
  font-size: 13px;
  color: #334155;
  font-weight: 500;
}

.tl-empty-dash {
  color: #cbd5e1;
  font-weight: 600;
  font-size: 13px;
}

.tl-cell-actions {
  text-align: right;
  white-space: nowrap;
}
.tl-cell-actions .tl-action-icon {
  background: transparent;
  border: 0;
  padding: 4px 6px;
  color: #94a3b8;
  font-size: 13.5px;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s ease;
}
.tl-cell-actions .tl-action-icon:hover {
  color: var(--tl-blue);
}
.tl-cell-actions .tl-delete-test-btn:hover {
  color: var(--tl-red);
}

.tl-empty-tests-placeholder {
  padding: 32px 16px;
  text-align: center;
  color: #94a3b8;
  font-size: 13.5px;
}

/* ---- Sublist Card ---- */
.tl-sublists-section {
  margin-top: 20px;
  margin-bottom: 12px;
}

.tl-sublist-card {
  border: 2px solid #d99b26;
  border-radius: 4px;
  background: #fff;
  margin-bottom: 20px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  font-family: var(--tl-font);
  overflow: hidden;
}

.tl-sublist-header {
  background: #fff;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.tl-sublist-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.tl-sublist-folder-icon {
  color: #d99b26;
  font-size: 16px;
}

.tl-sublist-badge {
  background: #d99b26;
  color: #fff;
  font-size: 10.5px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 3px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.tl-sublist-name {
  font-size: 16px;
  font-weight: 700;
  color: #1e293b;
}

.tl-sublist-count {
  background: #e2e8f0;
  color: #475569;
  font-size: 11.5px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 10px;
  margin-left: 2px;
}

.tl-sublist-actions {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.tl-btn-sublist {
  background: #fff;
  border: 1px solid #d1d5db;
  border-radius: 3px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 600;
  color: #374151;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  text-decoration: none;
  box-shadow: 0 1px 1px rgba(0,0,0,0.04);
  transition: all 0.15s ease;
}
.tl-btn-sublist:hover {
  border-color: var(--tl-blue);
  color: var(--tl-blue);
}
.tl-btn-sublist.tl-btn-remove-sublist:hover {
  border-color: var(--tl-red);
  color: var(--tl-red);
}

.tl-sublist-info-banner {
  background: #fffdf5;
  border-top: 1px solid #fef08a;
  border-bottom: 1px solid #fef08a;
  padding: 7px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: #78350f;
}
.tl-sublist-info-banner > .fa {
  color: #d99b26;
  font-size: 14px;
  flex-shrink: 0;
}

.tl-sublist-table-wrap {
  width: 100%;
  overflow-x: auto;
}

.tl-sublist-table tbody tr {
  background: #fff;
  border-bottom: 1px solid #f8fafc;
}
.tl-sublist-table tbody tr:hover {
  background: #fffefb;
}

.tl-cell-lock {
  width: 36px;
  text-align: center;
  padding-right: 0 !important;
  color: #94a3b8;
  font-size: 12px;
  white-space: nowrap;
}
.tl-lock-icon {
  color: #c4b5fd;
  margin-right: 4px;
}
.tl-caret-icon {
  color: #94a3b8;
}

.tl-empty-sublist-msg {
  padding: 16px 14px;
  color: #94a3b8;
  font-style: italic;
  font-size: 13px;
}

/* ---- Bottom Actions ---- */
.tl-bottom-actions {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.tl-add-btn {
  background: #fff;
  border: 1px solid #d1d5db;
  border-radius: 3px;
  padding: 7px 14px;
  font-size: 13px;
  font-weight: 600;
  color: #374151;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  transition: all 0.15s ease;
}
.tl-add-btn:hover {
  border-color: #9ca3af;
  background: #f9fafb;
  color: #111827;
}

.tl-bottom-caption {
  font-size: 13px;
  color: #6b7280;
}

/* ---- Modals & Search Dialog ---- */
.tl-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.tl-modal-backdrop[hidden] {
  display: none !important;
}

.tl-modal-dialog {
  background: #fff;
  border-radius: 4px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  width: 100%;
  max-width: 580px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-family: var(--tl-font);
}
.tl-search-dialog {
  max-width: 650px;
}

.tl-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--tl-line-soft);
  background: #f8fafc;
}
.tl-modal-title {
  font-size: 16px;
  font-weight: 600;
  color: #1e293b;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tl-modal-close-btn {
  background: transparent;
  border: 0;
  font-size: 20px;
  line-height: 1;
  color: #94a3b8;
  cursor: pointer;
}
.tl-modal-close-btn:hover {
  color: #1e293b;
}

.tl-modal-body {
  padding: 16px;
  overflow-y: auto;
  flex: 1;
}

.tl-modal-textarea {
  width: 100%;
  box-sizing: border-box;
  font-size: 13.5px;
  border: 1px solid var(--tl-line);
  padding: 8px 10px;
  border-radius: 3px;
  line-height: 1.5;
  margin-top: 6px;
}

.tl-modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 12px 16px;
  border-top: 1px solid var(--tl-line-soft);
  background: #f8fafc;
}

.tl-btn-modal-cancel {
  background: #fff;
  border: 1px solid #d1d5db;
  border-radius: 3px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 600;
  color: #4b5563;
  cursor: pointer;
}
.tl-btn-modal-save {
  background: var(--tl-primary);
  border: 1px solid var(--tl-primary-2);
  border-radius: 3px;
  padding: 6px 16px;
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
}
.tl-btn-modal-save:hover {
  background: var(--tl-primary-2);
}

.tl-search-input-wrap {
  position: relative;
  margin-bottom: 12px;
}
.tl-search-input-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: #94a3b8;
  font-size: 14px;
}
.tl-search-input {
  width: 100%;
  box-sizing: border-box;
  padding: 9px 12px 9px 36px;
  border: 1px solid var(--tl-line);
  border-radius: 3px;
  font-size: 14px;
  outline: none;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
}
.tl-search-input:focus {
  border-color: var(--tl-blue);
  box-shadow: 0 0 0 2px rgba(60,141,188,0.15);
}

.tl-search-results-container {
  max-height: 380px;
  overflow-y: auto;
  border: 1px solid #e2e8f0;
  border-radius: 3px;
}
.tl-search-initial-hint, .tl-search-no-results {
  padding: 24px;
  text-align: center;
  color: #94a3b8;
  font-size: 13.5px;
}

.tl-search-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 1px solid #f1f5f9;
  transition: background-color 0.1s ease;
}
.tl-search-item:last-child {
  border-bottom: 0;
}
.tl-search-item:hover {
  background-color: #f8fafc;
}
.tl-search-item-left {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.tl-search-item-title {
  font-size: 13.5px;
  color: #1e293b;
}
.tl-search-item-slug {
  font-size: 12px;
  color: #64748b;
  font-family: var(--tl-mono);
  margin-left: 4px;
}
.tl-search-item-desc {
  font-size: 12px;
  color: #64748b;
}
.tl-search-item-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  margin-left: 12px;
}

.tl-btn-select-test, .tl-btn-select-sublist {
  background: var(--tl-blue);
  color: #fff;
  border: 0;
  border-radius: 3px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.tl-btn-select-test:hover, .tl-btn-select-sublist:hover {
  background: #2b78a9;
}

.tl-sublist-parents-box {
  margin-top: 16px;
  padding: 12px;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-radius: 3px;
}
.tl-no-parents-hint {
  color: #64748b;
  font-size: 13px;
}

/* ---- Changelist ---- */
.tl-index-header { display:flex; align-items:flex-end; justify-content:space-between; gap:12px 16px; flex-wrap:wrap; margin:0 0 12px; }
.tl-index-title { font-size:22px; font-weight:400; margin:0; }
.tl-index-title small { font-size:14px; color:var(--body-quiet-color,#999); margin-left:8px; }
.tl-object-tools { margin:0; padding:0; display:flex; gap:6px; list-style:none; }
.tl-object-tools li { list-style:none; margin:0; float:none; }
.tl-btn { display:inline-flex; align-items:center; gap:6px; font-size:13px; line-height:1.4; padding:6px 12px; border:1px solid #ddd; border-radius:3px; box-shadow:2px 2px 2px #ddd; text-decoration:none; white-space:nowrap; }
.tl-btn-default { background:#f4f4f4; border-color:#ddd; color:#444; }
.tl-btn-default:hover { background:#e7e7e7; color:#444; }
.tl-btn-primary { background:var(--tl-primary); border-color:var(--tl-primary-2); color:#fff; }
.tl-btn-primary:hover { background:var(--tl-primary-2); color:#fff; }
#changelist.filtered { display:grid; grid-template-columns:1fr 248px; column-gap:16px; row-gap:0; align-items:start; background:transparent; box-shadow:none; border:0; padding:0; margin:0; width:auto; }
#changelist:not(.filtered) { background:#fff; border-top:3px solid var(--tl-primary); box-shadow:var(--tl-card-shadow); }
.tl-results-head { grid-column:1; grid-row:1; display:flex; align-items:center; gap:8px; padding:10px 12px; background:#fff; border-top:3px solid var(--tl-primary); border-bottom:1px solid var(--tl-line-soft); box-shadow:var(--tl-card-shadow); }
.tl-results-head > .fa { font-size:16px; color:#555; }
.tl-results-title { font-size:17px; font-weight:600; color:#444 !important; background:transparent !important; margin:0; padding:0; }
.tl-results-search { margin-left:auto; }
#changelist-form { grid-column:1; grid-row:2; background:#fff; box-shadow:var(--tl-card-shadow); }
.tl-results-search #toolbar { padding:0; margin:0; border:0; background:transparent; }
.tl-results-search #changelist-search > div { display:flex; align-items:center; border:1px solid var(--tl-line); padding:4px 9px; background:#fff; box-shadow:2px 2px 2px #eee; border-radius:2px; }
.tl-results-search #changelist-search > div::before { font-family:FontAwesome; content:"\f002"; color:#9aa2ae; margin-right:6px; font-size:13px; }
.tl-results-search label { display:none; }
.tl-results-search #searchbar { border:0; outline:none; font-size:13px; min-width:210px; padding:0; margin:0; background:transparent; }
.tl-results-search input[type="submit"] { border:0; background:var(--tl-primary); color:#fff; font-size:12px; padding:4px 11px; border-radius:2px; margin-left:8px; cursor:pointer; }
.tl-results-search #changelist-search .quiet, .tl-results-search #changelist-search .help { display:none; }
#result_list { width:100%; border-collapse:collapse; background:#fff; }
#result_list thead th { text-align:left; padding:8px 10px; border-bottom:2px solid var(--tl-line); font-size:13px; font-weight:600; color:#444; background:#fff; white-space:nowrap; }
#result_list thead th a, #result_list thead th.sortable a { color:#444; }
#result_list tbody td, #result_list tbody th { padding:8px 10px; border-top:1px solid var(--tl-line-soft); border-bottom:0; vertical-align:middle; font-size:13px; color:var(--tl-text); background:transparent; }
#result_list tbody tr { background:#fff; }
#result_list tbody tr:hover { background:#f5f7fa; cursor:pointer; }
#result_list .column-col_id, #result_list .field-col_id { width:60px; }
#result_list .column-col_tests, #result_list .field-col_tests { width:82px; }
#result_list .column-col_frequency, #result_list .field-col_frequency { width:120px; }
#result_list .column-col_units, #result_list .field-col_units { width:72px; }
#result_list .column-col_modified, #result_list .field-col_modified { width:150px; }
#result_list .column-col_edit, #result_list .field-col_edit { width:40px; text-align:center; }
.tl-cell-id { color:var(--tl-muted); }
.tl-cell-name { display:flex; flex-direction:column; gap:1px; text-decoration:none; }
.tl-cell-name .tl-name { font-weight:600; color:var(--tl-text); }
.tl-cell-name .tl-slug { font-size:12px; color:var(--tl-muted); }
.tl-cell-name:hover .tl-name { color:var(--tl-blue); }
.tl-count-badge { display:inline-block; background:var(--tl-gray); color:#444; font-size:75%; font-weight:600; border-radius:2px; padding:.22em .6em; }
.tl-freq-tag { display:inline-block; font-size:11px; font-weight:600; color:#5a6472; background:#eef1f5; border:1px solid #e0e5ec; border-radius:3px; padding:2px 8px; margin:0 3px 3px 0; }
.tl-cell-units { color:var(--tl-muted); white-space:nowrap; } .tl-cell-units .fa { margin-right:3px; }
.tl-cell-modified { display:flex; flex-direction:column; font-size:13px; line-height:1.35; }
.tl-cell-modified .tl-mod-by { color:var(--tl-muted); font-size:12px; }
.tl-editlink { color:#9aa2ae; text-decoration:none; } .tl-editlink:hover { color:var(--tl-blue); }
#changelist-form .actions { padding:8px 12px; background:#fbfcfd; border-bottom:1px solid var(--tl-line-soft); margin:0; }
.paginator { padding:10px 12px; font-size:13px; color:var(--tl-muted); border-top:1px solid var(--tl-line-soft); background:#fff; }
.paginator a:link, .paginator a:visited { color:var(--tl-blue); background:transparent; }
.paginator .this-page { font-weight:700; color:#444; }
#changelist-filter { grid-column:2; grid-row:1; align-self:start; position:sticky; top:16px; width:auto; margin:0; padding:0 0 8px; background:#fff; border-top:3px solid var(--tl-primary); box-shadow:var(--tl-card-shadow); }
#changelist-filter h2 { display:flex; align-items:center; gap:8px; font-size:17px; font-weight:600; color:#444; margin:0; padding:10px 12px; border-bottom:1px solid var(--tl-line-soft); background:#fff; text-transform:none; }
#changelist-filter h2::before { font-family:FontAwesome; content:"\f0b0"; font-size:14px; color:#555; }
#changelist-filter #changelist-filter-clear { margin:0; padding:8px 12px 0; background:transparent; border:0; }
#changelist-filter #changelist-filter-clear a { color:var(--tl-blue); font-size:12px; font-weight:600; text-decoration:none; }
#changelist-filter > h3 { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--tl-group-label); margin:0; padding:14px 12px 6px; }
#changelist-filter ul { list-style:none; margin:0; padding:0 8px; display:flex; flex-direction:column; gap:2px; }
#changelist-filter ul li { margin:0; padding:0; }
#changelist-filter ul li a { display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:4px; font-size:13px; color:#4b5563; text-decoration:none; }
#changelist-filter ul li a:hover { background:#f2f5f8; color:#1f2937; }
#changelist-filter ul li.selected a { font-weight:600; color:#1f2937; }
#changelist-filter ul li a::before { content:''; flex:none; box-sizing:border-box; width:15px; height:15px; border:1.5px solid #c3c9d4; border-radius:50%; background:#fff; }
#changelist-filter ul li.selected a::before { border-color:var(--tl-blue); background:var(--tl-blue); box-shadow:inset 0 0 0 2.5px #fff; }
</style>

<script>
(function () {
  "use strict";

  var activeSwapCard = null;

  // Change form: toggle the live (htmx-driven) description preview pane.
  function initPreviewToggle() {
    var btn = document.querySelector("[data-desc-toggle]");
    var pane = document.getElementById("tl-desc-preview");
    var ta = document.getElementById("id_description");
    if (!btn || !pane || !ta) { return; }
    function fire() { ta.dispatchEvent(new Event("previewrequested")); }
    btn.addEventListener("click", function (e) {
      e.preventDefault();
      var enable = pane.hidden;
      pane.hidden = !enable;
      btn.classList.toggle("on", enable);
      btn.setAttribute("aria-pressed", enable ? "true" : "false");
      btn.innerHTML = enable
        ? '<i class="fa fa-eye-slash"></i> Hide preview'
        : '<i class="fa fa-eye"></i> Preview';
      if (enable) { ta.addEventListener("input", fire); fire(); }
      else { ta.removeEventListener("input", fire); }
    });
  }

  // Changelist: whole-row click navigates; keep inner links/inputs working.
  function initRowClick() {
    var table = document.getElementById("result_list");
    if (!table) { return; }
    var search = document.getElementById("searchbar");
    if (search && !search.getAttribute("placeholder")) {
      search.setAttribute("placeholder", "Search name, slug or tags…");
    }
    table.querySelectorAll("tbody tr").forEach(function (tr) {
      tr.addEventListener("click", function (e) {
        if (e.target.closest("a") || e.target.closest("input") ||
            e.target.closest("label") || window.getSelection().toString()) { return; }
        var link = tr.querySelector("a.tl-editlink") || tr.querySelector("a.tl-cell-name");
        if (link) { window.location = link.href; }
      });
    });
  }

  function updateCounts() {
    var rows = document.querySelectorAll("#tl-tests-tbody tr.tl-test-row");
    var visibleCount = 0;
    rows.forEach(function (r) {
      var del = r.querySelector("input[name$='-DELETE']");
      var isDel = del && (del.checked || del.value === "true");
      var isHidden = r.style.display === "none";
      if (!isDel && !isHidden) {
        visibleCount++;
      }
    });
    var badge = document.getElementById("tl-tests-count");
    if (badge) { badge.textContent = visibleCount; }
    var emptyMsg = document.getElementById("tl-empty-tests-msg");
    if (emptyMsg) {
      emptyMsg.style.display = visibleCount === 0 ? "block" : "none";
    }
  }

  function syncOrder() {
    var order = 0;
    // Direct tests
    var rows = document.querySelectorAll("#tl-tests-tbody tr.tl-test-row");
    rows.forEach(function (r) {
      var del = r.querySelector("input[name$='-DELETE']");
      var isDel = del && (del.checked || del.value === "true");
      var isHidden = r.style.display === "none";
      var orderInput = r.querySelector(".tl-order-input");
      if (orderInput) {
        if (!isDel && !isHidden) {
          orderInput.value = order;
          order++;
        } else {
          orderInput.value = "";
        }
      }
    });

    // Sublists
    var cards = document.querySelectorAll("#tl-sublists-container .tl-sublist-card");
    cards.forEach(function (c) {
      var del = c.querySelector("input[name$='-DELETE']");
      var isDel = del && (del.checked || del.value === "true");
      var isHidden = c.style.display === "none";
      var orderInput = c.querySelector(".tl-sublist-order-input");
      if (orderInput) {
        if (!isDel && !isHidden) {
          orderInput.value = order;
          order++;
        } else {
          orderInput.value = "";
        }
      }
    });

    updateCounts();
  }

  function openSearchModal(mode, swapCard) {
    activeSwapCard = swapCard || null;
    var modal = document.getElementById("tl-search-modal");
    if (!modal) { return; }

    var title = document.getElementById("tl-search-title-text");
    var input = document.getElementById("tl-search-input");
    var resultsBox = document.getElementById("tl-search-results-box");

    var testsCard = document.getElementById("tl-tests-card");
    var originalId = testsCard ? (testsCard.getAttribute("data-original-id") || "") : "";

    var url = "";
    if (mode === "test") {
      if (title) { title.textContent = "Select Test to Add"; }
      if (input) {
        input.placeholder = "Search by test name, macro slug or category…";
        url = "/admin/qa/testlist/search-tests/";
        input.setAttribute("hx-get", url);
        input.value = "";
      }
    } else {
      if (title) { title.textContent = activeSwapCard ? "Change Sublist" : "Select Sublist to Add"; }
      if (input) {
        input.placeholder = "Search available test lists…";
        url = "/admin/qa/testlist/search-sublists/" + (originalId ? "?current_id=" + encodeURIComponent(originalId) : "");
        input.setAttribute("hx-get", url);
        input.value = "";
      }
    }

    modal.hidden = false;
    if (resultsBox) {
      resultsBox.innerHTML = '<div class="tl-search-initial-hint"><i class="fa fa-spinner fa-spin"></i> Loading…</div>';
      fetch(url)
        .then(function (res) { return res.text(); })
        .then(function (html) {
          resultsBox.innerHTML = html;
          if (window.htmx) { htmx.process(resultsBox); }
        })
        .catch(function () {
          resultsBox.innerHTML = '<div class="tl-search-no-results">Error loading items.</div>';
        });
    }

    if (input) {
      if (window.htmx) { htmx.process(input); }
      setTimeout(function () { input.focus(); }, 60);
    }
  }

  function addTestRow(testId) {
    var totalFormsInput = document.getElementById("id_testlistmembership_set-TOTAL_FORMS");
    var currentIndex = totalFormsInput ? (parseInt(totalFormsInput.value, 10) || 0) : 0;
    var testsCard = document.getElementById("tl-tests-card");
    var originalId = testsCard ? (testsCard.getAttribute("data-original-id") || "") : "";

    var url = "/admin/qa/testlist/add-test-row/?test_id=" + encodeURIComponent(testId) +
              "&index=" + currentIndex +
              "&test_list_id=" + encodeURIComponent(originalId);

    fetch(url)
      .then(function (res) { return res.text(); })
      .then(function (html) {
        var tbody = document.getElementById("tl-tests-tbody");
        if (!tbody) { return; }
        var temp = document.createElement("tbody");
        temp.innerHTML = html.trim();
        var newRow = temp.firstElementChild;
        if (newRow) {
          tbody.appendChild(newRow);
          if (totalFormsInput) { totalFormsInput.value = currentIndex + 1; }
          if (window.htmx) { htmx.process(newRow); }
          syncOrder();
          initSortables();
        }
      });
  }

  function addSublistCard(childId) {
    if (activeSwapCard) {
      var card = activeSwapCard;
      var index = card.getAttribute("data-index") || "0";
      var testsCard = document.getElementById("tl-tests-card");
      var originalId = testsCard ? (testsCard.getAttribute("data-original-id") || "") : "";
      var url = "/admin/qa/testlist/add-sublist-card/?child_id=" + encodeURIComponent(childId) +
                "&index=" + index +
                "&parent_id=" + encodeURIComponent(originalId);
      fetch(url)
        .then(function (res) { return res.text(); })
        .then(function (html) {
          var temp = document.createElement("div");
          temp.innerHTML = html.trim();
          var newCard = temp.firstElementChild;
          if (newCard && card.parentNode) {
            card.parentNode.replaceChild(newCard, card);
            if (window.htmx) { htmx.process(newCard); }
            activeSwapCard = null;
            syncOrder();
            initSortables();
          }
        });
      return;
    }

    var totalFormsInput = document.getElementById("id_children-TOTAL_FORMS");
    var currentIndex = totalFormsInput ? (parseInt(totalFormsInput.value, 10) || 0) : 0;
    var testsCard = document.getElementById("tl-tests-card");
    var originalId = testsCard ? (testsCard.getAttribute("data-original-id") || "") : "";

    var url = "/admin/qa/testlist/add-sublist-card/?child_id=" + encodeURIComponent(childId) +
              "&index=" + currentIndex +
              "&parent_id=" + encodeURIComponent(originalId);

    fetch(url)
      .then(function (res) { return res.text(); })
      .then(function (html) {
        var container = document.getElementById("tl-sublists-container");
        if (!container) { return; }
        var temp = document.createElement("div");
        temp.innerHTML = html.trim();
        var newCard = temp.firstElementChild;
        if (newCard) {
          container.appendChild(newCard);
          if (totalFormsInput) { totalFormsInput.value = currentIndex + 1; }
          if (window.htmx) { htmx.process(newCard); }
          syncOrder();
          initSortables();
        }
      });
  }

  // Drag-and-drop sortable support (HTML5 native + jQuery UI if available)
  function initSortables() {
    var $ = window.django && window.django.jQuery ? window.django.jQuery : (window.jQuery || window.$);
    if ($ && $.fn && $.fn.sortable) {
      try {
        $("#tl-tests-tbody").sortable({
          handle: ".tl-drag-handle",
          items: "tr.tl-test-row",
          axis: "y",
          helper: function (e, tr) {
            var $originals = tr.children();
            var $helper = tr.clone();
            $helper.children().each(function (index) {
              $(this).width($originals.eq(index).width());
            });
            return $helper;
          },
          update: function () {
            syncOrder();
          }
        });

        $("#tl-sublists-container").sortable({
          handle: ".tl-sublist-header",
          items: ".tl-sublist-card",
          axis: "y",
          update: function () {
            syncOrder();
          }
        });
      } catch (err) {}
    }

    // HTML5 drag-and-drop fallback
    var tbody = document.getElementById("tl-tests-tbody");
    if (tbody) {
      tbody.querySelectorAll("tr.tl-test-row").forEach(function (row) {
        var handle = row.querySelector(".tl-drag-handle");
        if (handle && !row.hasAttribute("data-dnd-init")) {
          row.setAttribute("data-dnd-init", "true");
          handle.setAttribute("draggable", "true");
          handle.addEventListener("dragstart", function (e) {
            e.dataTransfer.setData("text/plain", "");
            row.classList.add("tl-dragging");
            window._tlDraggedRow = row;
          });
          handle.addEventListener("dragend", function () {
            row.classList.remove("tl-dragging");
            window._tlDraggedRow = null;
            syncOrder();
          });
          row.addEventListener("dragover", function (e) {
            e.preventDefault();
            var dragged = window._tlDraggedRow;
            if (dragged && dragged !== row && row.parentNode === tbody) {
              var rect = row.getBoundingClientRect();
              var mid = rect.top + rect.height / 2;
              if (e.clientY < mid) {
                tbody.insertBefore(dragged, row);
              } else {
                tbody.insertBefore(dragged, row.nextSibling);
              }
            }
          });
        }
      });
    }
  }

  // Global event delegation for all builder clicks
  document.addEventListener("click", function (e) {
    // Add Test buttons
    if (e.target.closest("#tl-header-add-test-btn, #tl-add-test-btn")) {
      e.preventDefault();
      openSearchModal("test");
      return;
    }

    // Add Sublist button
    if (e.target.closest("#tl-add-sublist-btn")) {
      e.preventDefault();
      openSearchModal("sublist");
      return;
    }

    // Change Sublist button
    var changeBtn = e.target.closest(".tl-btn-change-sublist");
    if (changeBtn) {
      e.preventDefault();
      var card = changeBtn.closest(".tl-sublist-card");
      openSearchModal("sublist", card);
      return;
    }

    // Select Test from search modal
    var testItem = e.target.closest(".tl-search-test-item, .tl-btn-select-test");
    if (testItem) {
      e.preventDefault();
      var row = testItem.closest(".tl-search-test-item");
      var testId = testItem.getAttribute("data-test-id") || (row && row.getAttribute("data-test-id"));
      if (testId) {
        addTestRow(testId);
        var modal = document.getElementById("tl-search-modal");
        if (modal) { modal.hidden = true; }
      }
      return;
    }

    // Select Sublist from search modal
    var sublistItem = e.target.closest(".tl-search-sublist-item, .tl-btn-select-sublist");
    if (sublistItem) {
      e.preventDefault();
      var sRow = sublistItem.closest(".tl-search-sublist-item");
      var childId = sublistItem.getAttribute("data-child-id") || (sRow && sRow.getAttribute("data-child-id"));
      if (childId) {
        addSublistCard(childId);
        var sModal = document.getElementById("tl-search-modal");
        if (sModal) { sModal.hidden = true; }
      }
      return;
    }

    // Remove Test button
    var delTestBtn = e.target.closest(".tl-delete-test-btn");
    if (delTestBtn) {
      e.preventDefault();
      var tRow = delTestBtn.closest("tr.tl-test-row");
      if (tRow) {
        var delInput = tRow.querySelector("input[name$='-DELETE']");
        if (delInput) { delInput.checked = true; }
        tRow.style.transition = "opacity 0.2s ease, transform 0.2s ease";
        tRow.style.opacity = "0";
        setTimeout(function () {
          tRow.style.display = "none";
          syncOrder();
        }, 180);
      }
      return;
    }

    // Remove Sublist button
    var delSubBtn = e.target.closest(".tl-btn-remove-sublist");
    if (delSubBtn) {
      e.preventDefault();
      var sCard = delSubBtn.closest(".tl-sublist-card");
      if (sCard) {
        var sDelInput = sCard.querySelector("input[name$='-DELETE']");
        if (sDelInput) { sDelInput.checked = true; }
        sCard.style.transition = "opacity 0.2s ease, transform 0.2s ease";
        sCard.style.opacity = "0";
        setTimeout(function () {
          sCard.style.display = "none";
          syncOrder();
        }, 180);
      }
      return;
    }

    // Duplicate / Clone Test button
    var cloneBtn = e.target.closest(".tl-clone-test-btn");
    if (cloneBtn) {
      e.preventDefault();
      var cRow = cloneBtn.closest("tr.tl-test-row");
      var cTestId = cloneBtn.getAttribute("data-test-id") || (cRow && cRow.getAttribute("data-test-id"));
      if (!cTestId && cRow) {
        var tInput = cRow.querySelector("input[name$='-test']");
        if (tInput) { cTestId = tInput.value; }
      }
      if (cTestId) {
        addTestRow(cTestId);
      }
      return;
    }

    // Modal close buttons
    if (e.target.matches("[data-search-close]") || e.target.closest("[data-search-close]")) {
      var sModalClose = document.getElementById("tl-search-modal");
      if (sModalClose) { sModalClose.hidden = true; }
    }
    if (e.target.matches("[data-modal-close]") || e.target.closest("[data-modal-close]")) {
      var dModalClose = document.getElementById("tl-desc-modal-backdrop") || e.target.closest(".tl-modal-backdrop");
      if (dModalClose) { dModalClose.remove(); }
    }
    if (e.target.classList && e.target.classList.contains("tl-modal-backdrop")) {
      e.target.hidden = true;
      if (e.target.id === "tl-desc-modal-backdrop") { e.target.remove(); }
    }
  });

  // Re-sync on form submission
  document.addEventListener("submit", function (e) {
    if (e.target.matches("form")) {
      syncOrder();
    }
  });

  // Close modals on Esc
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      var sModalEsc = document.getElementById("tl-search-modal");
      if (sModalEsc && !sModalEsc.hidden) { sModalEsc.hidden = true; }
      var dModalEsc = document.getElementById("tl-desc-modal-backdrop");
      if (dModalEsc) { dModalEsc.remove(); }
    }
  });

  // HTMX afterSwap re-init
  document.addEventListener("htmx:afterSwap", function () {
    initSortables();
    updateCounts();
  });
  document.addEventListener("htmx:load", function () {
    initSortables();
    updateCounts();
  });

  document.addEventListener("DOMContentLoaded", function () {
    initPreviewToggle();
    initRowClick();
    initSortables();
    updateCounts();
    syncOrder();
  });

  if (document.readyState === "complete" || document.readyState === "interactive") {
    setTimeout(function () {
      initPreviewToggle();
      initRowClick();
      initSortables();
      updateCounts();
      syncOrder();
    }, 20);
  }
})();
</script>
