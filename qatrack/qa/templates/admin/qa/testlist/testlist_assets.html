{% comment %}
Test List Builder — inlined CSS + glue JS for the admin change form & changelist.

Inlined (not a static file) so it loads under DEBUG=False without a collectstatic
step. The live description preview and test list builder are driven by htmx.
{% endcomment %}{% load i18n %}
<style>
/* Colours, sizes and shapes follow the QATrack+ design spec and are written as
   literal values (no custom properties of our own). The only variables used here
   are Django admin's (re-asserted below for its dark theme) and --qa-admin-top-h,
   which base_site.html sets to the pinned admin header's height. */
/* Same meaning as base.css's .tl-mono (monospace); size comes from context here. */
.tl-mono { font-family: Menlo, Consolas, monospace; }

/* Keep this deliberately-light UI legible under Django 4.2's dark admin theme:
   re-assert light theme variables on our always-white components so inherited /
   variable-driven text stays dark-on-white. */
.tl-details-card, .tl-members-card, .tl-control-card, .tl-preview-card, #changelist {
  --body-fg: #333; --body-bg: #fff; --body-quiet-color: #767676; --body-loud-color: #111;
  --link-fg: #3c8dbc; --link-hover-color: #3c8dbc; --hairline-color: #f4f4f4;
  --border-color: #d2d6de; --darkened-bg: #f8f9fa; --selected-bg: #f5f7fa; --selected-row: #f5f7fa;
}

/* ---- Top Header Bar ---- */
.tl-header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin: 0 0 12px;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}
/* The title row stays pinned just below the admin header (base_site.html measures
   its height into --qa-admin-top-h); the scope bar below it scrolls away.
   Solid page-coloured background so rows don't show through; z-index below the
   admin header (1000) and the builder dialogs (9999). */
.tl-header-bar {
  position: sticky;
  top: var(--qa-admin-top-h, 90px);
  z-index: 900;
  padding: 10px 0;
  background: var(--body-bg);
  box-shadow: 0 1px 0 var(--hairline-color);
}
/* Keep anchor jumps / focused fields clear of the pinned title row too. */
html:has(.tl-header-bar) { scroll-padding-top: calc(var(--qa-admin-top-h, 90px) + 72px); }
/* At 1024px and below the admin header is taller and the buttons wrap, so the
   two pinned rows would cover over a quarter of the window: let this one scroll. */
@media (max-width: 1024px), (max-height: 700px) {
  .tl-header-bar { position: static; padding: 0; box-shadow: none; }
  html:has(.tl-header-bar) { scroll-padding-top: calc(var(--qa-admin-top-h, 90px) + 12px); }
}
.tl-header-left {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
/* Title and counts sit on the page background (not a white card), so they use
   Django's variables to stay readable in the dark admin theme too. */
.tl-header-title {
  font-size: 22px;
  font-weight: 400;
  color: var(--body-fg, #444);
  margin: 0;
  line-height: 1.1;
  letter-spacing: normal;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}
.tl-header-counts {
  font-size: 12px;
  font-weight: 400;
  color: var(--body-quiet-color, #666);
}
/* The page's one save button group (Django's bottom submit row is removed).
   Left to right: History, Delete, Cancel, Save As…, Save and Continue Editing, Save. */
.tl-header-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
/* a.tl-top-btn / button.tl-top-btn outrank the admin's link and button colours */
a.tl-top-btn,
button.tl-top-btn,
.tl-top-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 400;
  line-height: 1.4;
  padding: 4px 12px;
  margin: 0;
  border-radius: 3px;
  cursor: pointer;
  text-decoration: none;
  text-transform: none;
  letter-spacing: normal;
  white-space: nowrap;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  height: 30px;
  box-sizing: border-box;
  box-shadow: 2px 2px 2px #ddd;
  transition: background-color 0.15s ease;
}
a.tl-top-btn:focus-visible,
button.tl-top-btn:focus-visible {
  outline: 2px solid #3c8dbc;
  outline-offset: 1px;
}
a.tl-top-btn-secondary,
button.tl-top-btn-secondary {
  background: #f4f4f4;
  border: 1px solid #d2d6de;
  color: #444;
}
a.tl-top-btn-secondary:hover,
a.tl-top-btn-secondary:focus,
button.tl-top-btn-secondary:hover {
  background: #e7e7e7;
  border-color: #d2d6de;
  color: #444;
  text-decoration: none;
}
/* Delete: ghost style, so it doesn't compete with Save */
a.tl-top-btn-delete {
  background: #fff;
  border: 1px solid #e8c4be;
  color: #c0392b;
}
a.tl-top-btn-delete:hover,
a.tl-top-btn-delete:focus {
  background: #fbe9e7;
  border-color: #e8c4be;
  color: #c0392b;
  text-decoration: none;
}
button.tl-top-btn-save {
  background: #424f57;
  border: 1px solid #424f57;
  color: #fff;
  font-weight: 600;
}
button.tl-top-btn-save:hover {
  background: #323e46;
  border-color: #323e46;
  color: #fff;
}

/* ---- Top Control Card / Toolbar ---- */
.tl-control-card {
  background: #fff;
  border: 1px solid #d2d6de;
  border-radius: 0;
  padding: 8px 12px;
  margin-bottom: 18px;
  box-shadow: 0 1px 1px rgba(0,0,0,.1);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}
/* The left group takes the free space and wraps inside itself (scope text, Assign
   button, success note), so the Editor/Preview toggle stays on the first line. */
.tl-control-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  flex: 1 1 0;
  min-width: 0;
}
.tl-control-label {
  font-size: 11px;
  font-weight: 700;
  color: #6e7785;
  letter-spacing: .03em;
  text-transform: uppercase;
  margin-right: 2px;
}
.tl-scope-select-wrap {
  position: relative;
}
.tl-scope-select {
  background: #fff;
  border: 1px solid #d2d6de;
  border-radius: 3px;
  padding: 4px 28px 4px 10px;
  font-size: 13px;
  font-weight: 600;
  color: #333;
  cursor: pointer;
  appearance: auto;
  -webkit-appearance: auto;
  min-width: 210px;
  height: 30px;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  box-sizing: border-box;
}
.tl-scope-select:focus {
  border-color: #3c8dbc;
  outline: none;
}
.tl-scope-info {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: #6e7785;
  flex: 0 1 auto;
  min-width: 0;
}
.tl-scope-globe-icon {
  color: #6e7785;
  font-size: 13px;
  flex-shrink: 0;
}
/* Secondary button */
.tl-btn-assign-machine {
  background: #f4f4f4;
  border: 1px solid #d2d6de;
  border-radius: 3px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 600;
  color: #444;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  height: 28px;
  box-sizing: border-box;
  box-shadow: 2px 2px 2px #ddd;
  white-space: nowrap;
  transition: background-color 0.15s ease;
}
.tl-btn-assign-machine:hover {
  background: #e7e7e7;
  color: #444;
  text-decoration: none;
}
.tl-btn-assign-machine:focus-visible {
  border-color: #3c8dbc;
  outline: 2px solid #3c8dbc;
  outline-offset: 1px;
}

/* ---- Assign to Machine dialog ---- */
button.tl-btn-assign-machine {
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}
.tl-btn-assign-machine:disabled,
.tl-btn-assign-machine:disabled:hover {
  opacity: 0.55;
  cursor: not-allowed;
  border-color: #d2d6de;
  color: #444;
  background: #f4f4f4;
}
.tl-assign-note {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: 0 1 auto;
  min-width: 0;
  font-size: 12px;
  color: #333;
  background: #fff;
  border: 1px solid #d2d6de;
  border-left: 3px solid #00a65a;
  border-radius: 2px;
  padding: 2px 4px 2px 8px;
  transition: opacity 0.4s ease;
}
.tl-assign-note[hidden] {
  display: none;
}
.tl-assign-note .fa {
  color: #00a65a;
}
.tl-assign-note.tl-assign-note-error {
  border-left-color: #dd4b39;
}
.tl-assign-note.tl-assign-note-error .fa {
  color: #c0392b;
}
.tl-assign-note.tl-assign-note-fading {
  opacity: 0;
}
.tl-assign-note-close {
  background: transparent;
  border: 0;
  padding: 0 4px;
  font-size: 16px;
  line-height: 1;
  color: #6e7785;
  cursor: pointer;
}
.tl-assign-note-close:hover {
  color: #333;
}
.tl-assign-dialog {
  max-width: 480px;
}
.tl-assign-dialog form {
  display: flex;
  flex-direction: column;
  min-height: 0;
  margin: 0;
}
.tl-assign-dialog select.tl-modal-input {
  height: auto;
  min-height: 32px;
  background: #fff;
  color: #333;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}
.tl-assign-dialog select.tl-modal-input:focus {
  border-color: #3c8dbc;
  outline: none;
}
.tl-assign-check label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.tl-assign-error {
  font-size: 12px;
  color: #c0392b;
}
.tl-assign-alert {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 0 0 12px;
  padding: 8px 10px;
  font-size: 13px;
  color: #333;
  background: #fbe9e7;
  border: 1px solid #e8c4be;
  border-left: 3px solid #dd4b39;
}
.tl-assign-alert[hidden] {
  display: none;
}
.tl-assign-alert .fa {
  color: #c0392b;
  margin-top: 2px;
}
.tl-assign-dialog .tl-btn-modal-save:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.tl-control-right {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  margin-left: auto;
  align-self: flex-start;
}
.tl-view-toggle {
  display: inline-flex;
  border: 1px solid #d2d6de;
  border-radius: 3px;
  box-shadow: 2px 2px 2px #ddd;
  overflow: hidden;
  background: #fff;
  height: 30px;
  box-sizing: border-box;
}
.tl-view-tab {
  border: 0;
  background: #fff;
  color: #444;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 400;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  transition: background-color 0.15s ease;
}
.tl-view-tab:hover:not(.active) {
  background: #f4f4f4;
  color: #333;
}
.tl-view-tab.active {
  background: #424f57;
  color: #fff;
  font-weight: 600;
}
.tl-view-tab:focus-visible {
  outline: 2px solid #3c8dbc;
  outline-offset: -2px;
}
.tl-view-tab:last-child {
  border-left: 1px solid #d2d6de;
}

/* Editing scope: the base list, or one machine's references & tolerances.
   initScopeSelect() puts .tl-mode-machine on <body> while a machine is shown. */
.tl-scope-info,
.tl-scope-globe-icon {
  color: #6e7785;
}
.tl-scope-info-text a {
  color: #3c8dbc;
}
.tl-scope-sep {
  color: #6e7785;
}
.tl-scope-status {
  font-weight: 600;
  color: #555;
}
.tl-machine-banner,
.tl-machine-error {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: -10px 0 18px;
  padding: 8px 12px;
  background: #fff;
  border: 1px solid #d2d6de;
  border-left: 3px solid #424f57;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  font-size: 13px;
  color: #333;
}
.tl-machine-banner .fa {
  color: #424f57;
  margin-top: 2px;
}
.tl-machine-error {
  border-left-color: #c0392b;
}
.tl-machine-error .fa {
  color: #c0392b;
  margin-top: 2px;
}
.tl-machine-banner[hidden],
.tl-machine-error[hidden] {
  display: none;
}

/* Reference / Tolerance columns replace Type Value in machine mode */
.tl-col-ref,
.tl-col-tol {
  display: none;
}
body.tl-mode-machine .tl-col-ref,
body.tl-mode-machine .tl-col-tol {
  display: table-cell;
}
body.tl-mode-machine .tl-col-type-value {
  display: none;
}
.tl-th-ref { width: 150px; }
.tl-th-tol { width: 260px; }
.tl-machine-value {
  font-size: 13px;
  color: #333;
  overflow-wrap: anywhere;
}
.tl-machine-none {
  font-size: 13px;
  color: #555;
}
.tl-machine-edit {
  margin-left: 6px;
  padding: 2px 4px;
  color: #3c8dbc;
  font-size: 13px;
  text-decoration: none;
}
.tl-machine-edit:hover,
.tl-machine-edit:focus {
  color: #323e46;
  text-decoration: none;
}

/* ---- Machine Reference and Tolerance dialog ---- */
/* "Not set" where it matters: results on this unit will show No Tol Set */
.tl-machine-missing {
  font-size: 13px;
  color: #555;
  white-space: nowrap;
}
.tl-machine-missing .fa {
  color: #8a6420;
  margin-right: 3px;
}
.tl-machine-unused,
.tl-machine-hint {
  font-size: 12px;
  color: #6e7785;
}
.tl-machine-hint {
  display: block;
  margin-top: 2px;
}
button.tl-machine-edit {
  background: transparent;
  border: 0;
  border-radius: 3px;
  cursor: pointer;
  font-family: inherit;
  line-height: 1;
}
button.tl-machine-edit:focus-visible {
  outline: 2px solid #3c8dbc;
  outline-offset: 1px;
}
.tl-reftol-dialog {
  max-width: 480px;
}
.tl-reftol-dialog form {
  display: flex;
  flex-direction: column;
  min-height: 0;
  margin: 0;
}
.tl-reftol-heading {
  min-width: 0;
}
.tl-reftol-subtitle {
  margin: 2px 0 0;
  font-size: 13px;
  color: #6e7785;
  overflow-wrap: anywhere;
}
.tl-reftol-current {
  margin: 0 0 12px;
  padding: 8px 10px;
  border: 1px solid #d2d6de;
  border-left: 3px solid #424f57;
  font-size: 13px;
  color: #333;
  overflow-wrap: anywhere;
}
.tl-reftol-meta {
  margin-top: 2px;
  font-size: 12px;
  color: #6e7785;
}
.tl-reftol-dialog select.tl-modal-input {
  height: auto;
  min-height: 32px;
  background: #fff;
  color: #333;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}
.tl-reftol-dialog select.tl-modal-input:focus {
  border-color: #3c8dbc;
  outline: none;
}
.tl-reftol-dialog .tl-modal-textarea {
  margin-top: 0;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}
.tl-reftol-dialog .tl-modal-hint a,
.tl-reftol-history-link a {
  color: #3c8dbc;
}
.tl-reftol-history-link {
  margin: 0;
  font-size: 12px;
}
.tl-reftol-dialog .tl-btn-modal-save:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.tl-reftol-tol-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.tl-reftol-tol-row select {
  flex: 1;
  min-width: 0;
}
/* secondary action inside a dialog: "New Tolerance…", "Use This One" */
.tl-btn-newtol {
  flex: 0 0 auto;
  background: #f4f4f4;
  border: 1px solid #d2d6de;
  border-radius: 3px;
  padding: 5px 10px;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: #444;
  box-shadow: 2px 2px 2px #ddd;
  cursor: pointer;
  white-space: nowrap;
}
.tl-btn-newtol:hover {
  background: #e7e7e7;
}
.tl-btn-newtol:focus-visible {
  border-color: #3c8dbc;
  outline: 2px solid #3c8dbc;
  outline-offset: 1px;
}
.tl-newtol-use {
  margin-top: 6px;
  display: block;
}
.tl-assign-alert .tl-newtol-use .fa {
  color: #444;
  margin-top: 0;
}
/* New Tolerance sits on top of the Reference and Tolerance dialog */
.tl-modal-backdrop.tl-newtol-backdrop {
  z-index: 10000;
  background: rgba(0,0,0,0.25);
}
.tl-newtol-limits {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 12px;
}
.tl-newtol-type-label {
  font-size: 13px;
  font-weight: 600;
  color: #555;
}
.tl-newtol-type-value {
  font-size: 14px;
  color: #333;
}
.tl-newtol-unit[hidden] {
  display: none;
}
.tl-reftol-note {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: -10px 0 18px;
  padding: 4px 6px 4px 12px;
  background: #fff;
  border: 1px solid #d2d6de;
  border-left: 3px solid #424f57;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  font-size: 13px;
  color: #333;
  transition: opacity 0.4s ease;
}
.tl-reftol-note[hidden] {
  display: none;
}
.tl-reftol-note .fa {
  color: #424f57;
}
.tl-reftol-note-text {
  flex: 1;
}
.tl-reftol-note.tl-reftol-note-error {
  border-left-color: #c0392b;
}
.tl-reftol-note.tl-reftol-note-error .fa {
  color: #c0392b;
}
.tl-reftol-note.tl-reftol-note-fading {
  opacity: 0;
}

/* Shared settings are locked in machine mode: only that machine's values are shown */
body.tl-mode-machine #tl-tests-card .tl-drag-handle,
body.tl-mode-machine #tl-header-add-test-btn,
body.tl-mode-machine #tl-header-add-sublist-btn,
body.tl-mode-machine #tl-tests-card .tl-cell-actions > *,
body.tl-mode-machine #tl-tests-card .tl-btn-change-sublist,
body.tl-mode-machine #tl-tests-card .tl-btn-remove-sublist,
body.tl-mode-machine #tl-tests-card .tl-sublist-outline,
body.tl-mode-machine #tl-tests-card .tl-add-desc-btn,
body.tl-mode-machine #tl-attachments-card .tl-browse-wrap,
body.tl-mode-machine #tl-attachments-card .btn-delete-existing,
body.tl-mode-machine #tl-attachments-card .btn-remove-pending {
  display: none !important;
}
body.tl-mode-machine #tl-tests-card .tl-test-desc {
  pointer-events: none;
}
body.tl-mode-machine #tl-details-card input[readonly],
body.tl-mode-machine #tl-details-card textarea[readonly] {
  background: #f4f4f4;
  color: #555;
  cursor: default;
}

/* ---- Live Preview Container ---- */
.tl-preview-container {
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  color: #333;
  margin-bottom: 24px;
}
/* Notes above the preview: which preview this is, unsaved changes */
.tl-preview-note {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 12px;
  padding: 8px 12px;
  background: #f4f4f4;
  border-left: 3px solid #424f57;
  font-size: 13px;
  color: #333;
}
.tl-preview-note .fa {
  color: #424f57;
  margin-top: 2px;
}
.tl-preview-note a {
  color: #3c8dbc;
}
/* The real Perform QC page (read-only), with its own scroll */
.tl-preview-frame {
  display: block;
  width: 100%;
  height: calc(100vh - 160px);
  min-height: 600px;
  border: 1px solid #d2d6de;
  background: #fff;
  box-shadow: 0 1px 1px rgba(0,0,0,.1);
}
.tl-preview-banner {
  background: #f4f4f4;
  border-left: 3px solid #424f57;
  border-radius: 0;
  padding: 8px 12px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #333;
  font-weight: 400;
}
.tl-preview-banner .fa {
  color: #424f57;
}
.tl-preview-card {
  background: #fff;
  border-top: 3px solid #424f57;
  box-shadow: 0 1px 1px rgba(0,0,0,.1);
  margin-bottom: 20px;
  padding: 16px 20px;
}
.tl-preview-title {
  font-size: 18px;
  font-weight: 400;
  line-height: 1.2;
  color: #444;
  margin: 0 0 6px;
}
.tl-preview-slug {
  font-size: 14px;
  font-weight: 400;
  color: #6e7785;
}
.tl-preview-desc {
  font-size: 14px;
  line-height: 1.5;
  color: #555;
  margin-bottom: 14px;
}
/* The test list's warning message (shown on the Perform QC page when a test fails) */
.tl-preview-warning {
  background: #fff;
  border: 1px solid #d2d6de;
  border-left: 3px solid #f39c12;
  padding: 8px 12px;
  font-size: 13px;
  color: #333;
  margin-bottom: 16px;
  border-radius: 0;
}
.tl-preview-warning .fa {
  color: #8a6420;
}
.tl-preview-js-note {
  margin-bottom: 14px;
  font-size: 12px;
  color: #555;
  background: #f4f4f4;
  border: 1px solid #d2d6de;
  padding: 6px 10px;
  border-radius: 0;
}
.tl-preview-table-wrap {
  margin-top: 16px;
}
.tlb-table.tl-preview-tests-table {
  border: 1px solid #d2d6de;
  margin-bottom: 16px;
}
.tlb-table.tl-preview-sublist-table {
  border: 1px solid #d2d6de;
  border-top: 0;
  margin-bottom: 16px;
}
.tlb-table .tl-th-input {
  width: 140px;
  text-align: right;
}
.tl-cell-input {
  text-align: right;
}
.tl-preview-sublist-header {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fbfcfd;
  border: 1px solid #d2d6de;
  border-bottom: 0;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 600;
  color: #444;
  margin-top: 16px;
}
.tl-preview-sublist-header .fa {
  color: #555;
}
/* Outlined sublist: mirrors the Perform QC page, which draws a 3px grey
   rule above and below the sublist with its name (italic) as the heading */
.tl-preview-sublist-outlined {
  border-top: 3px solid #ccc;
  border-bottom: 3px solid #ccc;
  margin-top: 16px;
  margin-bottom: 16px;
  padding: 6px 0 0;
}
.tl-preview-sublist-outlined .tl-preview-sublist-header {
  margin-top: 0;
  font-style: italic;
}
.tl-preview-sublist-outlined .tl-sublist-table {
  margin-bottom: 0 !important;
}
.tl-preview-sublist-desc {
  font-size: 13px;
  color: #333;
  padding: 6px 14px;
  border: 1px solid #d2d6de;
  border-bottom: 0;
}
.tl-preview-mock-input {
  background: #fff;
  border: 1px solid #d2d6de;
  border-radius: 0;
  padding: 4px 8px;
  font-size: 13px;
  color: #555;
  width: 100px;
  box-shadow: none;
}
.tl-preview-mock-input::placeholder {
  color: #6d7787;
  opacity: 1;
}

/* ---- Details card (change form) ---- */
.tl-details-card { background:#fff; border-top:3px solid #424f57; box-shadow:0 1px 1px rgba(0,0,0,.1); border-radius:0; margin-bottom:20px; font-family:'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif; color:#333; }
.tl-card-header { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid #f4f4f4; background:#fff; }
.tl-card-header > .fa { font-size:16px; color:#555; }
.tl-card-title { font-size:18px; font-weight:400; color:#444 !important; background:transparent !important; margin:0; line-height:1; padding:0; text-transform:none; letter-spacing:normal; }
.tl-card-body { padding:14px; }
/* tlb- (builder) prefix: base.css already defines shared tl- form, field and table blocks. */
.tlb-form { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; }
.tlb-field { display:flex; flex-direction:column; gap:4px; min-width:0; }
.tl-col-1 { grid-column:1; } .tl-col-2 { grid-column:2; } .tl-col-full { grid-column:1 / -1; }
.tlb-field > label, .tl-label-row > label { font-size:13px; font-weight:600; color:#555; margin:0; }
.tl-req { color:#c0392b; font-style:normal; }
.tl-label-row { display:flex; align-items:center; }
.tl-hint { font-size:11px; font-weight:600; margin-left:6px; display:inline-flex; align-items:center; gap:4px; }
.tl-hint-neutral { color:#6e7785; } .tl-hint-warn { color:#8a6420; }
.tl-preview-toggle { margin-left:auto; border:1px solid #d2d6de; background:#f4f4f4; color:#444; border-radius:3px; padding:3px 10px; font-size:11px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:5px; box-shadow:2px 2px 2px #ddd; }
.tl-preview-toggle:hover { background:#e7e7e7; color:#444; }
.tl-preview-toggle.on { background:#e7e7e7; color:#333; box-shadow:inset 0 1px 2px rgba(0,0,0,.1); }
.tl-preview-toggle:focus-visible { border-color:#3c8dbc; outline:2px solid #3c8dbc; outline-offset:1px; }
.tlb-field input[type="text"], .tlb-field textarea, .tlb-field select {
  width:100%; box-sizing:border-box; font-size:14px; color:#555; background:#fff;
  border:1px solid #d2d6de; border-radius:0; box-shadow:2px 2px 2px #ddd;
  padding:6px 10px; min-height:34px; margin:0;
}
.tlb-field textarea { resize:vertical; line-height:1.5; }
.tl-desc-input { min-height:52px; }
.tlb-field #id_javascript { font-family:Menlo, Consolas, monospace; font-size:13px; height:76px; }
.tlb-field #id_slug { font-family:Menlo, Consolas, monospace; font-size:13px; }
.tlb-field input[type="text"]:focus, .tlb-field textarea:focus { border-color:#3c8dbc; outline:none; }
.tl-html-preview { min-height:60px; border:1px solid #d2d6de; box-shadow:2px 2px 2px #ddd; padding:8px 10px; background:#fff; font-size:14px; line-height:1.5; color:#333; }
.tl-html-preview p { margin:0 0 8px; } .tl-html-preview p:last-child { margin-bottom:0; }
.tl-html-preview ul, .tl-html-preview ol { margin:0 0 8px; padding-left:22px; }
.tl-html-preview a { color:#3c8dbc; }
.tl-htmlpreview-empty { color:#6d7787; font-style:italic; }
.tlb-field .errorlist { list-style:none; margin:0 0 4px; padding:0; color:#c0392b; font-size:12px; font-weight:600; }
.tlb-field .errorlist li { margin:0; }

/* ---- Tests Card & Table ---- */
.tl-members-card {
  background: #fff;
  border-top: 3px solid #424f57;
  box-shadow: 0 1px 1px rgba(0,0,0,.1);
  border-radius: 0;
  margin-bottom: 20px;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  color: #333;
}

/* Card header buttons (Expand All, Add Sublist, Add Test): secondary style.
   .tl-card-header-actions already pushes them to the right. */
.tl-header-add-btn {
  border: 1px solid #d2d6de;
  background: #f4f4f4;
  color: #444;
  border-radius: 3px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 28px;
  box-sizing: border-box;
  box-shadow: 2px 2px 2px #ddd;
  transition: background-color 0.15s ease;
}
.tl-header-add-btn:hover {
  background: #e7e7e7;
  color: #444;
}
.tl-header-add-btn:focus-visible,
.tl-header-text-btn:focus-visible,
.tl-btn-sublist:focus-visible {
  border-color: #3c8dbc;
  outline: 2px solid #3c8dbc;
  outline-offset: 1px;
}

.tl-table-wrap {
  width: 100%;
  overflow-x: auto;
  background: #fff;
}

.tlb-table {
  width: 100%;
  border-collapse: collapse;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}

.tlb-table thead th {
  text-align: left;
  padding: 7px 10px;
  border-bottom: 2px solid #d2d6de;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .03em;
  color: #6e7785;
  background: #fff;
  white-space: nowrap;
}

.tl-th-drag, .tl-th-lock { width: 36px; padding-right: 0 !important; }
.tl-th-test { min-width: 260px; }
.tl-th-category { width: 140px; text-align: center !important; }
.tl-th-type { width: 150px; }
.tl-th-type-value { width: 220px; }
.tl-th-actions { width: 90px; text-align: right !important; }

.tlb-table tbody tr {
  background: #fff;
  border-bottom: 1px solid #f4f4f4;
  transition: background-color 0.1s ease;
}

.tlb-table tbody tr:hover {
  background-color: #f5f7fa;
}

.tlb-table tbody td {
  padding: 8px 10px;
  vertical-align: middle;
  font-size: 14px;
  color: #333;
  border: 0;
}

.tl-cell-drag {
  width: 36px;
  text-align: center;
  padding-right: 0 !important;
}

tr.tl-dragging {
  opacity: 0.45;
  background: #f4f4f4 !important;
}

.ui-sortable-helper {
  display: table;
  background: #fff !important;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  border-top: 1px solid #f4f4f4;
  border-bottom: 1px solid #f4f4f4;
}

.tl-drag-handle {
  color: #6d7787;
  font-size: 14px;
  cursor: grab;
  padding: 4px;
}
.tl-drag-handle:active {
  cursor: grabbing;
}

.tl-cell-test {
  display: flex;
  flex-direction: column;
  gap: 3px;
  justify-content: center;
  min-width: 240px;
}

.tl-test-name {
  font-size: 14px;
  font-weight: 600;
  color: #333;
  line-height: 1.3;
}

.tl-test-desc-wrap {
  min-height: 18px;
}

.tl-test-desc {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #555;
  font-size: 13px;
  line-height: 1.35;
  cursor: pointer;
}
.tl-test-desc > i {
  color: #6d7787;
  font-size: 11px;
  flex-shrink: 0;
}
/* Hover: darker + underline (link blue on the hovered row would be under 4.5:1) */
.tl-test-desc:hover {
  color: #333;
  text-decoration: underline;
}
/* The editable description is a <button> (keyboard access): drop the browser's button look. */
button.tl-test-desc {
  background: transparent;
  border: 0;
  padding: 0;
  margin: 0;
  font-family: inherit;
  text-align: left;
}
button.tl-test-desc:focus-visible,
.tl-add-desc-btn:focus-visible,
.tl-browse-btn:focus-visible {
  outline: 2px solid #3c8dbc;
  outline-offset: 2px;
}
.tl-test-desc.tl-test-desc-readonly,
.tl-test-desc.tl-test-desc-readonly:hover {
  cursor: default;
  color: #555;
  text-decoration: none;
}

.tl-add-desc-btn {
  background: transparent;
  border: 0;
  padding: 0;
  color: #555;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: color 0.15s ease;
}
.tl-add-desc-btn:hover {
  color: #333;
  text-decoration: underline;
}

.tl-cell-category {
  text-align: center;
}

/* One neutral chip for every category: colour is kept for QC status meaning
   (red = Action), so it isn't used to tell categories apart. */
.tl-cat-pill {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 3px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.4;
  white-space: nowrap;
  background: #fff;
  border: 1px solid #d2d6de;
  color: #555;
}

.tl-type-pill-wrap {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
}

/* One neutral label (label-default) for every test type; green/orange/cyan
   would read as QC status. */
.tl-type-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: #444;
  background: #d2d6de;
  border-radius: 2px;
  padding: 2px 6px;
  min-width: 26px;
  text-align: center;
  line-height: 1.2;
}

.tl-type-label {
  font-size: 13px;
  color: #333;
  font-weight: 400;
}

/* Base list "Type Value" column: one line, ellipsis, full text in the title tooltip */
.tl-cell-type-value {
  max-width: 220px;
}

.tl-type-value {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  color: #333;
}

.tl-type-value.tl-mono {
  font-size: 12px;
}

/* #555, not the #6e7785 meta grey: rows turn #f5f7fa on hover, where the meta grey is under 4.5:1 */
.tl-type-value-none {
  font-size: 13px;
  color: #555;
}

.tl-cell-actions {
  text-align: right;
  white-space: nowrap;
}
.tl-cell-actions .tl-action-icon {
  background: transparent;
  border: 0;
  padding: 4px 6px;
  color: #6d7787;
  font-size: 14px;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
  transition: color 0.15s ease;
}
.tl-cell-actions .tl-action-icon:hover {
  color: #555;
  background: #eceff3;
}
.tl-cell-actions .tl-delete-test-btn:hover {
  color: #c0392b;
  background: #fbe9e7;
}
.tl-cell-actions .tl-action-icon:focus-visible {
  outline: 2px solid #3c8dbc;
  outline-offset: 0;
}

.tl-empty-tests-placeholder {
  padding: 32px 16px;
  text-align: center;
  color: #6d7787;
  font-size: 13px;
}

/* ---- Sublist Row in Builder Table ---- */
.tl-sublist-row {
  background: transparent !important;
}
.tl-sublist-row:hover {
  background: transparent !important;
}
.tl-sublist-cell {
  padding: 4px 6px !important;
  border-top: 0 !important;
  border-bottom: 0 !important;
  background: transparent !important;
}

/* Sublist cards are neutral: amber means Tolerance in QATrack+. */
.tl-sublist-card {
  border: 1px solid #d2d6de;
  border-radius: 0;
  background: #fff;
  margin: 2px 0;
  box-shadow: 0 1px 1px rgba(0,0,0,.1);
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  overflow: hidden;
  transition: box-shadow 0.15s ease;
}
.tl-sublist-row:hover .tl-sublist-card {
  box-shadow: 0 1px 3px rgba(0,0,0,.15);
}
/* Sublist drawn in its own box on the Perform QC page (Sublist.outline) */
.tl-sublist-card.tl-sublist-outlined {
  border: 2px solid #424f57;
}

.tl-sublist-outline {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin: 0 6px 0 0;
  font-size: 12px;
  font-weight: 600;
  color: #555;
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
}
.tl-sublist-outline input[type="checkbox"] {
  margin: 0;
  cursor: pointer;
}

.tl-sublist-header {
  background: #fbfcfd;
  padding: 6px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 38px;
  box-sizing: border-box;
}

.tl-sublist-drag-handle {
  cursor: grab;
  color: #6d7787;
  font-size: 13px;
  padding: 4px 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s ease;
}
.tl-sublist-drag-handle:hover {
  color: #444;
}

.tl-sublist-toggle-btn {
  background: transparent;
  border: 0;
  padding: 4px 6px;
  color: #555;
  cursor: pointer;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
  transition: all 0.15s ease;
}
.tl-sublist-toggle-btn:hover {
  background: #e7e7e7;
  color: #333;
}
.tl-sublist-toggle-btn:focus-visible {
  outline: 2px solid #3c8dbc;
  outline-offset: 0;
}
.tl-toggle-icon {
  transition: transform 0.2s ease;
}

.tl-sublist-row.collapsed .tl-sublist-body {
  display: none !important;
}
.tl-sublist-row.collapsed .tl-toggle-icon {
  transform: rotate(0deg);
}

.tl-sublist-row.expanded .tl-sublist-body {
  display: block !important;
}
.tl-sublist-row.expanded .tl-toggle-icon {
  transform: rotate(90deg);
}
.tl-sublist-row.expanded .tl-sublist-header {
  border-bottom: 1px solid #f4f4f4;
  background: #fbfcfd;
}

.tl-sublist-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  flex: 1;
  cursor: pointer;
}

.tl-sublist-folder-icon {
  color: #555;
  font-size: 15px;
}

/* "Sublist" badge and test count: label-default */
.tl-sublist-badge {
  background: #d2d6de;
  color: #444;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 2px;
  letter-spacing: .03em;
  text-transform: uppercase;
}

.tl-sublist-name {
  font-size: 14px;
  font-weight: 600;
  color: #333;
}

.tl-sublist-count {
  background: #d2d6de;
  color: #444;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 2px;
  margin-left: 2px;
}

.tl-sublist-actions {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.tl-card-header-actions {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.tl-header-text-btn {
  background: #f4f4f4;
  border: 1px solid #d2d6de;
  border-radius: 3px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 600;
  color: #444;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  box-shadow: 2px 2px 2px #ddd;
  transition: background-color 0.15s ease;
  height: 28px;
  box-sizing: border-box;
}
.tl-header-text-btn:hover {
  background: #e7e7e7;
  color: #444;
}

/* Sublist header buttons (Edit, Change, Remove): secondary; Remove is the ghost danger style */
.tl-btn-sublist {
  background: #f4f4f4;
  border: 1px solid #d2d6de;
  border-radius: 3px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 600;
  color: #444;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  text-decoration: none;
  box-shadow: 2px 2px 2px #ddd;
  transition: background-color 0.15s ease;
}
a.tl-btn-sublist:link,
a.tl-btn-sublist:visited {
  color: #444;
}
.tl-btn-sublist:hover,
a.tl-btn-sublist:hover {
  background: #e7e7e7;
  color: #444;
  text-decoration: none;
}
.tl-btn-sublist.tl-btn-remove-sublist {
  background: #fff;
  border-color: #e8c4be;
  color: #c0392b;
}
.tl-btn-sublist.tl-btn-remove-sublist:hover {
  background: #fbe9e7;
  border-color: #e8c4be;
  color: #c0392b;
}

/* Also used by the Parent Memberships card */
.tl-sublist-info-banner {
  background: #f4f4f4;
  border-top: 1px solid #d2d6de;
  border-bottom: 1px solid #d2d6de;
  padding: 7px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #555;
}
.tl-sublist-info-banner > .fa {
  color: #555;
  font-size: 14px;
  flex-shrink: 0;
}

.tl-sublist-table-wrap {
  width: 100%;
  overflow-x: auto;
}

.tl-sublist-table tbody tr {
  background: #fff;
  border-bottom: 1px solid #f4f4f4;
}
.tl-sublist-table tbody tr:hover {
  background: #f5f7fa;
}

.tl-cell-lock {
  width: 36px;
  text-align: center;
  padding-right: 0 !important;
  color: #6d7787;
  font-size: 12px;
  white-space: nowrap;
}
.tl-lock-icon {
  color: #6d7787;
  margin-right: 4px;
}
.tl-caret-icon {
  color: #6d7787;
}

.tl-empty-sublist-msg {
  padding: 16px 14px;
  color: #6d7787;
  font-style: italic;
  font-size: 13px;
}

/* ---- Modals & Search Dialog ---- */
.tl-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.tl-modal-backdrop[hidden] {
  display: none !important;
}

.tl-modal-dialog {
  background: #fff;
  border-radius: 0;
  border-top: 3px solid #424f57;
  box-shadow: 0 8px 26px rgba(0,0,0,.18);
  width: 100%;
  max-width: 580px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}
.tl-search-dialog {
  max-width: 650px;
}

.tl-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid #f4f4f4;
  background: #fff;
}
.tl-modal-title {
  font-size: 18px;
  font-weight: 400;
  line-height: 1.2;
  color: #444;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  text-transform: none;
  letter-spacing: normal;
  background: transparent;
  padding: 0;
}
.tl-modal-title > .fa {
  color: #555;
  font-size: 16px;
}
.tl-modal-close-btn {
  background: transparent;
  border: 0;
  border-radius: 3px;
  font-size: 20px;
  line-height: 1;
  color: #6d7787;
  cursor: pointer;
}
.tl-modal-close-btn:hover {
  color: #333;
}
.tl-modal-close-btn:focus-visible {
  outline: 2px solid #3c8dbc;
  outline-offset: 1px;
}
.tl-modal-body label {
  font-size: 13px;
  font-weight: 600;
  color: #555;
}

.tl-modal-body {
  padding: 16px;
  overflow-y: auto;
  flex: 1;
}

.tl-modal-note {
  margin: 0 0 12px;
  font-size: 12px;
  color: #6e7785;
  line-height: 1.4;
}

.tl-modal-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 12px;
}
.tl-modal-field label {
  font-size: 13px;
  font-weight: 600;
  color: #555;
}
.tl-modal-input,
input[type="text"].tl-modal-input {
  width: 100%;
  box-sizing: border-box;
  border: 1px solid #d2d6de;
  border-radius: 0;
  padding: 6px 10px;
  font-size: 14px;
  box-shadow: 2px 2px 2px #ddd;
}
.tl-modal-input:focus,
input[type="text"].tl-modal-input:focus {
  border-color: #3c8dbc;
  outline: none;
}
.tl-modal-hint {
  font-size: 12px;
  color: #6e7785;
}

/* Save As… dialog */
.tl-saveas-dialog {
  max-width: 500px;
}
.tl-saveas-error {
  font-size: 12px;
  color: #c0392b;
}
.tl-saveas-error[hidden] {
  display: none;
}
.tl-modal-input.tl-input-invalid,
input[type="text"].tl-modal-input.tl-input-invalid {
  border-color: #c0392b;
}
.tl-saveas-not-copied {
  display: block;
  margin: 4px 0 0;
}
.tl-saveas-dialog .tl-btn-modal-save:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.tl-modal-textarea {
  width: 100%;
  box-sizing: border-box;
  font-size: 14px;
  border: 1px solid #d2d6de;
  padding: 8px 10px;
  border-radius: 0;
  box-shadow: 2px 2px 2px #ddd;
  line-height: 1.5;
  margin-top: 6px;
}
.tl-modal-textarea:focus {
  border-color: #3c8dbc;
  outline: none;
}

.tl-modal-footer {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  padding: 9px 12px;
  border-top: 1px solid #f4f4f4;
  background: #fbfcfd;
}

.tl-btn-modal-cancel {
  background: #f4f4f4;
  border: 1px solid #d2d6de;
  border-radius: 3px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 600;
  color: #444;
  box-shadow: 2px 2px 2px #ddd;
  cursor: pointer;
}
.tl-btn-modal-cancel:hover {
  background: #e7e7e7;
}
.tl-btn-modal-save {
  background: #424f57;
  border: 1px solid #424f57;
  border-radius: 3px;
  padding: 6px 16px;
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  box-shadow: 2px 2px 2px #ddd;
  cursor: pointer;
}
.tl-btn-modal-save:hover {
  background: #323e46;
  border-color: #212b33;
}
.tl-btn-modal-cancel:focus-visible,
.tl-btn-modal-save:focus-visible {
  border-color: #3c8dbc;
  outline: 2px solid #3c8dbc;
  outline-offset: 1px;
}

.tl-duplicate-modal {
  width: 540px;
  max-width: 95vw;
}
.tl-dup-info-banner {
  background: #f4f4f4;
  border-left: 3px solid #424f57;
  border-radius: 0;
  padding: 10px 12px;
  margin-bottom: 16px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size: 13px;
  color: #333;
}
.tl-dup-info-banner > .fa {
  font-size: 16px;
  color: #424f57;
  margin-top: 2px;
  flex-shrink: 0;
}
.tl-dup-details {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}
.tl-dup-badge {
  background: #d2d6de;
  color: #444;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 2px;
}
.tl-dup-note {
  margin: 6px 0 0;
  font-size: 12px;
  color: #555;
  line-height: 1.4;
}
.tl-dup-error-banner {
  background: #fbe9e7;
  border: 1px solid #e8c4be;
  border-left: 3px solid #dd4b39;
  color: #333;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 12px;
  border-radius: 0;
  margin-bottom: 14px;
}
@keyframes tl-pulse-highlight {
  0% { background-color: #f5f7fa; box-shadow: inset 0 0 0 2px #424f57; }
  70% { background-color: #f5f7fa; box-shadow: inset 0 0 0 1px #d2d6de; }
  100% { background-color: transparent; box-shadow: none; }
}

.tl-search-input-wrap {
  position: relative;
  margin-bottom: 12px;
}
.tl-search-input-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: #6d7787;
  font-size: 14px;
  pointer-events: none;
  z-index: 2;
}
.tl-search-input-wrap input.tl-search-input,
input[type="text"].tl-search-input,
.tl-search-input {
  width: 100% !important;
  box-sizing: border-box !important;
  padding: 9px 12px 9px 38px !important;
  padding-left: 38px !important;
  border: 1px solid #d2d6de !important;
  border-radius: 0 !important;
  font-size: 14px !important;
  line-height: 1.4 !important;
  height: 38px !important;
  outline: none !important;
  box-shadow: 2px 2px 2px #ddd !important;
  color: #333 !important;
  background: #fff !important;
}
.tl-search-input-wrap input.tl-search-input:focus,
input[type="text"].tl-search-input:focus,
.tl-search-input:focus {
  border-color: #3c8dbc !important;
  box-shadow: 2px 2px 2px #ddd !important;
}

.tl-search-results-container {
  max-height: 380px;
  overflow-y: auto;
  border: 1px solid #d2d6de;
  border-radius: 0;
}
.tl-search-initial-hint, .tl-search-no-results {
  padding: 24px;
  text-align: center;
  color: #6d7787;
  font-size: 13px;
}

.tl-search-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-bottom: 1px solid #f4f4f4;
  transition: background-color 0.1s ease;
}
.tl-search-item:last-child {
  border-bottom: 0;
}
.tl-search-item:hover {
  background-color: #f5f7fa;
}
.tl-search-item-left {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.tl-search-item-title {
  font-size: 14px;
  color: #333;
}
/* #555 rather than the meta grey: these sit on rows that turn #f5f7fa on hover */
.tl-search-item-slug {
  font-size: 12px;
  color: #555;
  font-family: Menlo, Consolas, monospace;
  margin-left: 4px;
}
.tl-search-item-desc {
  font-size: 12px;
  color: #555;
}
.tl-search-item-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  margin-left: 12px;
}

/* Secondary: each result row has one, so none of them is "the" primary action */
.tl-btn-select-test, .tl-btn-select-sublist {
  background: #f4f4f4;
  color: #444;
  border: 1px solid #d2d6de;
  border-radius: 3px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  box-shadow: 2px 2px 2px #ddd;
}
.tl-btn-select-test:hover, .tl-btn-select-sublist:hover {
  background: #e7e7e7;
  color: #444;
}
.tl-btn-select-test:focus-visible, .tl-btn-select-sublist:focus-visible {
  border-color: #3c8dbc;
  outline: 2px solid #3c8dbc;
  outline-offset: 1px;
}

/* ---- Unsaved Changes Dialog ---- */
.tl-unsaved-dialog {
  max-width: 460px;
  border-radius: 0;
}
.tl-unsaved-dialog .tl-modal-title {
  color: #444;
}
.tl-unsaved-message {
  margin: 0;
  font-size: 14px;
  line-height: 1.5;
  color: #333;
}
.tl-btn-unsaved-stay,
.tl-btn-unsaved-leave {
  border-radius: 3px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 2px 2px 2px #ddd;
  cursor: pointer;
}
.tl-btn-unsaved-stay {
  background: #f4f4f4;
  border: 1px solid #d2d6de;
  color: #444;
}
.tl-btn-unsaved-stay:hover {
  background: #e7e7e7;
}
.tl-btn-unsaved-leave {
  background: #fff;
  border: 1px solid #e8c4be;
  color: #c0392b;
}
.tl-btn-unsaved-leave:hover {
  background: #fbe9e7;
}
.tl-btn-unsaved-stay:focus-visible,
.tl-btn-unsaved-leave:focus-visible {
  outline: 2px solid #3c8dbc;
  outline-offset: 1px;
}

/* ---- Attachments Card (Matching Fault Logs Edit Mode) ---- */
.tl-attachments-card {
  background: #fff;
  border-top: 3px solid #424f57;
  box-shadow: 0 1px 1px rgba(0,0,0,.1);
  border-radius: 0;
  margin-top: 24px;
  margin-bottom: 24px;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  color: #333;
}
.attachment-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  margin-bottom: 8px;
  border: 1px solid #d2d6de;
  border-radius: 0;
  background: #fff;
  box-shadow: none;
}
.attachment-card:hover {
  background: #f5f7fa;
}
/* Left rule: grey = saved, dark slate = pending upload (saved with the list),
   red = file missing from the server (a real problem). */
.attachment-card.existing {
  border-left: 3px solid #d2d6de;
}
.attachment-card.missing {
  border-left: 3px solid #dd4b39;
}
.attachment-card.pending {
  border-left: 3px solid #424f57;
  background: #fbfcfd;
}
.attachment-name {
  flex-grow: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-right: 15px;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.attachment-name strong {
  color: #333;
}
.tl-attach-icon {
  color: #555;
}
.tl-attach-size {
  font-size: 12px;
  color: #555;
}
/* Icon-only buttons on each attachment: Preview (secondary), Remove (ghost danger) */
.tl-attach-btn,
a.tl-attach-btn:link,
a.tl-attach-btn:visited {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 3px 8px;
  font-size: 12px;
  line-height: 1.4;
  border: 1px solid #d2d6de;
  border-radius: 3px;
  background: #f4f4f4;
  color: #444;
  box-shadow: 2px 2px 2px #ddd;
  text-decoration: none;
  cursor: pointer;
}
.tl-attach-btn:hover,
a.tl-attach-btn:hover {
  background: #e7e7e7;
  color: #444;
}
.tl-attach-btn.tl-attach-btn-remove {
  background: #fff;
  border-color: #e8c4be;
  color: #c0392b;
}
.tl-attach-btn.tl-attach-btn-remove:hover {
  background: #fbe9e7;
  color: #c0392b;
}
.tl-attach-btn:focus-visible,
.tl-browse-btn:focus-visible {
  border-color: #3c8dbc;
  outline: 2px solid #3c8dbc;
  outline-offset: 1px;
}
.attachment-actions {
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.tl-attach-comment-tag {
  font-size: 12px;
  color: #555;
  background: #f4f4f4;
  border: 1px solid #d2d6de;
  padding: 2px 8px;
  border-radius: 3px;
  font-weight: normal;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.tl-pending-comment-input {
  font-size: 12px;
  border: 1px solid #d2d6de;
  border-radius: 2px;
  box-shadow: 2px 2px 2px #eee;
  padding: 4px 8px;
  min-width: 200px;
  margin-left: 6px;
  outline: none;
}
.tl-pending-comment-input:focus {
  border-color: #3c8dbc;
}
.tl-browse-wrap {
  margin-top: 12px;
}
.tl-browse-btn {
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid #d2d6de;
  border-radius: 3px;
  background: #f4f4f4;
  color: #444;
  box-shadow: 2px 2px 2px #ddd;
  transition: background-color 0.15s ease;
}
.tl-browse-btn:hover {
  background: #e7e7e7;
  color: #444;
}
.tl-browse-btn .fa {
  color: #555;
}
.tl-empty-attachments-msg {
  padding: 14px 4px;
  color: #6d7787;
  font-size: 13px;
  font-style: italic;
}

/* ---- Parent Memberships Card ---- */
.tl-parents-card {
  background: #fff;
  border-top: 3px solid #424f57;
  box-shadow: 0 1px 1px rgba(0,0,0,.1);
  border-radius: 0;
  margin-top: 20px;
  margin-bottom: 24px;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  color: #333;
}
.tl-parents-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
  padding: 14px;
}
.tl-parent-card-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid #d2d6de;
  border-radius: 3px;
  padding: 8px 10px;
  text-decoration: none;
  color: inherit;
  transition: background-color 0.15s ease;
}
.tl-parent-card-item:hover {
  background: #f4f4f4;
  text-decoration: none;
}
.tl-parent-card-item:focus-visible {
  border-color: #3c8dbc;
  outline: 2px solid #3c8dbc;
  outline-offset: 1px;
}
.tl-parent-icon {
  font-size: 18px;
  color: #555;
  flex-shrink: 0;
}
.tl-parent-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  flex: 1;
}
.tl-parent-name {
  font-size: 14px;
  font-weight: 600;
  color: #333;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* #555: the item turns #f4f4f4 on hover, where the meta grey is under 4.5:1 */
.tl-parent-slug {
  font-size: 12px;
  color: #555;
  font-family: Menlo, Consolas, monospace;
}
.tl-parent-ext {
  font-size: 12px;
  color: #6d7787;
  margin-left: auto;
  flex-shrink: 0;
}
.tl-parent-card-item:hover .tl-parent-ext {
  color: #444;
}
.tl-parents-empty-card .tl-card-body {
  padding: 14px;
}
.tl-no-parents-hint {
  color: #6e7785;
  font-size: 13px;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tl-no-parents-hint > .fa {
  color: #6e7785;
}

/* ---- Messages List ---- */
ul.messagelist {
  margin: 0 0 16px;
  padding: 0;
  list-style: none;
}
/* Status colour only as the left rule (with the message's own words); text stays dark. */
ul.messagelist li {
  padding: 8px 12px;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: 400;
  border-radius: 0;
  background: #fff;
  border: 1px solid #d2d6de;
  color: #333;
}
ul.messagelist li.success {
  background: #fff;
  border: 1px solid #d2d6de;
  border-left: 3px solid #00a65a;
  color: #333;
}
ul.messagelist li.warning {
  background: #fff;
  border: 1px solid #d2d6de;
  border-left: 3px solid #f39c12;
  color: #333;
}
ul.messagelist li.error {
  background: #fbe9e7;
  border: 1px solid #e8c4be;
  border-left: 3px solid #dd4b39;
  color: #333;
}
.errornote {
  background: #fbe9e7;
  border: 1px solid #e8c4be;
  border-left: 3px solid #dd4b39;
  color: #333;
  font-size: 14px;
  font-weight: 600;
  padding: 8px 12px;
  border-radius: 0;
  margin-bottom: 16px;
}

/* ---- Changelist ---- */
/* Text for screen readers only (e.g. the unit names behind the Units count). */
.tl-visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0, 0, 0, 0); white-space:nowrap; border:0; }
.change-list.model-testlist #content { padding-top:8px; }
.tl-index-header { display:flex; align-items:flex-end; justify-content:space-between; gap:12px 16px; flex-wrap:wrap; margin:0 0 12px; }
/* The title sits on the page background, not a white card: Django's own variables
   keep it readable in both the light and the dark admin theme. */
.tl-index-title { font-size:22px; font-weight:400; line-height:1.1; color:var(--body-fg, #444); margin:0; }
.tl-index-title small { font-size:14px; color:var(--body-quiet-color, #666); margin-left:8px; }
.tl-object-tools { margin:0; padding:0; display:flex; gap:6px; list-style:none; }
.tl-object-tools li { list-style:none; margin:0; float:none; }
.tl-btn { display:inline-flex; align-items:center; gap:6px; font-size:13px; line-height:1.4; padding:6px 12px; border:1px solid #d2d6de; border-radius:3px; box-shadow:2px 2px 2px #ddd; text-decoration:none; white-space:nowrap; }
/* a.tl-btn-*:link etc. outrank Django admin's a:link/a:visited/a:hover colours. */
.tl-btn-default, a.tl-btn-default:link, a.tl-btn-default:visited { background:#f4f4f4; border-color:#d2d6de; color:#444; }
.tl-btn-default:hover, a.tl-btn-default:hover, a.tl-btn-default:focus { background:#e7e7e7; color:#444; }
.tl-btn-primary, a.tl-btn-primary:link, a.tl-btn-primary:visited { background:#424f57; border-color:#424f57; color:#fff; font-weight:600; }
.tl-btn-primary:hover, a.tl-btn-primary:hover, a.tl-btn-primary:focus { background:#323e46; border-color:#212b33; color:#fff; }
#changelist.filtered { display:grid; grid-template-columns:1fr 248px; column-gap:16px; row-gap:0; align-items:start; background:transparent; box-shadow:none; border:0; padding:0; margin:0; width:auto; }
#changelist:not(.filtered) { background:#fff; border-top:3px solid #424f57; box-shadow:0 1px 1px rgba(0,0,0,.1); }
.tl-results-head { grid-column:1; grid-row:1; display:flex; align-items:center; gap:8px; padding:10px 12px; background:#fff; border-top:3px solid #424f57; border-bottom:1px solid #f4f4f4; box-shadow:0 1px 1px rgba(0,0,0,.1); }
.tl-results-head > .fa { font-size:16px; color:#555; }
.tl-results-title, #changelist .tl-results-title { font-size:18px; font-weight:400; line-height:1; color:#444 !important; background:transparent !important; margin:0; padding:0; }
.tl-results-search { margin-left:auto; }
#changelist-form { grid-column:1; grid-row:2; background:#fff; box-shadow:0 1px 1px rgba(0,0,0,.1); }
.tl-results-search #toolbar { padding:0; margin:0; border:0; background:transparent; }
.tl-results-search #changelist-search > div { display:flex; align-items:center; border:1px solid #d2d6de; padding:4px 9px; background:#fff; box-shadow:2px 2px 2px #eee; border-radius:2px; }
.tl-results-search #changelist-search > div::before { font-family:FontAwesome; content:"\f002"; color:#6d7787; margin-right:6px; font-size:13px; }
.tl-results-search label { display:none; }
.tl-results-search #searchbar { border:0; outline:none; font-size:13px; min-width:210px; padding:0; margin:0; background:transparent; }
/* Search is a secondary button (the page's one primary action is "New Test List").
   The #changelist/#toolbar ids outrank Django's #toolbar form input[type="submit"]. */
#changelist .tl-results-search #toolbar form input[type="submit"] { border:1px solid #d2d6de; background:#f4f4f4; color:#444; font-size:12px; font-weight:600; line-height:1.4; padding:4px 11px; border-radius:3px; box-shadow:2px 2px 2px #ddd; margin:0 0 0 8px; cursor:pointer; }
#changelist .tl-results-search #toolbar form input[type="submit"]:hover { background:#e7e7e7; border-color:#d2d6de; color:#444; }
#changelist .tl-results-search #toolbar form input[type="submit"]:focus { border-color:#3c8dbc; outline:none; }
#changelist .tl-results-search #toolbar form input[type="submit"]:focus-visible { outline:2px solid #3c8dbc; outline-offset:1px; }
.tl-results-search #changelist-search .quiet, .tl-results-search #changelist-search .help { display:none; }
/* Rows scroll inside the card with the header pinned; initResultsScroll() sets an
   inline max-height that fits the viewport so the actions bar and paginator stay
   visible. This is the fallback before (or without) the script. */

<script>

  var activeSwapCard = null;

    "Expand All": "{{ _('Expand All')|escapejs }}",

    "Input": "{{ _('Input')|escapejs }}",
    "Limits don't apply to this test type: its results never pass or fail.": "{{ _("Limits don't apply to this test type: its results never pass or fail.")|escapejs }}",
    "Loading…": "{{ _('Loading…')|escapejs }}",
    "No limits set: results on %(unit)s will show No Tol Set": "{% trans 'No limits set: results on %(unit)s will show No Tol Set' as s %}{{ s|escapejs }}",
    "None": "{{ _('None')|escapejs }}",
    "Not used": "{{ _('Not used')|escapejs }}",
    "Preview": "{{ _('Preview')|escapejs }}",
    "Preview %(name)s": "{% trans 'Preview %(name)s' as s %}{{ s|escapejs }}",
    "Remove": "{{ _('Remove')|escapejs }}",
    "Remove %(name)s": "{% trans 'Remove %(name)s' as s %}{{ s|escapejs }}",
    "Save": "{{ _('Save')|escapejs }}",
    "Save As New Test List": "{{ _('Save As New Test List')|escapejs }}",
    "Save the test list first": "{{ _('Save the test list first')|escapejs }}",
    "Save the test list first: QATrack+ adds this test to %(unit)s when it's saved.": "{% trans "Save the test list first: QATrack+ adds this test to %(unit)s when it's saved." as s %}{{ s|escapejs }}",

    "Search by test name, macro name or category…": "{{ _('Search by test name, macro name or category…')|escapejs }}",
    "Search name, slug, description or sublist…": "{{ _('Search name, slug, description or sublist…')|escapejs }}",
    "Select Sublist to Add": "{{ _('Select Sublist to Add')|escapejs }}",
    "Select Test to Add": "{{ _('Select Test to Add')|escapejs }}",
    "Set reference and tolerance for %(test)s on %(unit)s": "{% trans 'Set reference and tolerance for %(test)s on %(unit)s' as s %}{{ s|escapejs }}",
    "This test type has no reference: only its tolerance is used.": "{{ _('This test type has no reference: only its tolerance is used.')|escapejs }}",

    "This test list runs custom JavaScript on the Perform QC page.": "{{ _('This test list runs custom JavaScript on the Perform QC page.')|escapejs }}",
    "Type": "{{ _('Type')|escapejs }}",

    "Untitled Test List": "{{ _('Untitled Test List')|escapejs }}",

    "Value…": "{{ _('Value…')|escapejs }}"
  };
  var hasOwn = Object.prototype.hasOwnProperty;
  var jsGettext = window.gettext || function (s) { return s; };
  var jsNgettext = window.ngettext || function (s, p, n) { return n === 1 ? s : p; };
  var gettext = function (s) {
    return hasOwn.call(TL_STRINGS, s) ? TL_STRINGS[s] : jsGettext(s);
  };
  var ngettext = function (s, p, n) {
    var fromCatalogue = jsNgettext(s, p, n);
    if (fromCatalogue !== s && fromCatalogue !== p) { return fromCatalogue; }  // the JS catalogue has it
    return gettext(n === 1 ? s : p);
  };
  var interpolate = window.interpolate || function (fmt, obj) {
    return fmt.replace(/%\(\w+\)s/g, function (m) { return String(obj[m.slice(2, -2)]); });
  };

  // Builder endpoint URLs are reversed by Django's url tag and rendered as data-*
  // attributes on the Tests & Sublists card, so nothing here depends on
  // where the admin is mounted.
  function builderUrl(name) {
    var card = document.getElementById("tl-tests-card");
    return card ? (card.getAttribute("data-" + name + "-url") || "") : "";
  }

  // Change form: toggle the live (htmx-driven) description preview pane.
  function initPreviewToggle() {
    var btn = document.querySelector("[data-desc-toggle]");
    var pane = document.getElementById("tl-desc-preview");
    var ta = document.getElementById("id_description");
    if (!btn || !pane || !ta) { return; }
    function fire() { ta.dispatchEvent(new Event("previewrequested")); }
    btn.addEventListener("click", function (e) {
      e.preventDefault();
      var enable = pane.hidden;
      pane.hidden = !enable;
      btn.classList.toggle("on", enable);
      btn.setAttribute("aria-pressed", enable ? "true" : "false");
      btn.innerHTML = enable
        ? '<i class="fa fa-eye-slash" aria-hidden="true"></i> ' + escapeHtml(gettext("Hide Preview"))
        : '<i class="fa fa-eye" aria-hidden="true"></i> ' + escapeHtml(gettext("Preview"));
      if (enable) { ta.addEventListener("input", fire); fire(); }
      else { ta.removeEventListener("input", fire); }
    });
  }

  // Changelist: whole-row click navigates; keep inner links/inputs working.
  function initRowClick() {
    var table = document.getElementById("result_list");
    if (!table) { return; }
    var search = document.getElementById("searchbar");
    if (search && !search.getAttribute("placeholder")) {
      // TestListAdmin.search_fields: name, description, slug and sublist names
      search.setAttribute("placeholder", gettext("Search name, slug, description or sublist…"));
    }
    table.querySelectorAll("tbody tr").forEach(function (tr) {
      tr.addEventListener("click", function (e) {
        if (e.target.closest("a") || e.target.closest("input") ||
            e.target.closest("label") || window.getSelection().toString()) { return; }
        var link = tr.querySelector("a.tl-editlink") || tr.querySelector("a.tl-cell-name");
        if (link) { window.location = link.href; }
      });
    });
  }

  // Changelist: cap the results pane at the space left in the viewport so only
  // the rows scroll, not the whole page.
  function initResultsScroll() {
    var results = document.querySelector("#changelist-form .results");
    if (!results || results.dataset.tlFit) { return; }
    results.dataset.tlFit = "1";
    var form = document.getElementById("changelist-form");
    var narrow = window.matchMedia ? window.matchMedia("(max-width: 1024px)") : null;
    function fit() {
      var box = results.getBoundingClientRect();
      var top = box.top + window.scrollY;
      var below = form.getBoundingClientRect().bottom - box.bottom;
      var avail = Math.max(240, window.innerHeight - top - below - 16);
      // With the filter card on top (narrow screens) the space left below is often
      // nothing, so allow roughly a screen of rows instead.
      if (narrow && narrow.matches) {
        avail = Math.max(avail, Math.min(560, window.innerHeight - 220));
      }
      results.style.maxHeight = avail + "px";
    }
    fit();
    window.addEventListener("resize", fit);
  }

  function sortBuilderItemsByOrder() {
    var tbody = document.getElementById("tl-tests-tbody");
    if (!tbody) { return; }
    var rows = Array.from(tbody.querySelectorAll("tr.tl-member-item"));
    if (rows.length <= 1) { return; }

    rows.sort(function (a, b) {
      var orderA = parseInt(a.getAttribute("data-order"), 10);
      if (isNaN(orderA)) {
        var inputA = a.querySelector(".tl-order-input, .tl-sublist-order-input");
        orderA = inputA && inputA.value !== "" ? parseInt(inputA.value, 10) : 9999;
      }
      var orderB = parseInt(b.getAttribute("data-order"), 10);
      if (isNaN(orderB)) {
        var inputB = b.querySelector(".tl-order-input, .tl-sublist-order-input");
        orderB = inputB && inputB.value !== "" ? parseInt(inputB.value, 10) : 9999;
      }
      return orderA - orderB;
    });

    rows.forEach(function (r) {
      tbody.appendChild(r);
    });
  }

  function updateCounts() {
    var rows = document.querySelectorAll("#tl-tests-tbody tr.tl-member-item");
    var visibleDirectCount = 0;
    var visibleSublistsCount = 0;
    var sublistTestsCount = 0;

    rows.forEach(function (r) {
      var del = r.querySelector("input[name$='-DELETE']");
      var isDel = del && (del.checked || del.value === "true");
      var isHidden = r.style.display === "none";
      if (!isDel && !isHidden) {
        if (r.classList.contains("tl-test-row")) {
          visibleDirectCount++;
        } else if (r.classList.contains("tl-sublist-row")) {
          visibleSublistsCount++;
          var subRows = r.querySelectorAll("tbody tr.tl-sublist-test-row");
          sublistTestsCount += subRows.length;
        }
      }
    });

    // Both the card badge and the page header show the total number of tests,
    // including the tests inside sublists, so the two numbers always agree.
    var totalTests = visibleDirectCount + sublistTestsCount;

    var badge = document.getElementById("tl-tests-count");
    if (badge) { badge.textContent = totalTests; }
    var emptyMsg = document.getElementById("tl-empty-tests-msg");
    if (emptyMsg) {
      emptyMsg.style.display = (visibleDirectCount + visibleSublistsCount) === 0 ? "block" : "none";
    }

    var headerCounts = document.getElementById("tl-header-counts");
    if (headerCounts) {
      var tStr = interpolate(ngettext("%(count)s test", "%(count)s tests", totalTests), {count: totalTests}, true);
      var sStr = interpolate(ngettext("%(count)s sublist", "%(count)s sublists", visibleSublistsCount), {count: visibleSublistsCount}, true);
      headerCounts.innerHTML = '<span>' + escapeHtml(tStr) + '</span> &middot; <span>' + escapeHtml(sStr) + '</span>';
    }
  }

  function syncOrder() {
    var order = 0;
    var rows = document.querySelectorAll("#tl-tests-tbody tr.tl-member-item");
    rows.forEach(function (r) {
      var del = r.querySelector("input[name$='-DELETE']");
      var isDel = del && (del.checked || del.value === "true");
      var isHidden = r.style.display === "none";

      var orderInput = r.querySelector(".tl-order-input, .tl-sublist-order-input");
      if (orderInput) {
        if (!isDel && !isHidden) {
          orderInput.value = order;
          r.setAttribute("data-order", order);
          order++;
        } else {
          orderInput.value = "";
        }
      }
    });

    updateCounts();
  }

  function openSearchModal(mode, swapCard) {
    activeSwapCard = swapCard || null;
    var modal = document.getElementById("tl-search-modal");
    if (!modal) { return; }
    if (modal.hidden) { builderDialogFocus.searchOpener = document.activeElement; }

    var title = document.getElementById("tl-search-title-text");
    var input = document.getElementById("tl-search-input");
    var resultsBox = document.getElementById("tl-search-results-box");

    var testsCard = document.getElementById("tl-tests-card");
    var originalId = testsCard ? (testsCard.getAttribute("data-original-id") || "") : "";

    var url = "";
    if (mode === "test") {
      if (title) { title.textContent = gettext("Select Test to Add"); }
      if (input) {
        input.placeholder = gettext("Search by test name, macro name or category…");
        url = builderUrl("search-tests");
        input.setAttribute("hx-get", url);
        input.value = "";
      }
    } else {
      if (title) { title.textContent = activeSwapCard ? gettext("Change Sublist") : gettext("Select Sublist to Add"); }
      if (input) {
        input.placeholder = gettext("Search available test lists…");
        url = builderUrl("search-sublists") + (originalId ? "?current_id=" + encodeURIComponent(originalId) : "");
        input.setAttribute("hx-get", url);
        input.value = "";
      }
    }

    modal.hidden = false;
    if (resultsBox) {
      resultsBox.innerHTML = '<div class="tl-search-initial-hint"><i class="fa fa-spinner fa-spin" aria-hidden="true"></i> ' +
        escapeHtml(gettext("Loading…")) + '</div>';
      fetch(url)
        .then(function (res) { return res.text(); })
        .then(function (html) {
          resultsBox.innerHTML = html;
          if (window.htmx) { htmx.process(resultsBox); }
        })
        .catch(function () {
          resultsBox.innerHTML = '<div class="tl-search-no-results" role="alert">' +
            escapeHtml(gettext("Couldn't load the list. Close this dialog and try again.")) + '</div>';
        });
    }

    if (input) {
      if (window.htmx) { htmx.process(input); }
      setTimeout(function () { input.focus(); }, 60);
    }
  }

  function addTestRow(testId) {
    var totalFormsInput = document.getElementById("id_testlistmembership_set-TOTAL_FORMS");
    var currentIndex = totalFormsInput ? (parseInt(totalFormsInput.value, 10) || 0) : 0;
    var testsCard = document.getElementById("tl-tests-card");
    var originalId = testsCard ? (testsCard.getAttribute("data-original-id") || "") : "";

    var url = builderUrl("add-test-row") + "?test_id=" + encodeURIComponent(testId) +
              "&index=" + currentIndex +
              "&test_list_id=" + encodeURIComponent(originalId);

    fetch(url)

  // Drag-and-drop sortable support (HTML5 native + jQuery UI if available)
  function initSortables() {
    var $ = window.django && window.django.jQuery ? window.django.jQuery : (window.jQuery || window.$);
    if ($ && $.fn && $.fn.sortable) {
      try {
        $("#tl-tests-tbody").sortable({
          handle: ".tl-drag-handle",
          items: "> tr.tl-member-item",
          axis: "y",
          helper: function (e, tr) {
            var $originals = tr.children();
            var $helper = tr.clone();
            $helper.children().each(function (index) {
              $(this).width($originals.eq(index).width());
            });
            return $helper;
          },
          start: function (e, ui) {
            ui.placeholder.height(ui.item.height());
          },
          update: function () {
            syncOrder();
          }
        });
      } catch (err) {}
    }

    // HTML5 drag-and-drop fallback
    var tbody = document.getElementById("tl-tests-tbody");
    if (tbody) {
      tbody.querySelectorAll("tr.tl-member-item").forEach(function (row) {
        var handle = row.querySelector(".tl-drag-handle");
        if (handle && !row.hasAttribute("data-dnd-init")) {
          row.setAttribute("data-dnd-init", "true");
          handle.setAttribute("draggable", "true");
          handle.addEventListener("dragstart", function (e) {
            e.dataTransfer.setData("text/plain", "");
            row.classList.add("tl-dragging");
            window._tlDraggedRow = row;
          });
          handle.addEventListener("dragend", function () {
            row.classList.remove("tl-dragging");
            window._tlDraggedRow = null;
            syncOrder();
          });
          row.addEventListener("dragover", function (e) {
            e.preventDefault();
            var dragged = window._tlDraggedRow;
            if (dragged && dragged !== row && row.parentNode === tbody) {
              var rect = row.getBoundingClientRect();
              var mid = rect.top + rect.height / 2;
              if (e.clientY < mid) {
                tbody.insertBefore(dragged, row);
              } else {
                tbody.insertBefore(dragged, row.nextSibling);
              }
            }
          });
        }
      });
    }
  }

  function initSublistToggles() {
    var toggleAllBtn = document.getElementById("tl-toggle-all-sublists-btn");
    var toggleAllText = document.getElementById("tl-toggle-all-sublists-text");
    if (toggleAllBtn && !toggleAllBtn.hasAttribute("data-init")) {
      toggleAllBtn.setAttribute("data-init", "true");
      toggleAllBtn.addEventListener("click", function (e) {
        e.preventDefault();
        var sublistRows = document.querySelectorAll("#tl-tests-tbody tr.tl-sublist-row");
        if (sublistRows.length === 0) { return; }

        var anyCollapsed = Array.from(sublistRows).some(function (r) {
          return r.classList.contains("collapsed") && r.style.display !== "none";
        });

        sublistRows.forEach(function (r) {
          var body = r.querySelector(".tl-sublist-body");
          var btn = r.querySelector(".tl-sublist-toggle-btn");
          if (anyCollapsed) {
            r.classList.remove("collapsed");
            r.classList.add("expanded");
            if (body) { body.style.display = "block"; }
            if (btn) { btn.setAttribute("aria-expanded", "true"); }
          } else {
            r.classList.remove("expanded");
            r.classList.add("collapsed");
            if (body) { body.style.display = "none"; }
            if (btn) { btn.setAttribute("aria-expanded", "false"); }
          }
        });

        if (toggleAllText) {
          toggleAllText.textContent = anyCollapsed ? gettext("Collapse All") : gettext("Expand All");
        }
        var icon = toggleAllBtn.querySelector("i");
        if (icon) {
          icon.className = anyCollapsed ? "fa fa-compress" : "fa fa-expand";
        }
      });
    }
  }

  // Sublist "Outline on Perform QC page" checkbox: mirror its state on the

  // Global event delegation for all builder clicks
  document.addEventListener("click", function (e) {
    // Individual Sublist Expand/Collapse toggle
    var toggleBtn = e.target.closest(".tl-sublist-toggle-btn");
    var titleWrap = e.target.closest(".tl-sublist-title-wrap");
    if (toggleBtn || titleWrap) {
      // If clicking inside a button/link inside titleWrap (e.g. actions), don't toggle
      if (e.target.closest("button") && !e.target.closest(".tl-sublist-toggle-btn")) { return; }
      if (e.target.closest("a") || e.target.closest("input")) { return; }

      e.preventDefault();
      var sublistRow = (toggleBtn || titleWrap).closest(".tl-sublist-row");
      if (sublistRow) {
        var isCollapsed = sublistRow.classList.contains("collapsed");
        var body = sublistRow.querySelector(".tl-sublist-body");
        var btn = sublistRow.querySelector(".tl-sublist-toggle-btn");
        if (isCollapsed) {
          sublistRow.classList.remove("collapsed");
          sublistRow.classList.add("expanded");
          if (body) { body.style.display = "block"; }
          if (btn) { btn.setAttribute("aria-expanded", "true"); }
        } else {
          sublistRow.classList.remove("expanded");
          sublistRow.classList.add("collapsed");
          if (body) { body.style.display = "none"; }
          if (btn) { btn.setAttribute("aria-expanded", "false"); }
        }
      }
      return;
    }

    // Add Test button (card header)
    if (e.target.closest("#tl-header-add-test-btn")) {
      e.preventDefault();
      openSearchModal("test");
      return;
    }

    // Add Sublist button (card header)
    if (e.target.closest("#tl-header-add-sublist-btn")) {
      e.preventDefault();
      openSearchModal("sublist");
      return;
    }

    // Change Sublist button
    var changeBtn = e.target.closest(".tl-btn-change-sublist");
    if (changeBtn) {
      e.preventDefault();
      var card = changeBtn.closest(".tl-sublist-card");
      openSearchModal("sublist", card);

    // Select Test from search modal
    var testItem = e.target.closest(".tl-search-test-item, .tl-btn-select-test");
    if (testItem) {
      e.preventDefault();
      var row = testItem.closest(".tl-search-test-item");
      var testId = testItem.getAttribute("data-test-id") || (row && row.getAttribute("data-test-id"));
      if (testId) {
        addTestRow(testId);
        closeSearchModal();
      }
      return;
    }

    // Select Sublist from search modal
    var sublistItem = e.target.closest(".tl-search-sublist-item, .tl-btn-select-sublist");
    if (sublistItem) {
      e.preventDefault();
      var sRow = sublistItem.closest(".tl-search-sublist-item");

      if (childId) {
        addSublistCard(childId);
        closeSearchModal();
      }

    }

    // Remove Test button
    var delTestBtn = e.target.closest(".tl-delete-test-btn");
    if (delTestBtn) {
      e.preventDefault();
      var tRow = delTestBtn.closest("tr.tl-test-row");
      if (tRow) {
        var delInput = tRow.querySelector("input[name$='-DELETE']");
        if (delInput) { delInput.checked = true; }
        tRow.style.transition = "opacity 0.2s ease, transform 0.2s ease";
        tRow.style.opacity = "0";
        setTimeout(function () {
          tRow.style.display = "none";
          syncOrder();
        }, 180);
      }
      return;
    }

    // Remove Sublist button
    var delSubBtn = e.target.closest(".tl-btn-remove-sublist");
    if (delSubBtn) {
      e.preventDefault();
      var sCard = delSubBtn.closest(".tl-sublist-card");
      if (sCard) {
        var sDelInput = sCard.querySelector("input[name$='-DELETE']");
        if (sDelInput) { sDelInput.checked = true; }
        sCard.style.transition = "opacity 0.2s ease, transform 0.2s ease";
        sCard.style.opacity = "0";
        setTimeout(function () {
          sCard.style.display = "none";
          syncOrder();
        }, 180);
      }
      return;
    }

    // Duplicate Test button
    var dupBtn = e.target.closest(".tl-duplicate-test-btn");
    if (dupBtn) {
      e.preventDefault();
      var dRow = dupBtn.closest("tr.tl-test-row");
      var dTestId = dupBtn.getAttribute("data-test-id") || (dRow && dRow.getAttribute("data-test-id"));
      if (!dTestId && dRow) {
        var tInput = dRow.querySelector("input[name$='-test']");
        if (tInput) { dTestId = tInput.value; }
      }
      if (dTestId) {
        var totalFormsInput = document.getElementById("id_testlistmembership_set-TOTAL_FORMS");
        var currentIndex = totalFormsInput ? (parseInt(totalFormsInput.value, 10) || 0) : 0;
        var modalContainer = document.getElementById("tl-modal-container");
        if (modalContainer) {
          fetch(builderUrl("duplicate-test") + "?test_id=" + encodeURIComponent(dTestId) + "&index=" + currentIndex)
            .then(function(res) { return res.text(); })
            .then(function(html) {
              builderDialogFocus.containerOpener = dupBtn;
              modalContainer.innerHTML = html;
              var dInput = document.getElementById("id_dup_name");
              if (dInput) { dInput.focus(); dInput.select(); }
            })
            .catch(function(err) {
              console.error("Failed to load duplicate modal", err);
            });
        }
      }
      return;
    }

    // Modal close buttons
    if (e.target.matches("[data-search-close]") || e.target.closest("[data-search-close]")) {
      closeSearchModal();
    }
    if (e.target.matches("[data-modal-close]") || e.target.closest("[data-modal-close]")) {
      if (!closeContainerDialog()) {
        var dModalClose = e.target.closest(".tl-modal-backdrop");
        if (dModalClose) { dModalClose.remove(); }
      }
    }
    if (e.target.classList && e.target.classList.contains("tl-modal-backdrop")) {
      if (e.target.id === "tl-search-modal") {
        closeSearchModal();
      } else if (e.target.id === "tl-desc-modal-backdrop" || e.target.id === "tl-duplicate-modal-backdrop") {
        closeContainerDialog();

  // Duplicate test form submission & normal re-sync on form submission
  document.addEventListener("submit", function (e) {
    if (e.target && e.target.id === "tl-duplicate-test-form") {
      e.preventDefault();
      var form = e.target;
      var submitBtn = document.getElementById("tl-btn-submit-duplicate");
      var errorBox = document.getElementById("tl-dup-error-msg");
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin" aria-hidden="true"></i> ' + escapeHtml(gettext("Creating…"));
      }
      if (errorBox) { errorBox.style.display = "none"; }

      var formData = new FormData(form);
      var testsCard = document.getElementById("tl-tests-card");
      var origId = testsCard ? (testsCard.getAttribute("data-original-id") || "") : "";
      if (origId) { formData.append("test_list_id", origId); }

      fetch(form.action, {
        method: "POST",
        body: formData,
        headers: { "X-Requested-With": "XMLHttpRequest" }
      })
      .then(function(res) {
        if (!res.ok) {
          return res.text().then(function(text) {
            // the endpoint's own message (plain text) when it has one; never its HTML error pages
            var plain = text && !/^\s*</.test(text) ? text : "";
            throw new Error(plain || gettext("Couldn't create the test. Nothing was saved. Try again."));
          });
        }
        return res.text();
      })
      .then(function(rowHtml) {
        var tbody = document.getElementById("tl-tests-tbody");
        if (tbody) {
          var temp = document.createElement("tbody");
          temp.innerHTML = rowHtml.trim();
          var newRow = temp.firstElementChild;
          if (newRow) {
            var sourceId = formData.get("source_test_id");
            var sourceRow = sourceId ? tbody.querySelector("tr.tl-test-row[data-test-id='" + sourceId + "']") : null;
            if (sourceRow && sourceRow.parentNode === tbody) {
              sourceRow.after(newRow);
            } else {
              tbody.appendChild(newRow);
            }
            newRow.style.animation = "tl-pulse-highlight 1.5s ease";
            if (window.htmx) { htmx.process(newRow); }  // its description button uses hx-get
          }
        }
        var totalFormsInput = document.getElementById("id_testlistmembership_set-TOTAL_FORMS");
        if (totalFormsInput) {
          var cur = parseInt(totalFormsInput.value, 10) || 0;
          totalFormsInput.value = cur + 1;
        }
        initSortables();
        syncOrder();
        updateCounts();
        closeContainerDialog();
      })
      .catch(function(err) {
        // a network failure (TypeError) has the browser's own English message
