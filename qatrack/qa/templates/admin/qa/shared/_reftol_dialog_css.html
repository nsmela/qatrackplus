{% comment %}
The Reference and Tolerance dialog and the New Tolerance dialog stacked on top of it
(testlist/partials/_machine_ref_tol_modal.html, _machine_new_tolerance_modal.html), plus
the error and alert lines they share with the builder's Assign dialog. Included inside a
<style> block, after admin/qa/shared/_modal_css.html, by the Test List builder and the
Set References & Tolerances page. Moved here from testlist_assets.html; the narrow-screen
rule at the end came from the Set References & Tolerances page.
{% endcomment %}
/* ---- Reference and Tolerance dialogs (admin/qa/shared/_reftol_dialog_css.html) ---- */
.tl-assign-error {
  font-size: 12px;
  color: #c0392b;
}
.tl-assign-alert {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 0 0 12px;
  padding: 8px 10px;
  font-size: 13px;
  color: #333;
  background: #fbe9e7;
  border: 1px solid #e8c4be;
  border-left: 3px solid #dd4b39;
}
.tl-assign-alert[hidden] {
  display: none;
}
.tl-assign-alert .fa {
  color: #c0392b;
  margin-top: 2px;
}
.tl-reftol-dialog {
  max-width: 480px;
}
.tl-reftol-dialog form {
  display: flex;
  flex-direction: column;
  min-height: 0;
  margin: 0;
}
.tl-reftol-heading {
  min-width: 0;
}
.tl-reftol-subtitle {
  margin: 2px 0 0;
  font-size: 13px;
  color: #6e7785;
  overflow-wrap: anywhere;
}
.tl-reftol-current {
  margin: 0 0 12px;
  padding: 8px 10px;
  border: 1px solid #d2d6de;
  border-left: 3px solid #424f57;
  font-size: 13px;
  color: #333;
  overflow-wrap: anywhere;
}
.tl-reftol-meta {
  margin-top: 2px;
  font-size: 12px;
  color: #6e7785;
}
.tl-reftol-dialog select.tl-modal-input {
  height: auto;
  min-height: 32px;
  background: #fff;
  color: #333;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}
.tl-reftol-dialog select.tl-modal-input:focus {
  border-color: #3c8dbc;
  outline: none;
}
.tl-reftol-dialog .tl-modal-textarea {
  margin-top: 0;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
}
.tl-reftol-dialog .tl-modal-hint a,
.tl-reftol-history-link a {
  color: #357da7; /* dialog is plain white: 4.52:1 */
}
.tl-reftol-history-link {
  margin: 0;
  font-size: 12px;
}
.tl-reftol-dialog .tl-btn-modal-save:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.tl-reftol-tol-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.tl-reftol-tol-row select {
  flex: 1;
  min-width: 0;
}
/* secondary action inside a dialog: "New Tolerance…", "Use This One" */
.tl-btn-newtol {
  flex: 0 0 auto;
  background: #f4f4f4;
  border: 1px solid #d2d6de;
  border-radius: 3px;
  padding: 5px 10px;
  font-family: 'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: #444;
  box-shadow: 2px 2px 2px #ddd;
  cursor: pointer;
  white-space: nowrap;
}
.tl-btn-newtol:hover {
  background: #e7e7e7;
}
.tl-btn-newtol:focus-visible {
  border-color: #3c8dbc;
  outline: 2px solid #3c8dbc;
  outline-offset: 1px;
}
.tl-newtol-use {
  margin-top: 6px;
  display: block;
}
.tl-assign-alert .tl-newtol-use .fa {
  color: #444;
  margin-top: 0;
}
/* New Tolerance sits on top of the Reference and Tolerance dialog */
.tl-modal-backdrop.tl-newtol-backdrop {
  z-index: 10000;
  background: rgba(0,0,0,0.25);
}
.tl-newtol-limits {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0 12px;
}
.tl-newtol-type-label {
  font-size: 13px;
  font-weight: 600;
  color: #555;
}
.tl-newtol-type-value {
  font-size: 14px;
  color: #333;
}
.tl-newtol-unit[hidden] {
  display: none;
}
@media (max-width: 767px) {
  .tl-newtol-limits {
    grid-template-columns: minmax(0, 1fr);
  }
}
