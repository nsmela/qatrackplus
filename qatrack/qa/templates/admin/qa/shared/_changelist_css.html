{# Changelist styles shared by the QC admin list pages (Test Lists and admin/qa/change_list.html). Included inside a <style> block. #}
/* ---- Changelist ---- */
/* .tl-visually-hidden (screen-reader-only text, e.g. the unit names behind the Units count)
   and .tl-count-badge are in admin/qa/shared/_card_form_css.html. */
.tl-index-header { display:flex; align-items:flex-end; justify-content:space-between; gap:12px 16px; flex-wrap:wrap; margin:0 0 12px; }
/* The title sits on the page background, not a white card: Django's own variables
   keep it readable in both the light and the dark admin theme. */
.tl-index-title { font-size:22px; font-weight:400; line-height:1.1; color:var(--body-fg, #444); margin:0; }
.tl-index-title small { font-size:14px; color:var(--body-quiet-color, #666); margin-left:8px; }
/* The buttons wrap onto a second line in narrow windows instead of widening the page;
   right-aligned so "New Test List" stays at the end where it sits on wide screens. */
.tl-object-tools { margin:0; padding:0; display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; list-style:none; min-width:0; max-width:100%; }
.tl-object-tools li { list-style:none; margin:0; float:none; }
.tl-btn { display:inline-flex; align-items:center; gap:6px; font-size:13px; line-height:1.4; padding:6px 12px; border:1px solid #d2d6de; border-radius:3px; box-shadow:2px 2px 2px #ddd; text-decoration:none; white-space:nowrap; }
/* a.tl-btn-*:link etc. outrank Django admin's a:link/a:visited/a:hover colours. */
.tl-btn-default, a.tl-btn-default:link, a.tl-btn-default:visited { background:#f4f4f4; border-color:#d2d6de; color:#444; }
.tl-btn-default:hover, a.tl-btn-default:hover, a.tl-btn-default:focus { background:#e7e7e7; color:#444; }
.tl-btn-primary, a.tl-btn-primary:link, a.tl-btn-primary:visited { background:#424f57; border-color:#424f57; color:#fff; font-weight:600; }
.tl-btn-primary:hover, a.tl-btn-primary:hover, a.tl-btn-primary:focus { background:#323e46; border-color:#212b33; color:#fff; }
#changelist.filtered { display:grid; grid-template-columns:1fr 248px; column-gap:16px; row-gap:0; align-items:start; background:transparent; box-shadow:none; border:0; padding:0; margin:0; width:auto; }
#changelist:not(.filtered) { background:#fff; border-top:3px solid #424f57; box-shadow:0 1px 1px rgba(0,0,0,.1); }
.tl-results-head { grid-column:1; grid-row:1; display:flex; align-items:center; gap:8px; padding:10px 12px; background:#fff; border-top:3px solid #424f57; border-bottom:1px solid #f4f4f4; box-shadow:0 1px 1px rgba(0,0,0,.1); }
.tl-results-head > .fa { font-size:16px; color:#555; }
.tl-results-title, #changelist .tl-results-title { font-size:18px; font-weight:400; line-height:1; color:#444 !important; background:transparent !important; margin:0; padding:0; }
.tl-results-search { margin-left:auto; }
#changelist-form { grid-column:1; grid-row:2; background:#fff; box-shadow:0 1px 1px rgba(0,0,0,.1); }
.tl-results-search #toolbar { padding:0; margin:0; border:0; background:transparent; }
.tl-results-search #changelist-search > div { display:flex; align-items:center; border:1px solid #d2d6de; padding:4px 9px; background:#fff; box-shadow:2px 2px 2px #eee; border-radius:2px; }
.tl-results-search #changelist-search > div::before { font-family:FontAwesome; content:"\f002"; color:#6d7787; margin-right:6px; font-size:13px; }
.tl-results-search label { display:none; }
.tl-results-search #searchbar { border:0; outline:none; font-size:13px; min-width:210px; padding:0; margin:0; background:transparent; }
/* Search is a secondary button (the page's one primary action is "New Test List").
   The #changelist/#toolbar ids outrank Django's #toolbar form input[type="submit"]. */
#changelist .tl-results-search #toolbar form input[type="submit"] { border:1px solid #d2d6de; background:#f4f4f4; color:#444; font-size:12px; font-weight:600; line-height:1.4; padding:4px 11px; border-radius:3px; box-shadow:2px 2px 2px #ddd; margin:0 0 0 8px; cursor:pointer; }
#changelist .tl-results-search #toolbar form input[type="submit"]:hover { background:#e7e7e7; border-color:#d2d6de; color:#444; }
#changelist .tl-results-search #toolbar form input[type="submit"]:focus { border-color:#3c8dbc; outline:none; }
#changelist .tl-results-search #toolbar form input[type="submit"]:focus-visible { outline:2px solid #3c8dbc; outline-offset:1px; }
.tl-results-search #changelist-search .quiet, .tl-results-search #changelist-search .help { display:none; }
/* Rows scroll inside the card with the header pinned; initResultsScroll() sets an
   inline max-height that fits the viewport so the actions bar and paginator stay
   visible. This is the fallback before (or without) the script. */
#changelist-form .results { max-height:calc(100vh - 320px); overflow:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:#8a929e #f4f4f4; }
#changelist-form .results::-webkit-scrollbar { width:10px; height:10px; }
#changelist-form .results::-webkit-scrollbar-track { background:#f4f4f4; }
#changelist-form .results::-webkit-scrollbar-thumb { background:#8a929e; border:2px solid #f4f4f4; border-radius:3px; }
#changelist-form .results::-webkit-scrollbar-thumb:hover { background:#6e7785; }
#result_list { width:100%; border-collapse:collapse; background:#fff; }
/* Django's #changelist table thead th { padding:0 } outranks a padding set here, and
   Django pads the header's inner .text link/span (8px 10px) instead, so the header
   spacing (7px 10px, the design spec's data-table header) goes on that inner element. */
#result_list thead th { position:sticky; top:0; z-index:2; text-align:left; border-bottom:0; box-shadow:inset 0 -2px 0 #d2d6de; font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:#6e7785; background:#fff; white-space:nowrap; }
#result_list thead th .text > a, #result_list thead th .text > span { padding:7px 10px; }
/* One pixel less than Django's 9px, matching the 1px less above the label, so the
   sort arrows and priority number stay level with the header text. */
#result_list thead th.sorted .sortoptions { padding-top:8px; }
#result_list thead th a, #result_list thead th.sortable a { color:#6e7785; }
#result_list thead th a:hover, #result_list thead th.sortable a:hover { color:#444; }
#result_list tbody td, #result_list tbody th { padding:8px 10px; border-top:1px solid #f4f4f4; border-bottom:0; vertical-align:middle; font-size:13px; color:#333; background:transparent; }
#result_list tbody tr { background:#fff; }
#result_list tbody tr:hover { background:#f5f7fa; cursor:pointer; }
/* Narrow results card (measured on the card, so the admin nav sidebar counts):
   the small columns shrink to their content and the Name column takes the rest,
   so names wrap less and the edit pencil stays in view. Below about 460px the
   rows scroll inside the card. */
#changelist-form { container:tl-results / inline-size; min-width:0; }
/* Keeps the screen-reader-only unit names (position: absolute) inside the scrolling
   rows, so they can't widen the whole page when the rows scroll sideways. */
#changelist-form .results { position:relative; }
@container tl-results (max-width: 760px) {
  /* Header spacing comes from Django's padded .text link/span (the th itself has none) */
  #result_list thead th .text > a, #result_list thead th .text > span { padding-left:6px; padding-right:6px; }
  #result_list tbody td, #result_list tbody th { padding:8px 6px; }
}
#changelist-form .actions { box-sizing:border-box; width:100%; padding:8px 12px; background:#fbfcfd; border-bottom:1px solid #f4f4f4; margin:0; }
.paginator { box-sizing:border-box; width:100%; padding:10px 12px; font-size:13px; color:#6b6b6b; border-top:1px solid #f4f4f4; background:#fff; }
/* Links on plain white only: the spec's #357da7 (4.52:1). */
.paginator a:link, .paginator a:visited { color:#357da7; background:transparent; }
.paginator .this-page { font-weight:700; color:#444; }
/* Wide screens: the filter card sits beside the results, pinned below the admin
   header, and scrolls inside itself so the page never has to. initResultsScroll()
   tightens max-height to the space actually left in the window. */
#changelist-filter { grid-column:2; grid-row:1; align-self:start; position:sticky; top:calc(var(--qa-admin-top-h, 0px) + 16px); max-height:calc(100vh - var(--qa-admin-top-h, 0px) - 32px); overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:#8a929e #f4f4f4; box-sizing:border-box; width:auto; margin:0; padding:0 0 8px; background:#fff; border-top:3px solid #424f57; box-shadow:0 1px 1px rgba(0,0,0,.1); }
#changelist-filter h2 { display:flex; align-items:center; gap:8px; font-size:18px; font-weight:400; line-height:1; color:#444; margin:0; padding:10px 12px; border-bottom:1px solid #f4f4f4; background:#fff; text-transform:none; }
#changelist-filter h2::before { font-family:FontAwesome; content:"\f0b0"; font-size:14px; color:#555; }
#changelist-filter #changelist-filter-clear { margin:0; padding:8px 12px 0; background:transparent; border:0; }
#changelist-filter #changelist-filter-clear a { color:#357da7; font-size:12px; font-weight:600; text-decoration:none; }
/* The filter card is always white: set the text colour here too, because the dark
   admin theme's light text is inherited as a computed colour, not via variables. */
#changelist-filter { color:#333; }
/* Django 4.2 renders each filter as <details><summary>By …</summary><ul>…</ul></details>. */
#changelist-filter details { margin:0; }
#changelist-filter details > summary { display:flex; align-items:center; gap:6px; list-style:none; font-size:11px; font-weight:700; line-height:1.3; text-transform:uppercase; letter-spacing:.03em; color:#6e7785; margin:0; padding:14px 12px 6px; cursor:pointer; }
#changelist-filter details > summary::-webkit-details-marker { display:none; }
#changelist-filter details > summary::before { font-family:FontAwesome; content:"\f0da"; flex:none; width:8px; font-size:12px; font-weight:400; color:#6e7785; }
#changelist-filter details[open] > summary::before { content:"\f0d7"; }
#changelist-filter details > summary:hover, #changelist-filter details > summary:hover::before { color:#444; }
#changelist-filter details > summary:focus-visible { outline:2px solid #3c8dbc; outline-offset:-2px; }
/* base_site.html forces overflow-y:scroll on every admin filter list; these are short. */
#changelist-filter ul { list-style:none; margin:0; padding:0 8px; border:0; display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
#changelist-filter ul li, #changelist-filter ul li.selected { margin:0; padding:0; border:0; }
#changelist-filter ul li a { display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:3px; font-size:13px; color:#444; text-decoration:none; }
#changelist-filter ul li a:hover { background:#f5f7fa; color:#333; }
#changelist-filter ul li.selected a { font-weight:600; color:#333; }
/* Radio-style marker: a circle on purpose (it reads as "pick one"), 3:1 against white. */
#changelist-filter ul li a::before { content:''; flex:none; box-sizing:border-box; width:15px; height:15px; border:1px solid #8a929e; border-radius:50%; background:#fff; }
#changelist-filter ul li.selected a::before { border-color:#3c8dbc; background:#3c8dbc; box-shadow:inset 0 0 0 3px #fff; }
#changelist.filtered > .changelist-inner { min-width:0; }
/* Narrow screens: one column, filter card above the results with its groups side by side. */
@media (max-width: 1024px) {
  #changelist.filtered { grid-template-columns:minmax(0, 1fr); row-gap:12px; }
  #changelist.filtered > .changelist-inner { grid-column:1; grid-row:2; }
  #changelist.filtered > #changelist-filter { grid-column:1; grid-row:1; position:static; max-height:none; overflow:visible; display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); align-items:start; column-gap:8px; }
  #changelist-filter > h2, #changelist-filter > #changelist-filter-clear { grid-column:1 / -1; }
  #changelist-filter ul { max-height:180px; }
  .tl-results-head { flex-wrap:wrap; }
  .tl-results-search { flex:1 1 280px; min-width:0; }
  .tl-results-search #changelist-search > div { max-width:none; }
  .tl-results-search #searchbar { min-width:0; flex:1 1 auto; width:auto; }
  /* With the filter on top the space left below the rows is often nothing, so allow
     roughly a screen of rows instead (initResultsScroll() refines this inline to fit
     below the pinned admin header). */
  #changelist-form .results { max-height:min(560px, calc(100vh - 220px)); }
}
