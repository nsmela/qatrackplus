{# The status label (design spec .service-event-status-label): the name in black on a transparent box bordered in the status colour, which comes from an inline border-color. Used by the Statuses, Auto Review Rules and Auto Review Rule Sets pages. Included inside a <style> block. #}
#content-main .qcs-label {
  display: inline-block; box-sizing: border-box; padding: .2em .6em .3em; margin: 0;
  font-family: 'Source Sans Pro', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 12px; font-weight: 600; line-height: 1.1; letter-spacing: normal; text-transform: none;
  color: #000 !important; background: transparent; border: 2px solid #d2d6de; border-radius: 2px;
  white-space: nowrap; vertical-align: baseline; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
#content-main .qcs-label-empty { color: #6d7787 !important; font-style: italic; font-weight: 400; }
